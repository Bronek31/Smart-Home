<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<title>Smart Home</title>
<!--
  Dawna zakładka „Rośliny". Dziś rośliny, ich wykresy i obsługa powiadomień są w index.html
  (#rosliny, #fikus…, #powiadomienia), a ten plik tylko przekierowuje stare adresy:
  doręczone powiadomienia i kolejka push (url rosliny.html#roslina=…), cel kliknięcia
  zapisany przez stary service worker, zakładki przeglądarki. Bez niego Pages oddałby 404,
  a service worker przy 404 nie podaje zapasu.
  Hash zostaje bez zmian: tłumaczenie #roslina=<nazwa> na adres rośliny jest tylko
  w index.html (jedno miejsce mapowania nazwy na slug). Bez hasha — lista roślin.
  Meta refresh to zapas na przeglądarkę bez JS, dlatego w <noscript>: przy działającym JS
  nie istnieje, więc nie ściga się z location.replace o to, który adres wygra (hash).
-->
<script>location.replace('./' + (location.hash || '#rosliny'));</script>
<noscript><meta http-equiv="refresh" content="0;url=./#rosliny"></noscript>
<style>html,body{margin:0;min-height:100%;background:#0f1419}</style>
</head>
<body></body>
</html>
