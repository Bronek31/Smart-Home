<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f1419">
<title>Smart Home</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0d1217;--panel:#151c23;--panel2:#19232c;--edge:#293641;--text:#e7edf2;--muted:#8393a0;--faint:#566572;--ok:#5fce9e;--warn:#e8a13c;--bad:#e2708f;--blue:#62b8df;--gap:clamp(14px,2.5vw,28px)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1000px 500px at 50% -10%,#1c2731 0,transparent 65%),var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}.sheet{max-width:1180px;margin:auto;padding:var(--gap) var(--gap) 60px}.mast{display:flex;align-items:end;gap:14px;border-bottom:1px solid var(--edge);padding-bottom:12px}.mast h1{margin:0;font-size:clamp(25px,4vw,36px);letter-spacing:-.04em}.stamp{margin-left:auto;color:var(--muted);font-size:12px}.section-title{margin:28px 0 9px;color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--edge);border:1px solid var(--edge)}.card{background:var(--panel);padding:15px}.k{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.12em}.big{font-size:25px;margin-top:4px;font-variant-numeric:tabular-nums}.sub{color:var(--muted);font-size:12px;margin-top:4px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}.roomgrid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.panel{background:var(--panel);border:1px solid var(--edge);padding:16px}.panel h2{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin:0 0 14px}.floor{position:relative;display:grid;grid-template-columns:1.25fr .75fr;grid-template-rows:1fr 1fr;gap:8px;min-height:430px;background:#10171d;padding:8px;border:1px solid var(--edge)}.room{position:relative;background:var(--panel2);border:1px solid #3b4a55;padding:16px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}.room:before{content:"";position:absolute;inset:0;border:1px solid rgba(255,255,255,.025);pointer-events:none}.room.kitchen{grid-row:1/3}.room h3{margin:0;font-size:15px}.room .rval{font-size:31px;font-variant-numeric:tabular-nums;letter-spacing:-.04em}.room .rh{color:var(--muted);font-size:13px}.room .health{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px;border-top:1px solid var(--edge);padding-top:9px}.room.ok{border-color:#35594b}.room.warn{border-color:#73572f}.room.bad{border-color:#714052}.legend{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin-top:10px}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.events{display:flex;flex-direction:column}.event{padding:11px 0;border-bottom:1px solid var(--edge);display:grid;grid-template-columns:8px 1fr auto;gap:9px}.event:last-child{border-bottom:0}.event .edot{width:7px;height:7px;border-radius:50%;background:var(--ok);margin-top:6px}.event.warn .edot{background:var(--warn)}.event.bad .edot{background:var(--bad)}.event small{color:var(--faint);white-space:nowrap}.controls{display:flex;gap:6px;flex-wrap:wrap;margin:24px 0 8px}.range{border:1px solid var(--edge);background:transparent;color:var(--muted);padding:6px 11px;cursor:pointer}.range.active{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:700}.plot{height:290px;background:var(--panel);border:1px solid var(--edge);padding:10px;margin-bottom:20px}.health{overflow-x:auto}.health table{width:100%;border-collapse:collapse;min-width:760px}.health th,.health td{padding:10px 9px;border-bottom:1px solid var(--edge);text-align:right;font-variant-numeric:tabular-nums}.health th{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em}.health th:first-child,.health td:first-child{text-align:left}.health td:first-child{font-weight:600}.warn-text{color:var(--warn)}.bad-text{color:var(--bad)}.ok-text{color:var(--ok)}.battery{display:inline-flex;align-items:center;gap:6px}.batterybar{width:32px;height:7px;border:1px solid var(--faint);display:inline-block}.batterybar span{display:block;height:100%;background:var(--ok)}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.roomgrid{grid-template-columns:1fr}.floor{min-height:360px}}@media(max-width:520px){.grid{grid-template-columns:1fr}.floor{grid-template-columns:1fr;grid-template-rows:repeat(4,160px)}.room.kitchen{grid-row:auto}.stamp{display:none}}
</style>
</head>
<body><main class="sheet">
<header class="mast"><h1>◒ Smart Home</h1><span class="stamp" id="stamp">ładowanie…</span></header>
<section id="app" hidden>
<div class="section-title">Stan systemu</div><div class="grid" id="status"></div>
<div class="section-title">Plan mieszkania · aktualny stan</div>
<div class="roomgrid"><section class="panel"><div class="floor" id="floor"></div><div class="legend"><span><i style="background:var(--ok)"></i>OK</span><span><i style="background:var(--warn)"></i>uwaga</span><span><i style="background:var(--bad)"></i>problem</span></div></section><section class="panel"><h2>Ostatnie zdarzenia</h2><div class="events" id="events"></div></section></div>
<div class="section-title">Łączność z bramką · ostatnie 24 godziny</div><section class="panel health"><table><thead><tr><th>Czujnik</th><th>odczyty</th><th>typowy odstęp</th><th>najdłuższa przerwa</th><th>ciągłość</th><th>bateria</th><th>ostatni</th></tr></thead><tbody id="health"></tbody></table></section>
<div class="controls"><span style="color:var(--muted);padding:7px 4px">Zakres:</span><button class="range" data-hours="24">24 h</button><button class="range active" data-hours="168">7 dni</button><button class="range" data-hours="720">30 dni</button><button class="range" data-hours="0">całość</button></div>
<div class="section-title">Temperatura · °C</div><div class="plot"><canvas id="temp"></canvas></div>
<div class="section-title">Wilgotność względna · %</div><div class="plot"><canvas id="hum"></canvas></div>
</section>
<div id="error" style="display:none" class="panel"></div>
<script>
const ROOMS={"Salon":{"x":0,"order":2},"Kuchnia":{"x":0,"order":1},"Łazienka":{"x":1,"order":3},"Sypialnia":{"x":1,"order":4}};
const COLORS=['#e8a13c','#62b8df','#5fce9e','#e2708f'];let manifest,rows=[],hours=168,tempChart,humChart;
const $=s=>document.querySelector(s); const fmtAgo=ms=>{if(!ms)return 'brak';const m=Math.max(0,Math.round((Date.now()-ms)/60000));if(m<1)return 'teraz';if(m<60)return m+' min temu';const h=Math.floor(m/60);return h<24?h+' godz. temu':Math.floor(h/24)+' dni temu'};
function clsHealth(coverage,maxGap,expected){if(maxGap>expected*2||coverage<70)return 'bad';if(maxGap>expected*1.5||coverage<90)return 'warn';return 'ok'}
function parseCSV(text){const lines=text.trim().split(/\r?\n/);if(lines.length<2)return [];return lines.slice(1).map(line=>{const p=line.split(',');return {ts:p[0],device_id:p[1],code:p[2],value:p.slice(3).join(',')}})}
async function load(){manifest=await (await fetch('data/index.json?'+Date.now())).json();for(const month of manifest.months){const r=await fetch('data/'+month+'.csv?'+Date.now());if(r.ok)rows.push(...parseCSV(await r.text()))}render();$('#app').hidden=false}
function devices(){return Object.entries(manifest.devices).map(([id,d])=>({id,...d}))}
function lastBy(id,kind){const codes=manifest.devices[id]?.codes||{};const names=Object.keys(codes).filter(c=>codes[c].kind===kind);let a=rows.filter(r=>r.device_id===id&&names.includes(r.code));return a.length?a[a.length-1]:null}
function value(r,scale=0){return r?Number(r.value)/(10**scale):null}
function healthFor(d){const end=Date.now(),start=end-86400000,a=rows.filter(r=>r.device_id===d.id&&new Date(r.ts).getTime()>=start&&new Date(r.ts).getTime()<=end);const tempCode=Object.keys(d.codes).find(c=>d.codes[c].kind==='temp');const ts=[...new Set(a.filter(r=>r.code===tempCode).map(r=>new Date(r.ts).getTime()))].sort((x,y)=>x-y);const gaps=ts.slice(1).map((x,i)=>x-ts[i]);const expected=ts.length>2?median(gaps):3600000;const maxGap=gaps.length?Math.max(...gaps):0;const expectedCount=Math.max(1,Math.round(86400000/expected));const coverage=Math.min(100,Math.round(ts.length/expectedCount*100));const battery=lastBy(d.id,'battery');return {count:ts.length,expected,maxGap,coverage,battery,last:ts.length?ts[ts.length-1]:0,cls:clsHealth(coverage,maxGap,expected)}}
function median(a){if(!a.length)return 0;a=[...a].sort((x,y)=>x-y);return a[Math.floor(a.length/2)]}
function dur(ms){if(ms<60000)return '<1 min';const m=Math.round(ms/60000);if(m<60)return m+' min';if(m<1440)return (m/60).toFixed(m%60?1:0)+' godz.';return (m/1440).toFixed(1)+' dni'}
function batteryText(r){if(!r)return '—';const v=String(r.value).toLowerCase();const pct=v==='high'?100:v==='middle'?60:v==='low'?20:null;return pct===null?v:`<span class="battery"><span class="batterybar"><span style="width:${pct}%"></span></span>${v}</span>`}
function render(){const ds=devices().filter(d=>ROOMS[d.name]);const hs=ds.map(healthFor);const good=hs.filter(h=>h.cls==='ok').length;const online=ds.filter(d=>lastBy(d.id,'temp')&&Date.now()-new Date(lastBy(d.id,'temp').ts).getTime()<2*86400000).length;$('#stamp').textContent='dane zaktualizowane '+new Date(manifest.updated).toLocaleString('pl-PL');$('#status').innerHTML=`<div class="card"><div class="k">Czujniki</div><div class="big">${ds.length}</div><div class="sub">temperatura + wilgotność</div></div><div class="card"><div class="k">Łączność</div><div class="big"><span class="dot ${good===ds.length?'':'warn'}"></span>${good}/${ds.length}</div><div class="sub">stabilnych w ostatnich 24 h</div></div><div class="card"><div class="k">Ostatni odczyt</div><div class="big">${fmtAgo(Math.max(...ds.map(d=>{const r=lastBy(d.id,'temp');return r?new Date(r.ts).getTime():0})))}</div><div class="sub">według zapisanych danych</div></div><div class="card"><div class="k">Zakres danych</div><div class="big">${manifest.months.length} mies.</div><div class="sub">odczyty historyczne</div></div>`;
$('#floor').innerHTML=ds.sort((a,b)=>ROOMS[a.name].order-ROOMS[b.name].order).map(d=>{const t=lastBy(d.id,'temp'),h=lastBy(d.id,'hum'),hh=healthFor(d),c=hh.cls;const tmeta=d.codes[t?.code]?.scale||0;return `<article class="room ${c} ${d.name==='Kuchnia'?'kitchen':''}"><div><h3>${d.name}</h3><div class="rval">${t?value(t,tmeta).toFixed(1):'—'}°</div><div class="rh">${h?value(h,d.codes[h.code]?.scale||0).toFixed(0):'—'}% wilgotności</div></div><div class="health"><span><span class="dot ${c==='ok'?'':c}"></span>${c==='ok'?'OK':c==='warn'?'uwaga':'problem'}</span><span>${fmtAgo(hh.last)}</span></div></article>`}).join('');
$('#health').innerHTML=ds.map(d=>{const h=healthFor(d);return `<tr><td><span class="dot ${h.cls==='ok'?'':h.cls}"></span>${d.name}</td><td>${h.count}</td><td>${dur(h.expected)}</td><td class="${h.cls==='bad'?'bad-text':h.cls==='warn'?'warn-text':''}">${dur(h.maxGap)}</td><td class="${h.coverage<90?'warn-text':'ok-text'}">${h.coverage}%</td><td>${batteryText(h.battery)}</td><td>${fmtAgo(h.last)}</td></tr>`}).join('');
$('#events').innerHTML=hs.sort((a,b)=>b.maxGap-a.maxGap).slice(0,5).map((h,i)=>{const d=ds[i]||ds[0];return `<div class="event ${h.cls==='ok'?'':h.cls}"><span class="edot"></span><div><strong>${d.name}</strong> · ${h.cls==='ok'?'łączność stabilna':h.cls==='warn'?'występują przerwy':'długie przerwy w odczytach'}<br><small>najdłuższa przerwa: ${dur(h.maxGap)}</small></div><small>${fmtAgo(h.last)}</small></div>`}).join('');draw()}
function series(kind,hrs){const cutoff=hrs?Date.now()-hrs*3600000:0;return devices().filter(d=>ROOMS[d.name]).map((d,i)=>{const codes=Object.keys(d.codes).filter(c=>d.codes[c].kind===kind);const data=rows.filter(r=>r.device_id===d.id&&codes.includes(r.code)&&(new Date(r.ts).getTime()>=cutoff)).map(r=>({x:new Date(r.ts),y:value(r,d.codes[r.code].scale||0)}));return {label:d.name,data,borderColor:COLORS[i%COLORS.length],backgroundColor:'transparent',pointRadius:0,borderWidth:1.5,tension:.15}})}
function chart(id,kind){const ctx=$(id);return new Chart(ctx,{type:'line',data:{datasets:series(kind,hours)},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'nearest',intersect:false},scales:{x:{type:'time',time:{tooltipFormat:'dd.MM.yyyy HH:mm'},grid:{color:'#202b34'},ticks:{color:'#71818d',maxTicksLimit:8}},y:{grid:{color:'#202b34'},ticks:{color:'#71818d'}}},plugins:{legend:{labels:{color:'#a9b5bd',boxWidth:18}}}}})}
function draw(){if(tempChart)tempChart.destroy();if(humChart)humChart.destroy();tempChart=chart('#temp','temp');humChart=chart('#hum','hum')}
document.querySelectorAll('.range').forEach(b=>b.onclick=()=>{document.querySelectorAll('.range').forEach(x=>x.classList.remove('active'));b.classList.add('active');hours=Number(b.dataset.hours);draw()});load().catch(e=>{$('#error').style.display='block';$('#error').textContent='Nie udało się wczytać danych: '+e.message})
</script></body></html>
