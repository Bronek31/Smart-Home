<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1419">
<!-- NAZWA STRONY — zmień tutaj i w nagłówku <h1> niżej -->
<title>Smart Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans+Condensed:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<style>
:root{
  --bg:#0f1419;
  --panel:#151c24;
  --edge:#212c36;
  --grid:#1d262f;
  --grid-day:#2f3d4a;
  --text:#e4ebf1;
  --dim:#7d8d9b;
  --faint:#4d5a66;
  --pen-1:#e8a13c;
  --pen-2:#5fb8e0;
  --pen-3:#5fce9e;
  --pen-4:#e2708f;
  --pen-5:#b79ae8;
  --pen-6:#d4c95f;
  --gap:clamp(1rem,3.2vw,2rem);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;
  background:
    radial-gradient(120% 70% at 50% -10%,#1a232c 0%,transparent 60%),
    repeating-linear-gradient(to bottom,transparent 0 31px,rgba(255,255,255,.014) 31px 32px),
    var(--bg);
  color:var(--text);
  font-family:"Familjen Grotesk",system-ui,sans-serif;
  font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
.sheet{max-width:1080px;margin:0 auto;padding:var(--gap) var(--gap) 4rem}

/* nagłówek --------------------------------------------------------------- */
.masthead{
  display:flex;flex-wrap:wrap;align-items:baseline;gap:.4rem 1.2rem;
  padding-bottom:.8rem;border-bottom:1px solid var(--edge);
}
.masthead h1{
  margin:0;font-size:clamp(1.25rem,4.5vw,1.9rem);font-weight:700;
  letter-spacing:-.02em;text-transform:lowercase;
}
.masthead h1 .nib{
  color:var(--pen-1);text-shadow:0 0 14px rgba(232,161,60,.55);
}
.stamp{
  margin-left:auto;font-family:"IBM Plex Sans Condensed",sans-serif;
  font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
}

/* karty odczytów --------------------------------------------------------- */
.pens{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));
  gap:1px;background:var(--edge);border:1px solid var(--edge);
  margin-top:var(--gap);
}
.pen{background:var(--panel);padding:.75rem .9rem .85rem;position:relative;overflow:hidden}
.pen::before{
  content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--c);
  box-shadow:0 0 12px 1px var(--c);opacity:.9;
}
.pen b{
  display:block;font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600;
  font-size:.74rem;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);
  margin:0 0 .35rem .5rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.pen .read{
  display:flex;align-items:baseline;gap:.5rem;margin-left:.5rem;
  font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
}
.pen .t{
  font-size:1.6rem;font-weight:400;color:var(--c);line-height:1;
  text-shadow:0 0 18px color-mix(in srgb,var(--c) 45%,transparent);
}
.pen .h{font-size:.9rem;color:var(--dim)}
.pen .foot{
  display:flex;flex-wrap:wrap;align-items:baseline;gap:.15rem .55rem;
  margin:.4rem 0 0 .5rem;
  font-family:"IBM Plex Sans Condensed",sans-serif;font-size:.71rem;
  letter-spacing:.04em;color:var(--faint);
}
.pen .foot>*{white-space:nowrap}
.pen .trend{font-family:"IBM Plex Mono",monospace;font-weight:500;color:var(--dim)}

/* sterowanie ------------------------------------------------------------- */
.controls{
  display:flex;flex-wrap:wrap;align-items:center;gap:.35rem;
  margin-top:1.4rem;padding-bottom:.6rem;border-bottom:1px solid var(--edge);
  font-family:"IBM Plex Sans Condensed",sans-serif;
}
.controls .lbl{
  font-size:.7rem;letter-spacing:.13em;text-transform:uppercase;
  color:var(--faint);margin-right:.45rem;
}
.range{
  appearance:none;border:1px solid var(--edge);background:transparent;
  color:var(--dim);font:inherit;font-size:.83rem;letter-spacing:.03em;
  padding:.24rem .72rem;cursor:pointer;border-radius:0;transition:.15s;
}
.range:hover{border-color:var(--grid-day);color:var(--text)}
.range[aria-pressed="true"]{
  background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600;
}
.range:focus-visible{outline:2px solid var(--pen-2);outline-offset:2px}
.toggles{display:flex;flex-wrap:wrap;gap:.1rem;margin-left:auto}
.toggle{
  appearance:none;border:0;background:transparent;font:inherit;font-size:.8rem;
  color:var(--dim);padding:.24rem .5rem;cursor:pointer;transition:.15s;
  display:inline-flex;align-items:center;gap:.42rem;
}
.toggle::before{
  content:"";width:9px;height:9px;border-radius:50%;
  background:var(--c);box-shadow:0 0 9px var(--c);
}
.toggle:hover{color:var(--text)}
.toggle[aria-pressed="false"]{opacity:.32}
.toggle[aria-pressed="false"]::before{background:transparent;box-shadow:none;border:1.5px solid var(--c)}
.toggle:focus-visible{outline:2px solid var(--pen-2);outline-offset:1px}

/* wykresy ---------------------------------------------------------------- */
.trace{margin-top:1.7rem}
.trace h2{
  margin:0 0 .5rem;font-family:"IBM Plex Sans Condensed",sans-serif;
  font-size:.74rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);display:flex;align-items:baseline;gap:.55rem;
}
.trace h2 small{font-weight:400;letter-spacing:.06em;color:var(--faint);text-transform:none}
.plot{
  position:relative;height:238px;background:var(--panel);
  border:1px solid var(--edge);
}
@media(min-width:700px){.plot{height:300px}}

/* tabela ----------------------------------------------------------------- */
.summary{width:100%;border-collapse:collapse;margin-top:2.1rem;font-size:.85rem}
.summary caption{
  text-align:left;font-family:"IBM Plex Sans Condensed",sans-serif;
  font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--faint);padding-bottom:.55rem;
}
.summary th,.summary td{
  text-align:right;padding:.45rem .5rem;border-bottom:1px solid var(--edge);
  font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  font-weight:300;color:var(--text);
}
.summary th{
  font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600;font-size:.7rem;
  letter-spacing:.08em;text-transform:uppercase;color:var(--faint);
}
.summary th:first-child,.summary td:first-child{text-align:left}
.summary td:first-child{
  font-family:"Familjen Grotesk",sans-serif;font-weight:400;
  border-left:3px solid var(--c);padding-left:.7rem;
}

/* stany puste ------------------------------------------------------------ */
.notice{
  margin:2.5rem 0;padding:1.4rem 1.5rem;border:1px solid var(--edge);
  background:var(--panel);max-width:44rem;
}
.notice h2{margin:0 0 .55rem;font-size:1.05rem;font-weight:700}
.notice p{margin:.45rem 0;color:var(--dim);font-size:.92rem}
.notice code{
  font-family:"IBM Plex Mono",monospace;font-size:.85em;color:var(--pen-1);
  background:#0b1015;padding:.12em .42em;border:1px solid var(--edge);
}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="sheet">

  <header class="masthead">
    <!-- NAZWA STRONY — druga z dwóch linijek do zmiany -->
    <h1><span class="nib">&#9134;</span> termohigrograf</h1>
    <span class="stamp" id="stamp">wczytywanie&hellip;</span>
  </header>

  <section id="app" hidden>
    <div class="pens" id="pens"></div>

    <div class="controls">
      <span class="lbl">Zakres</span>
      <button class="range" data-hours="24">24 h</button>
      <button class="range" data-hours="168" aria-pressed="true">7 dni</button>
      <button class="range" data-hours="720">30 dni</button>
      <button class="range" data-hours="0">całość</button>
      <div class="toggles" id="toggles"></div>
    </div>

    <div class="trace">
      <h2>Temperatura <small>&deg;C</small></h2>
      <div class="plot"><canvas id="temp"></canvas></div>
    </div>

    <div class="trace">
      <h2>Wilgotność względna <small>%</small></h2>
      <div class="plot"><canvas id="hum"></canvas></div>
    </div>

    <table class="summary" id="summary"></table>
    <table class="summary" id="health"></table>
  </section>

  <div class="notice" id="notice" hidden></div>

</main>

<script>
const PENS = ['#e8a13c','#5fb8e0','#5fce9e','#e2708f','#b79ae8','#d4c95f'];
const CSS = getComputedStyle(document.documentElement);
const C = n => CSS.getPropertyValue(n).trim();

const state = { hours: 168, devices: [], rows: [], off: new Set(), charts: {} };
const monthCache = new Map();

const fmtNum = (v, d = 1) =>
  v == null || !isFinite(v) ? '–' : v.toFixed(d).replace('.', ',');

const pad = n => String(n).padStart(2, '0');
const isMidnight = d => d.getHours() === 0 && d.getMinutes() === 0;

// Jak na papierze rejestratora: granice doby podpisane datą, między nimi godziny.
function fmtWhen(d, span) {
  if (isMidnight(d) || span > 24 * 14) return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}`;
  if (span <= 36) return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  return `${pad(d.getHours())}:00`;
}

// Chart.js dzieli zakres równo i potrafi nigdy nie trafić w północ — wtedy oś
// pokazuje "19:00, 03:00, 11:00" bez dat i nie wiadomo, który to dzień.
// Dlatego znaczniki wyznaczamy sami, zawsze od lokalnej północy.
const STEPS_H = [1, 2, 3, 6, 12, 24, 48, 72, 96, 120, 168, 336, 720];

function timeTicks(min, max, width) {
  const target = width < 420 ? 5 : width < 760 ? 8 : 11;
  const spanH = (max - min) / 3600e3;
  const step = STEPS_H.find(s => spanH / s <= target) || STEPS_H[STEPS_H.length - 1];

  const first = new Date(min);
  first.setHours(0, 0, 0, 0);   // cofnij do północy tego dnia

  const out = [];
  for (let t = first.getTime(); t <= max; t += step * 3600e3) {
    if (t >= min) out.push({ value: t });
  }
  return out;
}

function fmtDur(ms) {
  if (ms == null || !isFinite(ms)) return '–';
  const min = ms / 60000;
  if (min < 1) return `${Math.round(ms / 1000)} s`;
  if (min < 90) return `${Math.round(min)} min`;
  const h = min / 60;
  if (h < 36) return `${h.toFixed(1).replace('.', ',')} godz.`;
  return `${Math.round(h / 24)} dni`;
}

function fmtAgo(ms) {
  const min = Math.round((Date.now() - ms) / 60000);
  if (min < 2) return 'przed chwilą';
  if (min < 60) return `${min} min temu`;
  const h = Math.round(min / 60);
  if (h < 48) return `${h} godz. temu`;
  return `${Math.round(h / 24)} dni temu`;
}

function fail(title, ...paras) {
  document.getElementById('stamp').textContent = 'brak danych';
  const n = document.getElementById('notice');
  n.innerHTML = `<h2>${title}</h2>` + paras.map(p => `<p>${p}</p>`).join('');
  n.hidden = false;
}

/* --- wczytywanie ---------------------------------------------------------- */

async function loadMonth(m) {
  if (monthCache.has(m)) return monthCache.get(m);
  const res = await fetch(`data/${m}.csv`, { cache: 'no-cache' });
  if (!res.ok) { monthCache.set(m, []); return []; }
  const lines = (await res.text()).trim().split('\n');
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const [ts, id, code, value] = lines[i].split(',');
    if (!ts) continue;
    rows.push({ t: Date.parse(ts), id, code, v: parseFloat(value) });
  }
  monthCache.set(m, rows);
  return rows;
}

async function boot() {
  let manifest;
  try {
    const res = await fetch('data/index.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error(res.status);
    manifest = await res.json();
  } catch {
    return fail('Nie ma jeszcze żadnych odczytów',
      'Plik <code>data/index.json</code> pojawi się po pierwszym udanym przebiegu kolektora.',
      'Wejdź w zakładkę <b>Actions</b> w repozytorium, wybierz <b>Zbieranie odczytów</b> i kliknij <b>Run workflow</b>.');
  }

  const ids = Object.keys(manifest.devices || {});
  if (!ids.length || !(manifest.months || []).length) {
    return fail('Kolektor działa, ale nie znalazł czujników',
      'Uruchom lokalnie <code>python fetch.py --discover</code> i sprawdź, czy urządzenia mają pola z temperaturą lub wilgotnością.');
  }

  state.devices = ids.map((id, i) => {
    const d = manifest.devices[id];
    const codes = d.codes || {};
    return {
      id,
      name: d.name || id,
      color: PENS[i % PENS.length],
      temp: Object.keys(codes).find(c => codes[c].kind === 'temp'),
      hum:  Object.keys(codes).find(c => codes[c].kind === 'hum'),
    };
  });

  const months = manifest.months.slice().sort();
  state.rows = (await Promise.all(months.map(loadMonth))).flat().sort((a, b) => a.t - b.t);

  if (!state.rows.length) {
    return fail('Pliki z danymi są puste',
      'Czujniki nie zaraportowały nic w oknie 7 dni albo pierwszy przebieg dopiero się wykonał.');
  }

  // Nie pokazujmy widoku 7-dniowego, gdy czujniki działają od trzech godzin.
  const spanH = (state.rows[state.rows.length - 1].t - state.rows[0].t) / 3600e3;
  state.hours = spanH <= 24 ? 24 : spanH <= 168 ? 168 : spanH <= 720 ? 720 : 0;

  document.getElementById('app').hidden = false;
  buildToggles();
  wireRanges();
  document.querySelectorAll('.range').forEach(b => {
    b.toggleAttribute('aria-pressed', +b.dataset.hours === state.hours);
    if (+b.dataset.hours === state.hours) b.setAttribute('aria-pressed', 'true');
  });
  render();
}

/* --- sterowanie ----------------------------------------------------------- */

function buildToggles() {
  const box = document.getElementById('toggles');
  box.innerHTML = '';
  state.devices.forEach(d => {
    const b = document.createElement('button');
    b.className = 'toggle';
    b.style.setProperty('--c', d.color);
    b.setAttribute('aria-pressed', 'true');
    b.textContent = d.name;
    b.onclick = () => {
      const on = b.getAttribute('aria-pressed') === 'true';
      b.setAttribute('aria-pressed', String(!on));
      on ? state.off.add(d.id) : state.off.delete(d.id);
      render();
    };
    box.appendChild(b);
  });
}

function wireRanges() {
  document.querySelectorAll('.range').forEach(b => {
    b.onclick = () => {
      document.querySelectorAll('.range').forEach(o => o.removeAttribute('aria-pressed'));
      b.setAttribute('aria-pressed', 'true');
      state.hours = +b.dataset.hours;
      render();
    };
  });
}

/* --- przetwarzanie -------------------------------------------------------- */

function bucket(points, limit = 900) {
  if (points.length <= limit) return points;
  const size = Math.ceil(points.length / limit);
  const out = [];
  for (let i = 0; i < points.length; i += size) {
    const slice = points.slice(i, i + size);
    out.push({
      x: slice[Math.floor(slice.length / 2)].x,
      y: slice.reduce((s, p) => s + p.y, 0) / slice.length,
    });
  }
  return out;
}

function series(kind) {
  const from = state.hours ? Date.now() - state.hours * 3600e3 : 0;
  return state.devices
    .filter(d => d[kind] && !state.off.has(d.id))
    .map(d => {
      const pts = state.rows
        .filter(r => r.id === d.id && r.code === d[kind] && r.t >= from && isFinite(r.v))
        .map(r => ({ x: r.t, y: r.v }));
      return { device: d, points: bucket(pts) };
    })
    .filter(s => s.points.length);
}

// Odczyty bez uśredniania — diagnostyka musi widzieć każdy pojedynczy raport.
function rawPoints(device, kind, from) {
  if (!device[kind]) return [];
  return state.rows.filter(r =>
    r.id === device.id && r.code === device[kind] && r.t >= from && isFinite(r.v));
}

// Ostatni odczyt danego pola oraz ten sprzed doby — do policzenia trendu.
function readings(device, kind) {
  if (!device[kind]) return { last: null, dayAgo: null };
  const cutoff = Date.now() - 24 * 3600e3;
  let last = null, dayAgo = null;
  for (const r of state.rows) {
    if (r.id !== device.id || r.code !== device[kind] || !isFinite(r.v)) continue;
    last = r;
    if (r.t <= cutoff) dayAgo = r;
  }
  return { last, dayAgo };
}

/* --- rysowanie ------------------------------------------------------------ */

// Świecenie krzywych: panel przyrządowy nocą, nie płaska kreska.
const glow = {
  id: 'glow',
  beforeDatasetDraw(chart, args) {
    const { ctx } = chart;
    ctx.save();
    ctx.shadowColor = chart.data.datasets[args.index].borderColor;
    ctx.shadowBlur = 9;
  },
  afterDatasetDraw(chart) { chart.ctx.restore(); },
};

// Pióro spoczywające na papierze: znacznik ostatniej wartości na prawej krawędzi.
const nib = {
  id: 'nib',
  afterDatasetsDraw(chart) {
    const { ctx, chartArea } = chart;
    chart.data.datasets.forEach((ds, i) => {
      const meta = chart.getDatasetMeta(i);
      if (meta.hidden || !meta.data.length) return;
      const last = meta.data[meta.data.length - 1];
      if (!last || last.y < chartArea.top || last.y > chartArea.bottom) return;
      ctx.save();
      ctx.fillStyle = ds.borderColor;
      ctx.shadowColor = ds.borderColor;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.moveTo(chartArea.right + 2, last.y);
      ctx.lineTo(chartArea.right + 11, last.y - 5);
      ctx.lineTo(chartArea.right + 11, last.y + 5);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    });
  },
};

function draw(canvasId, sets, unit, decimals) {
  const span = state.hours || 24 * 400;
  const cfg = {
    type: 'line',
    data: {
      datasets: sets.map(s => ({
        label: s.device.name,
        data: s.points,
        borderColor: s.device.color,
        backgroundColor: s.device.color,
        borderWidth: 1.5,
        pointRadius: 0,
        pointHitRadius: 12,
        tension: .18,
        spanGaps: 3 * 3600e3,
      })),
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      interaction: { mode: 'index', intersect: false },
      layout: { padding: { right: 16, top: 6 } },
      scales: {
        x: {
          type: 'time',
          afterBuildTicks: s => { s.ticks = timeTicks(s.min, s.max, s.chart.width); },
          border: { color: C('--edge') },
          grid: {
            tickLength: 4,
            color: ctx => ctx.tick && isMidnight(new Date(ctx.tick.value))
              ? C('--grid-day') : C('--grid'),
          },
          ticks: {
            color: C('--dim'),
            font: { family: 'IBM Plex Sans Condensed', size: 11 },
            maxRotation: 0,
            autoSkip: false,
            callback: v => fmtWhen(new Date(v), span),
          },
        },
        y: {
          border: { color: C('--edge') },
          grid: { color: C('--grid') },
          ticks: {
            color: C('--dim'),
            font: { family: 'IBM Plex Mono', size: 11 },
            callback: v => fmtNum(v, 0),
          },
        },
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#080c10',
          titleColor: C('--dim'),
          bodyColor: C('--text'),
          borderColor: C('--grid-day'),
          borderWidth: 1,
          cornerRadius: 0,
          padding: 10,
          titleFont: { family: 'IBM Plex Sans Condensed', size: 11, weight: '600' },
          bodyFont: { family: 'IBM Plex Mono', size: 12 },
          callbacks: {
            title: items => new Intl.DateTimeFormat('pl-PL', {
              day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit',
            }).format(new Date(items[0].parsed.x)),
            label: item => ` ${item.dataset.label}  ${fmtNum(item.parsed.y, decimals)} ${unit}`,
          },
        },
      },
    },
    plugins: [glow, nib],
  };

  state.charts[canvasId]?.destroy();
  state.charts[canvasId] = new Chart(document.getElementById(canvasId), cfg);
}

function renderPens() {
  const box = document.getElementById('pens');
  box.innerHTML = '';
  state.devices.forEach(d => {
    const t = readings(d, 'temp'), h = readings(d, 'hum');
    const when = Math.max(t.last?.t || 0, h.last?.t || 0);

    let trend = '';
    if (t.last && t.dayAgo) {
      const diff = t.last.v - t.dayAgo.v;
      const arrow = diff > .05 ? '▲' : diff < -.05 ? '▼' : '=';
      trend = `<span class="trend">${arrow} ${fmtNum(Math.abs(diff))}° 24h</span>`;
    }

    const el = document.createElement('div');
    el.className = 'pen';
    el.style.setProperty('--c', d.color);
    el.innerHTML =
      `<b>${d.name}</b>
       <div class="read">
         <span class="t">${fmtNum(t.last?.v, 1)}&deg;</span>
         <span class="h">${fmtNum(h.last?.v, 0)}%</span>
       </div>
       <div class="foot"><span>${when ? fmtAgo(when) : 'brak odczytu'}</span>${trend}</div>`;
    box.appendChild(el);
  });
}


// Diagnostyka łączności: czy bramka faktycznie słyszy każdy czujnik i czy
// temperatura z wilgotnością przychodzą w tym samym raporcie.
function renderHealth() {
  const from = state.hours ? Date.now() - state.hours * 3600e3 : 0;
  const warn = C('--pen-1');

  const rows = state.devices.map(d => {
    const T = rawPoints(d, 'temp', from);
    const H = rawPoints(d, 'hum', from);

    const times = T.map(r => r.t);
    const gaps = times.slice(1).map((t, i) => t - times[i]);
    const sorted = gaps.slice().sort((a, b) => a - b);
    const median = sorted.length ? sorted[Math.floor(sorted.length / 2)] : null;
    const worst = gaps.length ? Math.max(...gaps) : null;

    const humTimes = new Set(H.map(r => r.t));
    const paired = T.length ? T.filter(r => humTimes.has(r.t)).length / T.length : null;

    const last = Math.max(T.length ? T[T.length - 1].t : 0,
                          H.length ? H[H.length - 1].t : 0);
    return { d, nT: T.length, nH: H.length, median, worst, paired, last };
  });

  // Przerwa dłuższa niż pięciokrotność typowego odstępu to sygnał, że czujnik
  // wypadał z zasięgu. Przy garstce odczytów mediana jest bez znaczenia.
  const suspicious = r =>
    r.nT >= 6 && r.median != null && r.worst != null && r.worst > 5 * r.median;

  document.getElementById('health').innerHTML =
    `<caption>Łączność z bramką &middot; ${rangeLabel()}</caption>
     <thead><tr>
       <th>Czujnik</th><th>temp.</th><th>wilg.</th>
       <th>typowy odstęp</th><th>najdłuższa przerwa</th>
       <th>razem</th><th>ostatni</th>
     </tr></thead><tbody>` +
    rows.map(r => {
      const gapStyle = suspicious(r) ? ` style="color:${warn}"` : '';
      const pairStyle = r.paired != null && r.paired < .8 ? ` style="color:${warn}"` : '';
      return `<tr style="--c:${r.d.color}">
        <td>${r.d.name}</td>
        <td>${r.nT}</td><td>${r.nH}</td>
        <td>${fmtDur(r.median)}</td>
        <td${gapStyle}>${fmtDur(r.worst)}</td>
        <td${pairStyle}>${r.paired == null ? '–' : Math.round(r.paired * 100) + '%'}</td>
        <td>${r.last ? fmtAgo(r.last) : '–'}</td>
      </tr>`;
    }).join('') + '</tbody>';
}

function renderSummary(tempSets, humSets) {
  const stats = pts => {
    const ys = pts.map(p => p.y);
    return ys.length
      ? { min: Math.min(...ys), max: Math.max(...ys), avg: ys.reduce((a, b) => a + b, 0) / ys.length }
      : null;
  };
  const byId = sets => Object.fromEntries(sets.map(s => [s.device.id, stats(s.points)]));
  const T = byId(tempSets), H = byId(humSets);
  const shown = state.devices.filter(d => T[d.id] || H[d.id]);

  document.getElementById('summary').innerHTML =
    `<caption>Zakresy &middot; ${rangeLabel()}</caption>
     <thead><tr>
       <th>Czujnik</th><th>min &deg;C</th><th>śr &deg;C</th><th>max &deg;C</th>
       <th>min %</th><th>śr %</th><th>max %</th>
     </tr></thead><tbody>` +
    shown.map(d => {
      const t = T[d.id], h = H[d.id];
      return `<tr style="--c:${d.color}">
        <td>${d.name}</td>
        <td>${fmtNum(t?.min)}</td><td>${fmtNum(t?.avg)}</td><td>${fmtNum(t?.max)}</td>
        <td>${fmtNum(h?.min, 0)}</td><td>${fmtNum(h?.avg, 0)}</td><td>${fmtNum(h?.max, 0)}</td>
      </tr>`;
    }).join('') + '</tbody>';
}

function rangeLabel() {
  const base = { 24: 'ostatnie 24 godziny', 168: 'ostatnie 7 dni',
                 720: 'ostatnie 30 dni', 0: 'cała historia' }[state.hours];
  const oldest = state.rows[0]?.t;
  const from = state.hours ? Date.now() - state.hours * 3600e3 : 0;
  // Nie udawajmy tygodnia, jeśli czujniki działają od paru godzin.
  if (oldest && oldest > from + 3600e3) {
    return `${base} · dane od ${new Intl.DateTimeFormat('pl-PL',
      { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })
      .format(new Date(oldest))}`;
  }
  return base;
}

function render() {
  const tempSets = series('temp');
  const humSets = series('hum');
  renderPens();
  draw('temp', tempSets, '°C', 1);
  draw('hum', humSets, '%', 0);
  renderSummary(tempSets, humSets);
  renderHealth();

  const newest = state.rows[state.rows.length - 1]?.t;
  document.getElementById('stamp').textContent =
    'ostatni zapis · ' + new Intl.DateTimeFormat('pl-PL', {
      day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit',
    }).format(new Date(newest));
}

boot();
</script>
</body>
</html>
