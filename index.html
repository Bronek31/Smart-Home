<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<title>Smart Home</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="ikona.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="ikona-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Smart Home">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans+Condensed:wght@500&amp;display=swap">
<style>
/* Smart Home — aplikacja (dom i rośliny), wdrożony projekt z rundy 3 i 4.
   Baza: propozycja 1 (system, nawigacja, Dom, lista roślin, Historia). Z propozycji 2: strona pokoju,
   strona dworu i szczegół rośliny. Nowe: zakładka Powiadomienia, przesuwanie stron. Runda 4: „Ostatnie 30 dni”
   jako cztery małe wykresy zakresów doby, prognoza podlewania, „Zamknij okno?”, „Przewietrz przed snem”.
   Siatka 4/8 px. Pismo: 12/13/15/17/20/28/34/56 (linie 16/16/20/24/24/32/40/56).
   Grubości: Familjen 400 i 600, Plex Mono 400 i 500, Plex Sans Condensed 500.
   Zaokrąglenia: 10 px małe elementy, 20 px karty i arkusz, pełne dla pigułek.
   Ikony: siatka 24, kreska 1,75 px przy każdym rozmiarze. Jeden ciemny motyw. */
:root{
  color-scheme:dark;
  --bg:#0f1419;--panel:#151c24;--panel-2:#1a232c;--panel-3:#222d38;--edge:#212c36;--edge-2:#2c3a46;--grid:#1e2831;
  --text:#e4ebf1;--dim:#a6b7c4;--faint:#8496a5;--ink:#0f1419;
  --ok:#5fce9e;--warn:#e8a13c;--bad:#ef6a5b;--warn-t:#f2c47e;--bad-t:#ffb9ae;--akcent:#8fd0f0;--focus:#a8dcf7;
  --gleba:#74c7f2;--swiatlo:#f5e9c4;--granica:#c3ccd4;--scrim:rgba(6,9,12,.66);
  --warn-tlo:#211d17;--warn-ramka:#5a4421;--bad-tlo:#22191b;--bad-ramka:#5e3330;--ok-pole:#22433b;--ok-pole-2:#1f3a35;
  --sw-wyl:#33414d;--sw-galka:#f4f7fa;
  /* podświetlenie wybranej kolumny: na panelu wychodzi kolor --panel-3, a na polu komfortu pole zostaje widoczne */
  --podswietl:rgba(228,235,241,.07);
  /* skala sekwencyjna rytmu doby */
  --sk0:#544a7e;--sk1:#655a9f;--sk2:#776dc3;--sk3:#8b85e0;--sk4:#a2a3f4;--sk5:#bec3fe;--sk6:#d8e0ff;
  --f-t:"Familjen Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-l:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --f-e:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --r-s:10px;--r-k:20px;--r-p:999px;
  --g:16px;--zakladki:64px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/20px var(--f-t);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p,ul,ol,dl,dd,figure{margin:0}
b,strong{font-weight:600}
ul,ol{padding:0;list-style:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit;touch-action:manipulation}
button:disabled{cursor:default}
input,select{font:inherit;color:inherit;margin:0}
svg{display:block}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
.ik{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ik.m{width:20px;height:20px;stroke-width:2.1}
.ik.s{width:16px;height:16px;stroke-width:2.625}
.ik.l{width:32px;height:32px;stroke-width:1.3125}
.ik.xl{width:40px;height:40px;stroke-width:1.05}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pc{margin:0 -.14em}
.u{font-family:var(--f-t);font-weight:400;letter-spacing:0;color:var(--dim)}
.st{font-family:var(--f-t);font-weight:400;letter-spacing:0;color:var(--dim)}
.kropka{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--k);flex:none}
.ok-t{color:var(--ok)}
.warn-t{color:var(--warn-t)}

.app{position:relative;max-width:430px;min-height:100vh;min-height:100dvh;margin:0 auto;overflow-x:clip}
@media (min-width:470px){.app,.zakladki{border-left:1px solid var(--edge);border-right:1px solid var(--edge)}}

/* nagłówek nawigacji: wstecz · tytuł · ‹ 2/4 › */
/* Na iPhonie aplikacja z ekranu ma przezroczysty pasek stanu (black-translucent) i rysuje się pod nim. Nagłówek
   przykleja się do samej góry i sam zakrywa pas pod zegarem (padding w kolorze tła) — przy top:env(…) zostawał nad
   nim pas, przez który przewijała się treść. env() działa tylko przy viewport-fit=cover; poza iPhonem daje 0. */
.nav{position:-webkit-sticky;position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
.nav-rzad{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;min-height:48px;padding:0 4px;border-bottom:1px solid transparent;transition:border-color .2s}
.nav.zwiniety .nav-rzad{border-bottom-color:var(--edge)}
.nav-t{max-width:180px;max-width:calc(min(100vw,430px) - 244px);font:600 17px/24px var(--f-t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .2s}
.nav.zwiniety .nav-t{opacity:1}
/* na zakładkach nie ma „wstecz” ani strzałek, więc tytuł może zająć prawie całą szerokość */
.nav.korzen .nav-t{max-width:calc(100vw - 32px);max-width:calc(min(100vw,430px) - 32px)}
.nav-l{justify-self:start;min-width:0}
.nav-p{position:relative;z-index:0;justify-self:end;display:flex;align-items:center}
.nav-p::before{content:"";position:absolute;top:6px;bottom:6px;left:4px;right:4px;z-index:-1;border-radius:var(--r-p);background:var(--panel-3)}
.nav-p .ikb{color:var(--dim)}
.nav-p .ikb[aria-disabled="true"]{color:var(--faint);opacity:.35}
.wstecz{display:inline-flex;align-items:center;min-height:44px;padding:0 12px 0 4px;color:var(--akcent);font:400 17px/24px var(--f-t);white-space:nowrap}
.wstecz .ik{margin-right:2px}
.ikb{display:grid;place-items:center;width:44px;height:44px;border-radius:var(--r-p);color:var(--akcent)}
.ikb[aria-disabled="true"]{color:var(--edge-2)}
.licznik{min-width:28px;text-align:center;font:400 13px/16px var(--f-l);color:var(--faint)}

/* widoki */
.widok{padding:0 var(--g) calc(var(--zakladki) + env(safe-area-inset-bottom,0px) + 32px)}
.pager{position:relative;overflow-x:hidden;overflow-x:clip;touch-action:pan-y;touch-action:pan-y pinch-zoom}
.tasma{position:relative}
.tasma.ruch{will-change:transform}
.pager.w-gescie{-webkit-user-select:none;user-select:none}
.strona{position:relative;display:flow-root;padding:0 var(--g) calc(var(--zakladki) + env(safe-area-inset-bottom,0px) + 32px);background:var(--bg)}
.strona.sasiad{position:absolute;top:0;left:100%;width:100%}
.strona.sasiad.lewy{left:-100%}
.strona.sasiad.uspiony{left:0;height:0;overflow:hidden;visibility:hidden}
html.powiekszony .pager,html.powiekszony .w-svg,html.powiekszony .rytm svg,html.powiekszony .m30{touch-action:auto}
.duzy{margin-top:4px;font:600 34px/40px var(--f-t);letter-spacing:-.02em;overflow-wrap:anywhere}
.duzy-k{display:flex;align-items:center;gap:12px}
.duzy-k .kropka{width:12px;height:12px}
.podtytul{margin-top:4px;font:400 15px/20px var(--f-t);color:var(--dim)}

/* sekcje, karty, listy */
.sekcja{margin-top:32px}
.sekcja-g{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sekcja h2{font:600 20px/24px var(--f-t)}
.sekcja-pop{font:400 13px/16px var(--f-t);color:var(--faint);white-space:nowrap}
.karta{display:block;width:100%;padding:16px;border-radius:var(--r-k);background:var(--panel);border:1px solid var(--edge);text-align:left}
.lista{border-radius:var(--r-k);background:var(--panel);border:1px solid var(--edge);overflow:hidden}
.wiersz{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 16px;text-align:left}
.wiersz+.wiersz::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--edge)}
.wiersz-n{flex:1;min-width:0;font:400 15px/20px var(--f-t)}
.wiersz-n small{display:block;margin-top:2px;font:400 13px/16px var(--f-t);color:var(--faint)}
.wiersz-w{flex:none;max-width:60%;font:400 15px/20px var(--f-l);color:var(--dim);text-align:right}
.wiersz-w.t{font-family:var(--f-t)}
.wiersz-w small{display:block;margin-top:2px;font:400 13px/16px var(--f-t);color:var(--faint)}
.wiersz-ik{display:grid;place-items:center;width:32px;height:32px;border-radius:var(--r-s);background:var(--panel-3);color:var(--dim);flex:none}
.opis{margin-top:12px;font:400 13px/16px var(--f-t);color:var(--dim)}
.opis b{font-weight:600;color:var(--text)}
.opis.warn-t{color:var(--warn-t)}
.drobny{font:400 13px/16px var(--f-t);color:var(--faint)}
.zrodlo{margin:24px 0 8px;text-align:center}
.zrodlo a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.tekst-btn{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;font:600 15px/20px var(--f-t);color:var(--akcent)}

/* legenda dekodująca znaki */
.leg{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:12px;font:400 13px/16px var(--f-t);color:var(--dim)}
.leg span{display:inline-flex;align-items:center;gap:8px;min-height:20px}
.leg i{display:inline-block;flex:none}
.leg .l-linia{width:16px;height:2px;border-radius:1px;background:var(--c)}
.leg .klucz{margin:0 -2px}
.leg .l-pasmo{width:14px;height:10px;border-radius:2px;background:var(--c);opacity:.35}
.leg .l-pole{width:14px;height:10px;border-radius:2px;background:var(--ok-pole)}
.leg .l-kreska{width:2px;height:12px;border-radius:1px;background:var(--text)}
.leg .l-slupek{width:6px;height:14px;border-radius:2px;background:var(--dim)}
.leg .l-kreska-p{width:10px;height:2px;border-radius:1px;background:var(--text)}
.leg .ik{color:var(--gleba)}

/* przełącznik segmentowy */
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;border-radius:var(--r-p);background:var(--bg);border:1px solid var(--edge)}
.seg-pelny{display:grid;width:100%}
.seg button{position:relative;z-index:0;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 12px;font:600 15px/20px var(--f-t);color:var(--dim);white-space:nowrap;text-align:center}
.seg button::before{content:"";position:absolute;top:4px;right:4px;bottom:4px;left:4px;z-index:-1;border-radius:var(--r-p);transition:background-color .15s}
.seg button[aria-pressed="true"]{color:var(--text)}
.seg button[aria-pressed="true"]::before{background:var(--panel-3)}
.seg-lekki{background:none;border:0;margin:-8px -8px 0}
.seg-maly button{font-size:13px;line-height:16px;padding:0 16px}

/* wykres */
.wyk-host{position:relative;min-height:184px}
.w-svg{display:block;overflow:visible;touch-action:pan-y;touch-action:pan-y pinch-zoom;-webkit-user-select:none;user-select:none}
.w-svg:focus{outline:none}
.w-svg:focus-visible{outline:2px solid var(--focus);outline-offset:4px;border-radius:4px}
.w-siatka{stroke:var(--grid);stroke-width:1;shape-rendering:crispEdges}
.w-pion{stroke:var(--edge-2);stroke-width:1;shape-rendering:crispEdges}
.w-os{font:500 12px var(--f-e);fill:var(--faint)}
.w-linia{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.w-linia.przer{stroke-dasharray:.01 4.5}
.w-granica{fill:none;stroke:var(--granica);stroke-width:1.5;stroke-dasharray:5 4;stroke-linecap:round}
.w-kon{stroke:var(--panel);stroke-width:2.5}
.w-kursor{stroke:var(--dim);stroke-width:1}
.w-pasmo{fill:var(--ok);fill-opacity:.13}
.w-cisza{fill:var(--panel-3);fill-opacity:.7}
.w-pe{font:500 12px var(--f-e);fill:var(--dim);paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}
.w-prow{stroke:var(--faint);stroke-width:1;stroke-dasharray:2 3}
.w-kropla path{fill:var(--gleba);stroke:var(--gleba);stroke-width:2.4;stroke-linejoin:round}
.w-kropla.pusta path{fill:none}
.wyk-pusty{display:grid;place-items:center;font:400 13px/16px var(--f-t);color:var(--faint)}
.dymek{position:absolute;top:0;z-index:2;min-width:136px;padding:8px 12px;border-radius:var(--r-s);background:var(--panel-3);border:1px solid var(--edge-2);pointer-events:none}
.dymek-c{font:500 12px/16px var(--f-e);color:var(--dim)}
.dymek-w{display:flex;align-items:center;gap:8px;margin-top:4px;font:400 13px/16px var(--f-t);white-space:nowrap}
.dymek-w span{flex:1;color:var(--dim)}
.dymek-w b{font:500 13px/16px var(--f-l);color:var(--text)}
.klucz{display:block;flex:none;overflow:visible}
.wyk-karta{margin-top:12px}
.wyk-nagl{display:flex;align-items:baseline;justify-content:space-between;gap:8px;min-height:24px;margin:12px 0 8px}
.wyk-w{font:400 20px/24px var(--f-l);letter-spacing:-.02em;white-space:nowrap}
.wyk-w .u{font-size:15px}
.wyk-w em{margin-right:4px;font:400 13px/16px var(--f-t);font-style:normal;color:var(--faint);letter-spacing:0}
.wyk-w small{margin-left:8px;font:400 13px/16px var(--f-t);color:var(--faint);letter-spacing:0}
.wyk-k{font:400 13px/16px var(--f-t);color:var(--faint);white-space:nowrap;text-align:right}

/* Dom */
.podsum{display:block;width:100%;margin-top:8px}
.podsum-s{display:flex;align-items:center;gap:8px;font:600 17px/24px var(--f-t)}
.podsum-l{margin-top:4px;padding-left:16px;font:400 15px/20px var(--f-t);color:var(--dim)}
.podsum-b{position:relative;padding:4px 40px 4px 0;min-height:44px}
.podsum-b .podsum-s{color:var(--warn-t)}
.podsum-chev{position:absolute;right:0;top:50%;margin-top:-10px;color:var(--faint)}
.podsum-sz .podsum-s{color:var(--dim)}
.podsum-ak .podsum-s{color:var(--akcent)}
/* ikona okna (16 px) zamiast kropki: podpis wcięty tak, żeby zaczynał się pod tekstem zdania */
.podsum-ak .podsum-l{padding-left:24px}
/* spóźniona zbiórka: jedna linia pod podsumowaniem, ikona w miejscu kropki */
.spoznienie{display:flex;align-items:center;gap:8px;margin-top:8px;font:400 13px/16px var(--f-t);color:var(--warn-t)}
.spoznienie .ik{color:var(--warn)}
/* błąd toru roślin w tej samej linii: treść błędu bywa długa, więc ikona przy pierwszym wierszu, a tekst łamie się
   nawet w długim słowie (nazwa wyjątku, adres) zamiast wypychać stronę w bok */
.spoznienie.dlugi{align-items:flex-start}
.spoznienie>span{min-width:0;overflow-wrap:anywhere}
.siatka-p{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
.pokoj{position:relative;display:flex;flex-direction:column;min-width:0;padding:16px 16px 0;border-radius:var(--r-k);background:var(--panel);background:color-mix(in srgb,var(--c) 8%,var(--panel));border:1px solid var(--edge);border:1px solid color-mix(in srgb,var(--c) 22%,var(--edge));overflow:hidden;text-align:left}
.pokoj-g{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.pokoj-n{min-width:0;font:600 17px/24px var(--f-t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pokoj-t{display:block;margin-top:8px;font:400 34px/40px var(--f-l);letter-spacing:-.04em;white-space:nowrap}
.pokoj-t .st{font-size:20px;vertical-align:13px;margin-left:0}
.pokoj-d{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:20px;margin-top:4px}
.pokoj-h{display:flex;align-items:center;gap:4px;min-height:20px;font:400 15px/20px var(--f-l);color:var(--dim);white-space:nowrap}
.pokoj-h.uw{color:var(--warn-t)}
.pokoj-h.uw .ik{color:var(--warn)}
.pokoj-uw{margin-left:4px;font:400 13px/16px var(--f-t)}
.pokoj-stary{font:400 13px/20px var(--f-t);color:var(--faint)}
.zmiana{display:inline-flex;align-items:center;gap:2px;font:400 13px/16px var(--f-l);color:var(--dim);white-space:nowrap}
.zm-h{margin-left:4px;font:400 12px/16px var(--f-t);color:var(--faint)}
.zmiana.okno{gap:4px;color:var(--akcent)}
/* wąski telefon: mniejsze wcięcie kafla, żeby zmiana zachowała podpis „24 h” */
@media (max-width:374px){.pokoj{padding:16px 12px 0}.pokoj .iskra{margin:8px -12px 0}.pokoj-d{gap:4px}}
/* poniżej 360 px (np. 320) „24 h” i tak nie mieści się obok wilgotności i ucinałoby się krawędzią kafla: znika z widoku,
   a czytnik ekranu dalej słyszy „mniej/więcej niż 24 godziny temu”. Kafel dworu ma miejsce, więc tam zostaje. */
@media (max-width:359px){.pokoj .zm-h{display:none}}
.iskra{position:relative;display:block;height:40px;margin:8px -16px 0}
.pokoj.stary .pokoj-t,.pokoj.stary .iskra{opacity:.45}
.dwor{margin-top:12px;background:var(--panel);background:color-mix(in srgb,var(--c) 6%,var(--panel));border-color:var(--edge);border-color:color-mix(in srgb,var(--c) 18%,var(--edge))}
.dwor-teraz{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-top:8px}
.dwor-l{min-width:0}
.dwor-t{display:flex;align-items:center;gap:8px;font:400 34px/40px var(--f-l);letter-spacing:-.04em;white-space:nowrap}
.dwor-t .ik{color:var(--dim)}
.dwor-t .st{font-size:20px;vertical-align:13px;margin-left:0}
.dwor-opis{display:block;margin-top:4px;font:400 13px/16px var(--f-t);color:var(--dim)}
.dwor-p{display:grid;gap:4px;justify-items:end;font:400 13px/16px var(--f-t);color:var(--faint);text-align:right;white-space:nowrap}
.dwor-p b{font:400 13px/16px var(--f-l);color:var(--text)}
.dni3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--edge)}
.d3{display:grid;gap:4px;min-width:0}
.d3-n{font:400 13px/16px var(--f-t);color:var(--dim)}
.d3-r{display:flex;align-items:center;gap:8px;min-width:0}
.d3-r .ik{color:var(--dim)}
.d3-t{font:400 15px/20px var(--f-l);white-space:nowrap}
.d3-t small{margin-left:4px;font-size:13px;color:var(--faint)}
.d3-p{display:flex;align-items:center;gap:4px;font:400 13px/16px var(--f-l);color:var(--faint)}
.wyk-dom{margin-top:12px}
.siatka-p+.dwor+.seg-strona{margin-top:24px}
.wyk-dom .wyk-host{margin-top:12px}
.przel-n{min-width:0;overflow:hidden;text-overflow:ellipsis}
.przel-rzad{display:grid;grid-template-columns:repeat(3,max-content);justify-content:space-between;margin:8px -8px -8px}
.przel{display:flex;align-items:center;gap:8px;min-width:0;min-height:44px;padding:0 8px;border-radius:var(--r-p);font:400 13px/16px var(--f-t);color:var(--text);white-space:nowrap}
.przel[aria-pressed="false"]{color:var(--faint)}
.przel[aria-pressed="false"] .klucz{opacity:.35}

/* strona pokoju i dworu */
.boh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:16px}
.boh-t{font:400 56px/56px var(--f-l);letter-spacing:-.05em;white-space:nowrap}
.boh-t .st{font-size:28px;vertical-align:24px;margin-left:-3px}
.boh-p{display:flex;flex-direction:column;align-items:flex-end;gap:4px;padding-bottom:4px}
.boh-w{display:inline-flex;align-items:center;gap:4px;font:400 20px/24px var(--f-l)}
.boh-w .ik{color:var(--dim)}
.boh-w .u{font-size:15px}
.boh-w.uw{color:var(--warn-t)}
.boh-w.uw .ik{color:var(--warn)}
.boh-z{display:inline-flex;align-items:center;gap:4px;font:400 13px/16px var(--f-t);color:var(--dim);white-space:nowrap}
.boh-z b{font:400 13px/16px var(--f-l);color:var(--text)}
.boh-ik{color:var(--dim)}
.status{margin-top:24px;padding:16px;border-radius:var(--r-k);background:var(--warn-tlo);border:1px solid var(--warn-ramka)}
.status .status-g{display:flex;align-items:center;gap:8px;margin-top:0;font:600 17px/24px var(--f-t);color:var(--warn-t)}
.status .status-g .ik{color:var(--warn)}
.status p{margin-top:8px;font:400 15px/20px var(--f-t);color:var(--text)}
.status p.rada{color:var(--dim)}
.status.pilne{background:var(--bad-tlo);border-color:var(--bad-ramka)}
.status.pilne .status-g{color:var(--bad-t)}
.status.pilne .status-g .ik{color:var(--bad)}
.status.info{background:var(--panel);border-color:var(--edge)}
.status.info .status-g{color:var(--text)}
.status.info .status-g .ik{color:var(--dim)}
.status.info.akc .status-g .ik{color:var(--akcent)}
.status+.status{margin-top:12px}
.status.lagodny{background:var(--panel);border-color:var(--edge)}
.status.lagodny .status-g{color:var(--text)}
.status.lagodny .status-g .ik{color:var(--k)}
.seg-strona{margin-top:24px}
.wart-rzad{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.wart-duza{font:400 34px/40px var(--f-l);letter-spacing:-.04em;white-space:nowrap}
.wart-duza .u{font-size:20px;margin-left:2px}
.wart-op{margin-top:4px;font:400 15px/20px var(--f-t);color:var(--dim)}
.znacz{font:400 15px/20px var(--f-t);color:var(--dim);text-align:right}
.tor{position:relative;height:8px;margin-top:16px;border-radius:var(--r-p);background:var(--panel-3)}
.tor-w{position:absolute;top:0;bottom:0;left:0;border-radius:var(--r-p);background:var(--c)}
.tor-zn{position:absolute;top:-6px;bottom:-6px;width:2px;margin-left:-1px;border-radius:1px;background:var(--granica);box-shadow:0 0 0 2px var(--panel)}
.tor.ponad .tor-zn{background:var(--warn-t)}
.tor-pole{position:absolute;top:0;bottom:0;background:var(--ok-pole)}
.tor-zakres{position:absolute;top:0;bottom:0;border-radius:var(--r-p);background:var(--c)}
.tor-kreska{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:1px;background:var(--text)}
.tor-et{position:relative;height:16px;margin-top:8px;font:500 12px/16px var(--f-e);color:var(--faint)}
.tor-et span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.tor-et span.l{transform:none}
.tor-et span.p{transform:translateX(-100%)}
.tor-et span.gr{color:var(--granica)}
.zakres+.zakres{margin-top:16px;padding-top:16px;border-top:1px solid var(--edge)}
.zakres-g{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.zakres-g>span{font:400 15px/20px var(--f-t);color:var(--dim)}
.zakres-g b{font:400 15px/20px var(--f-l);font-weight:400;white-space:nowrap}
.zakres-g b small{margin-left:8px;font:400 13px/16px var(--f-t);color:var(--faint)}
.zakres .tor{margin-top:12px}
.rytm-nagl{min-height:20px;font:400 13px/20px var(--f-t);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rytm-nagl b{font:500 13px/20px var(--f-l);color:var(--text)}
.rytm{margin-top:8px}
.rytm svg{touch-action:pan-y;touch-action:pan-y pinch-zoom;-webkit-user-select:none;user-select:none}
.rytm svg:focus{outline:none}
.rytm svg:focus-visible{outline:2px solid var(--focus);outline-offset:4px}
.r-et{font:500 12px var(--f-e);fill:var(--faint)}
.r-wyb{fill:none;stroke:var(--text);stroke-width:2}
.r-wyb-t{fill:none;stroke:var(--panel);stroke-width:5}
.skala-leg{display:flex;align-items:center;gap:8px;margin-top:12px;font:500 12px/16px var(--f-e);color:var(--faint)}
.skala-leg svg{flex:none}
.trzy{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.kafel{min-width:0;padding:12px;border-radius:var(--r-k);background:var(--panel);border:1px solid var(--edge)}
.kafel>span{display:block;font:400 13px/16px var(--f-t);color:var(--dim)}
.kafel b{display:block;margin-top:4px;font:400 20px/24px var(--f-l);white-space:nowrap}
.kafel b .u{font-size:13px}
.kafel b .u.km{margin-left:4px}
.prog-dzien{display:grid;grid-template-columns:56px 24px minmax(0,1fr);align-items:center;gap:12px;min-height:56px;padding:8px 16px}
.prog-dzien+.prog-dzien{border-top:1px solid var(--edge)}
.prog-dzien>b{font:600 15px/20px var(--f-t)}
.prog-dzien .ik{color:var(--dim)}
.pd-p{display:flex;flex-direction:column;gap:4px;min-width:0}
.pd-op{display:flex;justify-content:space-between;gap:8px;font:400 13px/16px var(--f-t);color:var(--dim)}
.pd-op>span:last-child{display:inline-flex;align-items:center;gap:4px;color:var(--faint);white-space:nowrap;font-family:var(--f-l)}
.pd-zakres{display:grid;grid-template-columns:32px minmax(0,1fr) 32px;align-items:center;gap:8px;font:400 13px/16px var(--f-l)}
.pd-zakres span:first-child{color:var(--dim);text-align:right}
.pd-zakres .tor{margin:0;height:6px}

/* Rośliny */
.lista-r{display:grid;gap:12px;margin-top:24px}
.rk{display:grid;grid-template-columns:88px minmax(0,1fr) 20px;align-items:center;gap:12px;width:100%;padding:12px 12px 12px 8px;border-radius:var(--r-k);background:var(--panel);border:1px solid var(--edge);text-align:left}
.rk-rys{position:relative;width:88px;height:112px}
.rk-rys>svg{width:88px;height:112px}
.rk-buzka{position:absolute;right:0;bottom:4px;width:28px;height:28px;border-radius:50%;box-shadow:0 0 0 2px var(--panel)}
.rk-buzka svg{width:28px;height:28px}
.rk-t{display:grid;min-width:0;padding:4px 0}
.rk-n{font:600 17px/24px var(--f-t)}
.rk-p{font:400 13px/16px var(--f-t);color:var(--faint)}
.rk-s{margin-top:8px;font:400 15px/20px var(--f-t);color:var(--text)}
.rk-s.uw{color:var(--k)}
.rk-g{margin-top:12px}
.rk-g-w{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 8px;font:400 13px/16px var(--f-t);color:var(--faint)}
.rk-g-w>span:last-child{margin-left:auto;text-align:right}
.rk-g-w b{font:500 13px/16px var(--f-l);color:var(--text)}
.rk .tor{display:block;height:6px;margin-top:8px;border-radius:3px}
.rk .tor>i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--k)}
.rk .tor>em{position:absolute;top:-4px;width:2px;height:14px;margin-left:-1px;border-radius:1px;background:var(--text);box-shadow:0 0 0 2px var(--panel)}
.rk-chev{color:var(--faint)}
.rk.wyl .tor{opacity:.5}
.rk.wyl .rk-g-w b{color:var(--dim)}
/* werdykty ze stanu sprzed godzin (błąd toru roślin): przygaszone, żeby nie udawały dzisiejszych; nazwa i pokój
   zostają wyraźne, bo to one prowadzą do rośliny */
.rk.stare .rk-rys,.rk.stare .rk-s,.rk.stare .rk-g{opacity:.55}
.rd-stare{opacity:.55}
.podtytul.stan-r{display:flex;align-items:center;gap:8px}
.podtytul.stan-r.uw{color:var(--warn-t)}
.podtytul.stan-r.pilne{color:var(--bad-t)}

/* szczegół rośliny */
.rd-scena{display:grid;place-items:center;height:288px;margin-top:16px;border-radius:var(--r-k);background:var(--panel);border:1px solid var(--edge)}
.rd-scena svg{width:203px;height:264px}
.rd-poziom{display:flex;align-items:center;gap:12px;margin-top:16px}
.rd-buzka{width:40px;height:40px;flex:none}
.rd-buzka svg{width:40px;height:40px}
.rd-poziom b{display:block;font:600 20px/24px var(--f-t);color:var(--k)}
.rd-poziom span span{display:block;font:400 15px/20px var(--f-t);color:var(--dim)}
.rd-pelna{margin-top:8px;font:400 13px/16px var(--f-t);color:var(--faint)}
.powody{margin-top:16px}
.powod{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 0}
.powod+.powod{border-top:1px solid var(--edge)}
.powod-ik{display:grid;place-items:center;width:36px;height:36px;border-radius:var(--r-s);background:var(--panel-3);color:var(--k);flex:none}
.powod p{font:400 15px/20px var(--f-t)}
.powod.info .powod-ik{color:var(--faint)}
.powod.info p{color:var(--dim)}
.wsk-siatka{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.wsk{min-width:0;padding:12px 12px 16px;border-radius:var(--r-k);background:var(--panel);border:1px solid var(--edge);text-align:center}
.wsk svg{width:100%;max-width:136px;height:auto;margin:0 auto}
.wsk.wyl svg{opacity:.4}
.wsk-tor{fill:none;stroke:var(--panel-3);stroke-width:10;stroke-linecap:round}
.wsk-pasmo{fill:none;stroke:var(--ok-pole);stroke-width:10}
.wsk-war{fill:none;stroke-width:10;stroke-linecap:round}
.wsk-zn{stroke:var(--dim);stroke-width:2;stroke-linecap:round}
.wsk-kropka{stroke:var(--panel);stroke-width:3}
.wsk-w{font:400 28px var(--f-l);fill:var(--text);letter-spacing:-.03em}
.wsk-j{font-family:var(--f-t);font-size:13px;fill:var(--dim);letter-spacing:0}
.wsk-pw{font:500 12px var(--f-e);fill:var(--faint)}
.wsk-et{margin-top:4px;font:600 15px/20px var(--f-t)}
.wsk-pod{margin-top:4px;font:400 13px/16px var(--f-t);color:var(--faint)}
.sw{display:grid;grid-template-columns:72px minmax(0,1fr) 68px;align-items:center;gap:12px;min-height:52px}
.sw-n{font:400 15px/20px var(--f-t)}
.sw-n small{display:block;font:400 13px/16px var(--f-t);color:var(--faint)}
.sw-tor{position:relative;height:8px;border-radius:4px;background:var(--panel-3)}
.sw-tor i{position:absolute;left:0;top:0;bottom:0;min-width:4px;border-radius:4px;background:var(--k)}
.sw-tor i.niep{opacity:.4}
.sw-tor em{position:absolute;top:-6px;bottom:-6px;width:2px;margin-left:-1px;border-radius:1px;background:var(--text)}
.sw-w{font:500 15px/20px var(--f-l);text-align:right}
.sw-w small{display:block;font:400 13px/16px var(--f-t);color:var(--faint)}
.sw-os{min-height:20px}
.sw-os .sw-tor{height:16px;background:none}
.sw-os .sw-tor span{position:absolute;top:0;transform:translateX(-100%);padding-right:4px;font:500 12px/16px var(--f-e);color:var(--dim);white-space:nowrap}
.os svg{width:100%}
.os-linia{stroke:var(--edge-2);stroke-width:2;stroke-linecap:round}
.os-tick{stroke:var(--faint);stroke-width:1.5;stroke-linecap:round}
.os-et{font:500 12px var(--f-e);fill:var(--faint)}
.os-g{font:600 13px var(--f-t);fill:var(--text)}
.os-w{font:400 13px var(--f-t);fill:var(--dim)}
.os-kropla path{fill:var(--gleba);stroke:var(--gleba);stroke-width:2.1;stroke-linejoin:round}
.os-kropla.pusta path{fill:none}
.dbaj li{display:flex;gap:12px;padding:12px 0;font:400 15px/20px var(--f-t)}
.dbaj li+li{border-top:1px solid var(--edge)}
.dbaj li::before{content:"";width:6px;height:6px;margin-top:7px;border-radius:50%;background:var(--faint);flex:none}

/* Historia */
.wr{display:grid;grid-template-columns:96px minmax(0,1fr) 80px;align-items:center;gap:8px;min-height:40px}
.wr-n{display:flex;align-items:center;gap:8px;min-width:0;font:400 13px/16px var(--f-t);color:var(--text);white-space:nowrap}
.wr-w{font:400 13px/16px var(--f-l);color:var(--dim);text-align:right;white-space:nowrap}
.wr-tor{position:relative;height:8px;border-radius:4px;background:var(--panel-3)}
.wr-tor>i{position:absolute;top:0;bottom:0;min-width:10px;border-radius:4px;background:var(--c);opacity:.75;transform:translateX(-50%)}
.wr-tor>b{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:1px;background:var(--text);box-shadow:0 0 0 2px var(--panel)}
.wr-uw{grid-column:2 / 4;margin:-8px 0 4px;font:400 13px/16px var(--f-t);color:var(--warn-t)}
.wr-os{position:relative;height:16px;font:500 12px/16px var(--f-e);color:var(--faint)}
.wr-os span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.k-tor>i{opacity:1;transform:none;background:var(--dim)}
.zak-seg{margin-bottom:8px}
/* Ostatnie 30 dni: cztery małe wykresy zakresów doby na wspólnych osiach */
.m30-dzien{min-height:40px;margin-top:16px}
.dzien-g{font:600 15px/20px var(--f-t)}
.dzien-zew{margin-top:4px;font:400 13px/16px var(--f-t);color:var(--dim)}
.dzien-zew b{font:400 13px/16px var(--f-l);color:var(--text)}
.m30-host{position:relative;min-height:420px;margin-top:16px}
.m30{touch-action:pan-y;touch-action:pan-y pinch-zoom;-webkit-user-select:none;user-select:none;cursor:pointer}
.m30:focus{outline:none}
.m30:focus-visible{outline:2px solid var(--focus);outline-offset:6px;border-radius:4px}
.m30-w+.m30-w{margin-top:16px}
.m30-g{display:flex;align-items:baseline;justify-content:space-between;gap:8px;min-height:20px;margin-bottom:4px}
.m30-n{display:flex;align-items:center;gap:8px;min-width:0;font:400 13px/16px var(--f-t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m30-v{font:400 15px/20px var(--f-l);white-space:nowrap}
.m30-v small{margin-left:8px;font:400 13px/16px var(--f-l);color:var(--faint)}
.m30-v .brak{font:400 13px/16px var(--f-t);color:var(--faint)}
.m30-os{font:500 12px var(--f-e);fill:var(--faint)}
.m30-os.dzis{fill:var(--dim)}
/* pole komfortu zajmuje tu dużą powierzchnię, więc jest delikatniejsze niż w wąskich torach */
.m30-pole{fill:var(--ok-pole);fill-opacity:.55}
.leg .l-pole.lekkie{opacity:.55}
.m30-wyb{fill:var(--podswietl)}
.m30-sr{fill:var(--text)}
/* przy niskim pasku kreska średniej zasłoniłaby kolor: tylko w wybranym dniu */
.m30-sr.k{visibility:hidden}
.wyb>.m30-sr.k{visibility:visible}
.m30-xos{margin-top:4px}

/* Powiadomienia */
.tel-op{margin-top:8px;min-height:16px;font:400 13px/16px var(--f-t);color:var(--faint)}
.tel-op.inny{color:var(--dim)}
.grupa{margin-top:24px}
.grupa-t{margin:0 0 8px 16px;font:600 15px/20px var(--f-t);color:var(--dim)}
.grupa-s{margin:8px 16px 0;font:400 13px/16px var(--f-t);color:var(--faint)}
.wiersz-sw{min-height:60px}
.wiersz-sw:disabled .wiersz-n>span,.wiersz-godz.wyl .wiersz-n,.wiersz-godz.wyl .godz-w{color:var(--faint)}
.przel-sw{position:relative;flex:none;width:51px;height:31px;border-radius:16px;background:var(--sw-wyl);transition:background-color .2s}
.przel-sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:var(--sw-galka);transition:transform .2s var(--ease)}
[aria-checked="true"]>.przel-sw{background:var(--akcent)}
[aria-checked="true"]>.przel-sw::after{transform:translateX(20px);background:var(--ink)}
.wiersz-sw:disabled .przel-sw{opacity:.45}
.wiersz-godz{min-height:52px}
.godz-w{display:inline-flex;align-items:center;gap:4px;font:400 15px/20px var(--f-l);color:var(--dim)}
.godz-w .ik{color:var(--faint)}
.godz-sel{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;opacity:0;font-size:17px;-webkit-appearance:none;appearance:none;cursor:pointer}
.godz-sel:disabled{cursor:default}
.wiersz-godz:focus-within{outline:2px solid var(--focus);outline-offset:-2px;border-radius:var(--r-k)}
.polacz{margin-top:24px}
.polacz h2{font:600 17px/24px var(--f-t)}
.polacz .drobny{margin-top:4px}
.pole-l{display:block;margin-top:16px;font:400 13px/16px var(--f-t);color:var(--dim)}
.pole{display:block;width:100%;height:48px;margin-top:8px;padding:0 12px;border-radius:var(--r-s);background:var(--bg);border:1px solid var(--edge-2);font:400 17px/24px var(--f-l);color:var(--text)}
.pole::placeholder{color:var(--faint);opacity:1}
.pole:focus{outline:none;border-color:var(--focus)}
.pole[aria-invalid="true"]{border-color:var(--bad)}
.pole-blad{margin-top:8px;font:400 13px/16px var(--f-t);color:var(--bad-t)}
.przycisk{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin-top:12px;border-radius:var(--r-s);background:var(--text);color:var(--ink);font:600 17px/24px var(--f-t)}
.skad{margin:4px 0 0 4px}
.odlacz{margin-right:-12px;color:var(--bad-t)}
.przyciski{display:grid;gap:8px;margin-top:16px}
.przycisk.zly{margin-top:0;background:var(--bad-tlo);border:1px solid var(--bad-ramka);color:var(--bad-t)}
.przycisk.drugi{margin-top:0;background:var(--panel-3);color:var(--text)}
.pw-czas{flex:none;font:400 13px/16px var(--f-t);color:var(--faint);text-align:right;white-space:nowrap}
/* Ten telefon (subskrypcja Web Push): wiersz stanu, a pod nim w tej samej liście kroki i przyciski */
.tel .wiersz-ik.ok{color:var(--ok)}
.tel .wiersz-ik.warn{color:var(--warn)}
.tel .wiersz-ik.bad{color:var(--bad)}
.tel-tresc{padding:0 16px 16px;font:400 15px/20px var(--f-t);color:var(--dim)}
.tel-tresc>p+p,.tel-tresc>div>p,.tel-tresc>div>p+textarea{margin-top:8px}
.tel-tresc>.przycisk{margin-top:12px}
.tel-tresc>.przycisk:first-child{margin-top:4px}
.tel-tresc b{color:var(--text)}
.tel code,.arkusz code{font:400 13px/16px var(--f-l);color:var(--text);overflow-wrap:anywhere}
.tel-kroki{margin-top:0}
.tel-kroki li>div{flex:1;min-width:0}
.tel-kroki li:first-child{padding-top:4px}
.pole-sub{height:auto;padding:8px 12px;font:400 13px/16px var(--f-l);color:var(--dim);word-break:break-all;resize:none}
.tel-przyciski{grid-template-columns:repeat(auto-fit,minmax(0,1fr));margin-top:8px}
.tel-przyciski .przycisk{margin-top:0}
.tel .status{margin-top:12px}
.tel #pow-telefon[hidden]+.status{margin-top:8px}   /* samo „nie dochodzą” pod nagłówkiem: odstęp jak w innych grupach */
.tel .status .przycisk{margin-top:12px}

/* zakładki */
.zakladki{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:430px;margin:0 auto;background:var(--bg);border-top:1px solid var(--edge);padding-bottom:env(safe-area-inset-bottom,0px)}
.zakladki-w{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));height:var(--zakladki)}
.zakladka{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0;color:var(--faint);font:500 12px/16px var(--f-e)}
.zakladka>span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.z-ik{position:relative;display:grid;place-items:center;width:56px;height:32px;border-radius:var(--r-p);transition:background-color .2s}
.zakladka[aria-current="page"]{color:var(--text)}
.zakladka[aria-current="page"] .z-ik{background:var(--panel-3)}
.z-kropka{position:absolute;top:4px;right:14px;width:8px;height:8px;border-radius:50%;background:var(--k);box-shadow:0 0 0 2px var(--bg)}

/* komunikat „Zapisano” nad paskiem zakładek */
.toast{position:fixed;left:50%;bottom:calc(var(--zakladki) + env(safe-area-inset-bottom,0px) + 12px);z-index:35;display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px);padding:8px 16px;border-radius:var(--r-p);background:var(--panel-3);border:1px solid var(--edge-2);font:400 13px/16px var(--f-t);color:var(--text);transform:translate(-50%,8px);opacity:0;transition:opacity .2s,transform .2s var(--ease);pointer-events:none;white-space:nowrap}
.toast .ik{color:var(--ok)}
.toast.blad .ik{color:var(--bad)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* arkusz od dołu */
.arkusz-tlo{position:fixed;top:0;right:0;bottom:0;left:0;z-index:40;background:var(--scrim);touch-action:none;overscroll-behavior:contain}
.arkusz{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:430px;max-height:88vh;max-height:88dvh;margin:0 auto;display:flex;flex-direction:column;border-radius:var(--r-k) var(--r-k) 0 0;background:var(--panel-2);border:1px solid var(--edge);border-bottom:0}
.arkusz-ciag{flex:none;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
.arkusz-uchwyt{width:36px;height:4px;margin:8px auto 0;border-radius:2px;background:var(--edge-2)}
.arkusz-g{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 4px 0 var(--g);border-bottom:1px solid transparent;transition:border-color .2s}
.arkusz-g.cien{border-bottom-color:var(--edge)}
.arkusz-g h2{font:600 17px/24px var(--f-t)}
.arkusz-tresc{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 var(--g) calc(24px + env(safe-area-inset-bottom,0px))}
.arkusz-op{margin-top:4px;font:400 13px/16px var(--f-t);color:var(--faint)}
.arkusz-tekst{margin-top:4px;font:400 15px/20px var(--f-t);color:var(--dim)}
.kroki{counter-reset:k;margin-top:8px}
.kroki li{display:flex;gap:12px;padding:12px 0}
.kroki li+li{border-top:1px solid var(--edge)}
.kroki li>b{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--panel-3);font:500 13px/16px var(--f-l);flex:none}
.kroki p{padding-top:4px;font:400 15px/20px var(--f-t)}
.kroki code{font:400 13px/16px var(--f-l);color:var(--text)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app" id="app" data-dane="wczytywanie">
  <header class="nav" id="nav">
    <div class="nav-rzad">
      <div class="nav-l"><button class="wstecz" id="wstecz" type="button" hidden></button></div>
      <div class="nav-t" id="nav-t" aria-hidden="true"></div>
      <div class="nav-p" id="strzalki" hidden>
        <button class="ikb" id="poprz" type="button"></button>
        <span class="licznik" id="licznik" aria-hidden="true"></span>
        <button class="ikb" id="nast" type="button"></button>
      </div>
    </div>
  </header>
  <main id="main">
    <section class="widok" id="v-dom" aria-label="Dom"></section>
    <section class="widok" id="v-rosliny" aria-label="Rośliny" hidden></section>
    <section class="widok" id="v-historia" aria-label="Historia" hidden></section>
    <section class="widok" id="v-powiadomienia" aria-label="Powiadomienia" hidden></section>
    <section class="pager" id="v-strona" hidden><div class="tasma" id="tasma"></div></section>
  </main>
  <nav class="zakladki" aria-label="Zakładki">
    <div class="zakladki-w" id="zakladki"></div>
  </nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <p class="sr" id="ogloszenie" aria-live="polite"></p>
  <div class="arkusz-tlo" id="arkusz-tlo" hidden></div>
  <div class="arkusz" id="arkusz" role="dialog" aria-modal="true" aria-labelledby="arkusz-t" hidden>
    <div class="arkusz-ciag" id="arkusz-ciag">
      <div class="arkusz-uchwyt" aria-hidden="true"></div>
      <div class="arkusz-g" id="arkusz-g"><h2 id="arkusz-t" tabindex="-1"></h2><button class="tekst-btn" id="arkusz-gotowe" type="button" data-akcja="zamknij">Gotowe</button></div>
    </div>
    <div class="arkusz-tresc" id="arkusz-tresc"></div>
  </div>
</div>

<script>
/* Rysunki roślin właściciela i buźki stanu — wersja 2.
   Rysowane z kodu; liście rozkłada ziarnisty los, więc każde wywołanie daje ten sam obrazek,
   a zmiana objawów nie przetasowuje liści (to wciąż ta sama roślina). Na podstawie zdjęć z 8.10:
   - Fikus 'Ginseng': gruby, rozdwojony jasnobrązowy korzeń-pień, długie cienkie gałązki z kępami
     eliptycznych ciemnozielonych liści, czarna matowa doniczka na niskiej podstawce;
   - Skrzydłokwiat: asymetryczna kępa łukowatych, lancetowatych liści (najwyższy po prawej, dwa
     przewieszone przez brzeg po lewej), biała doniczka z szarym paskiem przy dnie;
   - Azalia: drzewko na paliku, szeroka nieregularna korona z rozet liści, duże różowe pełne
     kwiaty skupione u góry po lewej, biała osłonka, w środku szara doniczka i kora.
   Światło zawsze z lewej góry (tam umownie jest okno): jaśniejsza połówka liścia, cień po prawej
   stronie doniczki, roślina w cieniu wychyla się w lewo.

   Objawy (każdy ma własny znak, żeby dało się je odróżnić bez podpisu, także przy 110 px):
     susza  — liście opadają i oliwkowieją, fikus gubi liście na blat, azalia więdnie i gubi płatki;
     ciemno — roślina wychyla się w lewo, blednie (szarozielona), rzednie, pędy się wydłużają;
     slonce — sylwetka pełna i prosta, ale liście od strony okna wypłowiałe, z brązowymi czubkami;
     mokro  — woda w podstawce / osłonce; dopiero od 0.5 żółkną 1–3 najniższe liście.

   API (globalny obiekt RysunkiRoslin; w Node także module.exports):
     roslina(gatunek, {poziom, twarz, objawy, male}) → string <svg viewBox="0 0 200 260">
         gatunek: fikus | skrzydlokwiat | azalia; poziom 5..1 (0 = czujnik) steruje miną;
         objawy = {susza, ciemno, slonce, mokro}, każde 0..1 i opcjonalne. Bez 'objawy' —
         z poziomu jak w v1 (susza = OPAD[poziom]). Objawy mogą się łączyć.
         male: true — bez drobiazgów niewidocznych w karcie (żyłki, grudki ziemi).
     buzka(poziom, {obrys})                → string <svg viewBox="0 0 100 100">
     POZIOMY[poziom] = {nazwa, kolor, tekst}
     ocen(roslina) → {poziom, naglowek, powody:[{rodzaj, poziom, tekst, objaw?, info?}],
                      objawy:{susza, ciemno, slonce, mokro}, info:[tekst], powiadomienia:[…]}
         roslina = wpis z D.rosliny (index.html buduje go z data/rosliny/stan.json).
     objawyZPoziomu(poziom) → {susza, ciemno, slonce, mokro} */
(function (global) {
  'use strict';

  function los(ziarno) {
    let s = ziarno >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const f = (n) => (Math.round(n * 10) / 10).toString();
  const rad = (d) => (d * Math.PI) / 180;
  const c01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
  const ma = (v, d) => (v === undefined || v === null ? d : v);

  /* ---------- Kolory ---------- */
  function rgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  function hex(r, g, b) {
    const k = (v) => Math.max(0, Math.min(255, Math.round(v)));
    return '#' + ((1 << 24) | (k(r) << 16) | (k(g) << 8) | k(b)).toString(16).slice(1);
  }
  function mix(a, b, t) {
    t = c01(t);
    if (t === 0) return a;
    const A = rgb(a), B = rgb(b);
    return hex(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t);
  }
  function szary(a, t) {
    if (!t) return a;
    const A = rgb(a), l = A[0] * 0.3 + A[1] * 0.55 + A[2] * 0.15;
    return mix(a, hex(l, l, l + 4), t);
  }
  // Barwy objawów — stonowane, bez jaskrawych żółci.
  const K = {
    susza: '#a19b52',      // zwiędnięta oliwka
    zolty: '#d2b54c',      // liść przed opadnięciem
    zoltyMokry: '#cdbb5e', // liść żółknący od nadmiaru wody
    ciemno: '#bcc98f',     // odbarwiona, blada żółtozieleń (etiolacja)
    wyplowialy: '#ebe5ae', // wypłowiała od słońca (połówka od światła) — ciepła słoma,
    wyplowialyC: '#c4b876', // nie chłodna szarozieleń jak w cieniu
    spalony: '#7b4f30',    // martwy czubek
    brunat: '#9a6b3e',     // przejście od martwego czubka do zieleni (ochra, nie kremowy pas)
    plama: '#d9d5a3',      // płowa plama po oparzeniu
    woda: '#6fa3c4',
    wodaCien: '#3f6e8b',
    wodaBlysk: '#d6ecf7',
  };
  // Liść po objawach wspólnych dla wszystkich roślin (susza, ciemno, brak danych).
  // Słońce i nadmiar wody każda roślina nakłada sama, bo dotyczą tylko wybranych liści.
  function barwa(k, ob, w) {
    const r = w && w.los !== undefined ? w.los : 0.5;
    if (ob.ciemno) k = szary(mix(k, K.ciemno, 0.65 * ob.ciemno), 0.25 * ob.ciemno);
    if (ob.susza) k = mix(k, K.susza, ob.Se * (0.4 + 0.3 * r));
    if (ob.szarosc) k = szary(k, ob.szarosc);
    return k;
  }

  const POZIOMY = {
    5: { nazwa: 'Świetnie', kolor: '#5fce9e', tekst: 'Wszystko gra' },
    4: { nazwa: 'Dobrze', kolor: '#b3d465', tekst: 'Drobiazg do poprawy' },
    3: { nazwa: 'Tak sobie', kolor: '#e8d25f', tekst: 'Zajrzyj w ciągu doby' },
    2: { nazwa: 'Źle', kolor: '#e8a13c', tekst: 'Potrzebuje Cię dziś' },
    1: { nazwa: 'Pilne', kolor: '#ef6a5b', tekst: 'Działaj teraz' },
    0: { nazwa: 'Czujnik', kolor: '#8496a5', tekst: 'Brak świeżych odczytów' },
  };
  // jak mocno roślina jest przesuszona przy danym poziomie (gdy nie podano objawów)
  const OPAD = { 5: 0, 4: 0.08, 3: 0.3, 2: 0.6, 1: 1, 0: 0.15 };

  function objawyZPoziomu(poziom) {
    return { susza: ma(OPAD[poziom], 0), ciemno: 0, slonce: 0, mokro: 0 };
  }
  function objawyZOpcji(opt, poziom) {
    const o = opt.objawy;
    const ob = o ? {
      susza: c01(+o.susza || 0), ciemno: c01(+o.ciemno || 0),
      slonce: c01(+o.slonce || 0), mokro: c01(+o.mokro || 0),
    } : objawyZPoziomu(poziom);
    // krzywa łagodzenia: już 'podlej jutro' (0.3) ma być widać po pochyleniu i kolorze liści
    ob.Se = Math.pow(ob.susza, 0.6);
    ob.My = c01((ob.mokro - 0.4) / 0.6);   // żółknięcie od nadmiaru wody dopiero od 0.5
    // brak danych — roślina wygaszona (szara i półprzezroczysta), a nie chora
    ob.wygas = poziom === 0;
    ob.szarosc = ob.wygas ? 0.62 : 0;
    return ob;
  }
  const wygas = (s, ob) => (ob.wygas ? `<g opacity=".7">${s}</g>` : s);

  /* ---------- Buźka (bez zmian względem v1) ---------- */
  function buzka(poziom, opt) {
    opt = opt || {};
    const P = POZIOMY[poziom] || POZIOMY[0];
    const ink = '#10161c';
    let srodek = '';
    const oko = (x, y) => `<ellipse cx="${x}" cy="${y}" rx="5.2" ry="6.4" fill="${ink}"/>`;
    switch (poziom) {
      case 5:
        srodek =
          `<path d="M29 44 Q37 34 45 44 M55 44 Q63 34 71 44" fill="none" stroke="${ink}" stroke-width="5" stroke-linecap="round"/>` +
          `<path d="M27 57 Q50 88 73 57 Z" fill="${ink}"/>` +
          `<path d="M39 70 Q50 79 61 70 Q55 66 50 67 Q45 66 39 70 Z" fill="#f08a8a"/>` +
          `<ellipse cx="24" cy="60" rx="7" ry="4.5" fill="#ffffff" opacity=".28"/><ellipse cx="76" cy="60" rx="7" ry="4.5" fill="#ffffff" opacity=".28"/>`;
        break;
      case 4:
        srodek = oko(36, 42) + oko(64, 42) +
          `<path d="M30 60 Q50 78 70 60" fill="none" stroke="${ink}" stroke-width="5.5" stroke-linecap="round"/>`;
        break;
      case 3:
        srodek = oko(36, 43) + oko(64, 43) +
          `<path d="M33 66 Q42 63 50 65 Q58 67 67 64" fill="none" stroke="${ink}" stroke-width="5.5" stroke-linecap="round"/>`;
        break;
      case 2:
        srodek = oko(36, 45) + oko(64, 45) +
          `<path d="M27 36 L42 31 M73 36 L58 31" fill="none" stroke="${ink}" stroke-width="4.5" stroke-linecap="round"/>` +
          `<path d="M31 71 Q50 57 69 71" fill="none" stroke="${ink}" stroke-width="5.5" stroke-linecap="round"/>`;
        break;
      case 1:
        srodek =
          `<path d="M27 37 L43 31 M73 37 L57 31" fill="none" stroke="${ink}" stroke-width="4.5" stroke-linecap="round"/>` +
          `<path d="M30 46 Q36 52 42 46 M58 46 Q64 52 70 46" fill="none" stroke="${ink}" stroke-width="5" stroke-linecap="round"/>` +
          `<path d="M30 76 Q50 55 70 76 Z" fill="${ink}"/>` +
          `<path d="M80 22 Q86 32 83 37 Q78 40 75 35 Q74 30 80 22 Z" fill="#8fd3ff"/>`;
        break;
      default:
        srodek =
          `<path d="M30 44 h12 M58 44 h12" fill="none" stroke="${ink}" stroke-width="5" stroke-linecap="round"/>` +
          `<circle cx="38" cy="66" r="3.4" fill="${ink}"/><circle cx="50" cy="66" r="3.4" fill="${ink}"/><circle cx="62" cy="66" r="3.4" fill="${ink}"/>`;
    }
    const obrys = opt.obrys ? ` stroke="${opt.obrys}" stroke-width="3"` : '';
    return `<svg viewBox="0 0 100 100" role="img" aria-label="${P.nazwa}" xmlns="http://www.w3.org/2000/svg">` +
      `<circle cx="50" cy="50" r="46" fill="${P.kolor}"${obrys}/>` +
      `<path d="M18 34 Q28 12 52 8" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity=".3"/>` +
      srodek + `</svg>`;
  }

  /* ---------- Twarz na doniczce (bez zmian względem v1) ---------- */
  function twarzNaDoniczce(cx, cy, poziom, jasna) {
    const ink = jasna ? '#e9eef2' : '#1d2329';
    const policzek = jasna ? '#ff9db0' : '#f29aa8';
    const oko = (x) => `<ellipse cx="${x}" cy="${cy - 4}" rx="3.1" ry="3.9" fill="${ink}"/>`;
    let s = '';
    switch (poziom) {
      case 5:
        s = `<path d="M${cx - 15} ${cy - 3} q5 -6 10 0 M${cx + 5} ${cy - 3} q5 -6 10 0" fill="none" stroke="${ink}" stroke-width="2.6" stroke-linecap="round"/>` +
          `<path d="M${cx - 9} ${cy + 5} Q${cx} ${cy + 17} ${cx + 9} ${cy + 5} Z" fill="${ink}"/>` +
          `<ellipse cx="${cx - 19}" cy="${cy + 5}" rx="4.5" ry="2.6" fill="${policzek}" opacity=".55"/><ellipse cx="${cx + 19}" cy="${cy + 5}" rx="4.5" ry="2.6" fill="${policzek}" opacity=".55"/>`;
        break;
      case 4:
        s = oko(cx - 10) + oko(cx + 10) +
          `<path d="M${cx - 9} ${cy + 6} Q${cx} ${cy + 13} ${cx + 9} ${cy + 6}" fill="none" stroke="${ink}" stroke-width="2.6" stroke-linecap="round"/>` +
          `<ellipse cx="${cx - 19}" cy="${cy + 5}" rx="4.2" ry="2.4" fill="${policzek}" opacity=".4"/><ellipse cx="${cx + 19}" cy="${cy + 5}" rx="4.2" ry="2.4" fill="${policzek}" opacity=".4"/>`;
        break;
      case 3:
        s = oko(cx - 10) + oko(cx + 10) +
          `<path d="M${cx - 8} ${cy + 9} q4 -2 8 0 q4 2 8 0" fill="none" stroke="${ink}" stroke-width="2.6" stroke-linecap="round"/>`;
        break;
      case 2:
        s = oko(cx - 10) + oko(cx + 10) +
          `<path d="M${cx - 16} ${cy - 11} l8 -3 M${cx + 16} ${cy - 11} l-8 -3" fill="none" stroke="${ink}" stroke-width="2.3" stroke-linecap="round"/>` +
          `<path d="M${cx - 9} ${cy + 12} Q${cx} ${cy + 4} ${cx + 9} ${cy + 12}" fill="none" stroke="${ink}" stroke-width="2.6" stroke-linecap="round"/>`;
        break;
      case 1:
        s = `<path d="M${cx - 16} ${cy - 10} l8 -3 M${cx + 16} ${cy - 10} l-8 -3" fill="none" stroke="${ink}" stroke-width="2.3" stroke-linecap="round"/>` +
          `<path d="M${cx - 14} ${cy - 4} q4 4 8 0 M${cx + 6} ${cy - 4} q4 4 8 0" fill="none" stroke="${ink}" stroke-width="2.5" stroke-linecap="round"/>` +
          `<path d="M${cx - 9} ${cy + 15} Q${cx} ${cy + 3} ${cx + 9} ${cy + 15} Z" fill="${ink}"/>` +
          `<path d="M${cx + 22} ${cy - 16} q4 6 2 9 q-3 2 -5 -1 q-1 -3 3 -8 Z" fill="#8fd3ff"/>`;
        break;
      default:
        s = `<path d="M${cx - 14} ${cy - 4} h7 M${cx + 7} ${cy - 4} h7" fill="none" stroke="${ink}" stroke-width="2.6" stroke-linecap="round"/>` +
          `<circle cx="${cx - 7}" cy="${cy + 9}" r="1.7" fill="${ink}"/><circle cx="${cx}" cy="${cy + 9}" r="1.7" fill="${ink}"/><circle cx="${cx + 7}" cy="${cy + 9}" r="1.7" fill="${ink}"/>`;
    }
    return `<g class="twarz">${s}</g>`;
  }

  /* ---------- Wspólne kształty ---------- */
  // kąt w stopniach: 0 = w prawo, 90 = w dół. Opadanie kręci liść ku dołowi po krótszej stronie.
  function opadnij(kat, ile) {
    let a = kat;
    while (a <= -90) a += 360;
    while (a > 270) a -= 360;
    return a + ile * (90 - a);
  }
  function obrot(a, cel, ile) {
    let d = (cel - a) % 360;
    if (d > 180) d -= 360;
    if (d < -180) d += 360;
    return a + d * ile;
  }
  // Liść: dwa odcinki Béziera na stronę (nasada → najszersze miejsce → czubek).
  // x w długościach liścia, y w półszerokościach.
  const KSZ = {
    owal: [0.08, 0.55, 0.22, 1, 0.52, 1, 0.8, 1, 0.94, 0.28],  // fikus: eliptyczny, krótki czubek
    ostry: [0.1, 0.5, 0.26, 1, 0.5, 1, 0.76, 1, 0.93, 0.4],    // azalia: eliptyczno-lancetowaty
  };
  function bok(ksz, dl, sz, zn, wstecz) {
    const k = KSZ[ksz], X = (v) => f(v * dl), Y = (v) => f(zn * v * sz);
    if (wstecz) return `C${X(k[8])} ${Y(k[9])} ${X(k[6])} ${Y(k[7])} ${X(k[4])} ${Y(k[5])}C${X(k[2])} ${Y(k[3])} ${X(k[0])} ${Y(k[1])} 0 0`;
    return `C${X(k[0])} ${Y(k[1])} ${X(k[2])} ${Y(k[3])} ${X(k[4])} ${Y(k[5])}C${X(k[6])} ${Y(k[7])} ${X(k[8])} ${Y(k[9])} ${f(dl)} 0`;
  }
  const liscCaly = (ksz, dl, sz) => `M0 0${bok(ksz, dl, sz, -1)}${bok(ksz, dl, sz, 1, true)}Z`;
  const liscPolowa = (ksz, dl, sz, zn) => `M0 0${bok(ksz, dl, sz, zn)}Z`;
  // koniec liścia od parametru t drugiego odcinka (podział de Casteljau); granica to łuk

      `C${f(S[0] - wciecie * dl * 1.7)} ${f(S[1] * 0.45)} ${f(S[0] + wciecie * dl * 0.5)} ${f(-S[1] * 0.35)} ${f(S[0])} ${f(-S[1])}Z`;

  // o = {czubek: 0..1 martwy koniec, plama: bool, zylka: kolor, jeden: bez jaśniejszej połówki}
  function lisc(x, y, kat, dl, sz, ksz, kJ, kC, o) {
    o = o || {};

    let g = `<g transform="translate(${f(x)} ${f(y)}) rotate(${f(kat)})"><path d="${liscCaly(ksz, dl, sz)}" fill="${kC}"/>`;
    if (!o.jeden) g += `<path d="${liscPolowa(ksz, dl, sz, zn)}" fill="${kJ}"/>`;
    if (o.plama) g += `<ellipse cx="${f(dl * 0.45)}" cy="${f(zn * sz * 0.38)}" rx="${f(dl * 0.1)}" ry="${f(sz * 0.22)}" fill="${mix(kJ, K.plama, 0.4)}"/>`;
    if (o.zylka) g += `<path d="M${f(dl * 0.08)} 0L${f(dl * 0.78)} 0" fill="none" stroke="${o.zylka}" stroke-width=".7" stroke-linecap="round"/>`;

  // liść leżący płasko na ziemi / blacie (skrót perspektywiczny)

    return `<g transform="translate(${f(x)} ${f(y)}) scale(1 .7) rotate(${f(kat)})">` +
      `<path d="${liscCaly(ksz, dl, sz)}" fill="${mix(kol, '#5a4527', 0.25)}"/>` +
      `<path d="${liscPolowa(ksz, dl, sz, -1)}" fill="${kol}"/>` +
      `<path d="M${f(dl * 0.05)} 0L${f(dl * 0.85)} 0" fill="none" stroke="${mix(kol, '#5a4527', 0.45)}" stroke-width=".8"/></g>`;

  function cien(cx, cy, rx) {

  }
  // łuk przedniej części elipsy (kąty w stopniach, 90 = najbliżej patrzącego)
  function lukPrzod(cx, cy, rx, ry, a0, a1) {
    const p = (a) => f(cx + rx * Math.cos(rad(a))) + ' ' + f(cy + ry * Math.sin(rad(a)));

  // blik na wodzie — tym dłuższy, im więcej wody
  function blikWody(cx, cy, rx, ry, M) {
    const w = 38 + 42 * M;
    return `<path d="${lukPrzod(cx, cy, rx, ry, 90 - w, 90 + w)}" fill="none" stroke="${K.wodaBlysk}" stroke-width="1.2" stroke-linecap="round" opacity=".9"/>`;

  // punkt i kierunek na krzywej kwadratowej (gałązka)
  function kwadr(A, B, Cc, t) {

  // gałąź zwężająca się od w0 do w1 (wypełniony kształt zamiast kreski o stałej grubości)

    return `<path d="M${L.join(' L')} L${P.reverse().join(' L')} Z" fill="${kol}"/>`;
  }

  /* ---------- Fikus 'Ginseng' ---------- */
  // Z szyi pnia wychodzą trzy konary, z nich długie gałązki; liście siedzą naprzemianlegle na

  const KEPY_FIKUSA = [

    { x: 101, y: 38, n: 6, g: 1, p: 1 }, { x: 127, y: 44, n: 6, g: 1, p: 1 }, { x: 150, y: 64, n: 6, g: 2, p: 1 },
    { x: 166, y: 90, n: 5, g: 2, p: 1 }, { x: 86, y: 70, n: 4, g: 0, p: 0 }, { x: 117, y: 66, n: 4, g: 2, p: 0 },
    { x: 60, y: 100, n: 3, g: 0, p: 0 }, { x: 141, y: 101, n: 3, g: 2, p: 0 }, { x: 108, y: 104, n: 3, g: 1, p: 1 },
  ];
  const KONARY_FIKUSA = [[79, 112], [101, 104], [123, 112]];
  const WIDLY_FIKUSA = [[96.5, 134], [100.3, 133], [104.2, 134]];
  function fikus(poziom, twarz, ob, male) {
    const R = los(7311);
    const S = ob.susza, Se = ob.Se, C = ob.ciemno, SL = ob.slonce, M = ob.mokro, My = ob.My;
    // gdzie ląduje punkt korony po objawach: susza — końce gałązek opadają (mocniej na zewnątrz),
    // ciemno — korona wychyla się w lewo i podnosi na wydłużonych pędach
    const przesun = (x, y) => {
      const dx = x - 100;
      const wys = c01((130 - y) / 92);
      let X = 100 + dx * (1 - 0.05 * Se);
      let Y = y + Se * (3 + 9 * Math.min(1, Math.abs(dx) / 60)) * Math.min(1, wys * 2.5);
      X -= C * 46 * Math.pow(wys, 1.1);

    };
    const sx = -6 * C; // szyja pnia też odchyla się ku oknu
    const konary = KONARY_FIKUSA.map((k) => przesun(k[0], k[1]));
    // los — zawsze tyle samo losowań, niezależnie od objawów
    let idx = 0;
    const kepy = KEPY_FIKUSA.map((k, ki) => {
      const zgiecie = (R() - 0.5) * 8;

      const B = [A[0] + (T[0] - A[0]) * 0.62 + zgiecie, A[1] + (T[1] - A[1]) * 0.3 + Se * 8];

          i, idx: idx++, t: 1 - (i * 0.45) / Math.max(1, k.n - 1), strona: (i + ki) % 2 ? 1 : -1,
          odch: i === 0 ? (R() - 0.5) * 30 : 48 + R() * 30, dl: (21 + R() * 5) * (i === 0 ? 0.9 : 1),
          t1: R(), t2: R(), t3: R(), t4: R(), t5: R(),
        });

    });

    let s = cien(100, 253, 56);
    // opadłe liście na blacie przy podstawce

    if (M > 0.05) {
      s += `<ellipse cx="100" cy="239.1" rx="45" ry="6.1" fill="${K.wodaCien}"/>`;

    } else {
      s += `<ellipse cx="100" cy="239.1" rx="45" ry="6.1" fill="#17191d"/>`;

    s += `<path d="M125 180 L139 176 L137.5 239 Q134.5 242.6 125 244.2 Z" fill="#000000" opacity=".22"/>`;

    const kolPien = szary('#b38a64', ob.szarosc);

    r += `<path d="M${P(106, 132.5)} C${P(106.2, 135.5)} ${P(107.2, 138.5)} ${P(108.6, 141)} C${P(112.4, 147)} ${P(113.8, 154)} ${P(111.6, 160.5)} C${P(113.6, 166.5)} ${P(115.2, 172)} ${P(116.6, 178)} L${P(110.6, 178)} C${P(109.4, 172)} ${P(107.6, 166)} ${P(107.8, 159.5)} C${P(109.4, 153)} ${P(108.2, 146)} ${P(104.6, 140)} C${P(103.6, 138)} ${P(103.2, 135.5)} ${P(103.2, 132.5)} Z" fill="${szary('#7d5c42', ob.szarosc)}" opacity=".5"/>`;
    r += `<path d="M${P(86, 177)} C${P(87, 171)} ${P(89, 166)} ${P(91, 161)} C${P(88.8, 153)} ${P(91.6, 146)} ${P(95, 141)} L${P(96.8, 142.2)} C${P(94, 147.5)} ${P(92.8, 153.5)} ${P(94.6, 160)} C${P(92.6, 166)} ${P(90.6, 171)} ${P(89.8, 177)} Z" fill="${szary('#d6b08a', ob.szarosc)}" opacity=".5"/>`;
    // skręt dwóch pędów i krótkie bruzdy wzdłuż pnia (nie łuki, które układały się w drugą twarz)
    r += `<path d="M${P(95.5, 166)} C${P(99, 160)} ${P(102, 154)} ${P(104.5, 147)}" fill="none" stroke="${szary('#8a6648', ob.szarosc)}" stroke-width="1.1" stroke-linecap="round" opacity=".55"/>`;
    if (!male) r += `<path d="M${P(91.5, 170)} L${P(92.8, 164)} M${P(108.5, 158)} L${P(108, 150)} M${P(98, 146)} L${P(98.6, 139)} M${P(111.5, 173)} L${P(110.8, 167)}" fill="none" stroke="${szary('#8a6648', ob.szarosc)}" stroke-width="1" stroke-linecap="round" opacity=".6"/>`;

    let tyl = '', galezie = '', przod = '';
    kepy.forEach((kp) => {
      const g = kp.liscie.slice().reverse().map((l) => rysujLisc(kp, l)).join('');
      if (kp.k.p) przod += g; else tyl += g;
      galezie += galaz(kp.A, kp.B, kp.T, kp.k.n > 4 ? 2.6 : 2.1, 0.9, kolGal);

    s += opadle.slice(4).join('');
    if (twarz) s += twarzNaDoniczce(100, 209, poziom, true);
    return s;
  }

  /* ---------- Skrzydłokwiat ---------- */
  // Każdy liść osobno: kąt nasady od pionu, długość, zgięcie czubka, szerokość, czy stoi przed

  // Asymetria jak na zdjęciu: najwyższy liść po prawej, dwa przednie po lewej zwisają za brzeg.
  const LISCIE_SKRZ = [
    { k: -70, L: 92, z: -48, W: 9, p: 0 }, { k: 72, L: 96, z: 46, W: 9, p: 0 },
    { k: -55, L: 112, z: -50, W: 10.5, p: 0 }, { k: 52, L: 118, z: 52, W: 10.5, p: 0 },

  ];
  const SKRZ_SPALONE = [4, 10, 6, 8];  // lewe górne liście, najbardziej wystawione na okno
  const SKRZ_MOKRE = [0, 14, 1];       // najniższe zewnętrzne
  function skrzydlokwiat(poziom, twarz, ob, male) {
    const R = los(2024);
    const S = ob.susza, C = ob.ciemno, SL = ob.slonce, M = ob.mokro, My = ob.My;
    const jasne = ['#97c95e', '#8cc154', '#9dcf66', '#89bd52'];
    const ciemne = ['#6b9d40', '#6fa043', '#76a947', '#64983c'];
    const nSpal = SL > 0.05 ? Math.max(1, Math.round(4 * SL)) : 0;
    const nMokre = Math.round(3 * My);
    const kolejnosc = [];
    const P2 = (a) => f(a[0]) + ' ' + f(a[1]);
    LISCIE_SKRZ.forEach((d, i) => {
      const r1 = R(), r2 = R(), r3 = R();
      if (C >= 0.6 && d.w) return;   // w cieniu kępa rzednie

      if (czubek) {
        g += koniecBlaszki(1 - czubek - 0.05, mix(cC, K.brunat, 0.55));
        g += koniecBlaszki(1 - czubek, K.spalony);

      kolejnosc.push({ g, z: -Math.abs(d.k) - (d.p ? -100 : 0), przod: !!d.p });

    let tyl = '', przod = '';
    kolejnosc.forEach((k) => { if (k.przod) przod += k.g; else tyl += k.g; });

    s += `<path d="M124 188 L139 188 L133 249 L122 249 Z" fill="#000000" opacity=".08"/>`;

      s += `<ellipse cx="100" cy="${f(188.2 - 0.8 * M)}" rx="${f(18 - 10 * M)}" ry="${f(2 - 0.9 * M)}" fill="#4b6a7b"/>`;

  /* ---------- Azalia (drzewko) ---------- */
  // pełny (podwójny) kwiat: wieniec płatków zewnętrznych, mniejszy wewnętrzny, ciemniejsze gardło.

  const ROZETY_AZALII = [

/* rytm doby: mapa 7 dób × 24 godziny na jednej skali sekwencyjnej (tokeny --sk0…--sk6) */
function mapaRytmu(el, slug) {

  T.forEach((t, i) => {
    const l = lok(t);
    if (!idx[l.klucz]) { idx[l.klucz] = { wd: l.wd, d: l.d, m: l.m, h: new Array(24).fill(null) }; dni.push(idx[l.klucz]); }
    idx[l.klucz].h[l.h] = s[m][i];

  const jedn = m === 'temp' ? '°' : '%', dz = m === 'temp' ? 1 : 0;

    d.h.forEach((v, c) => {

    });

  el.innerHTML = svg + '</svg>';
  leg.innerHTML = `<span>${ucMin ? '≤' : ''}${liczba(mn, dz)}${jedn}</span>${pasekSkali(kol, 120)}<span>${ucMax ? '≥' : ''}${liczba(mx, dz)}${jedn}</span>`;

    const c = komorki[akt];
    wyb.setAttribute('transform', `translate(${c.x.toFixed(1)} ${c.y})`);
    out.innerHTML = `${DNI[c.d.wd]} ${c.d.d}.${dwa(c.d.m)}, ${c.c}:00 — <b>${L(c.v, dz)}${jedn}</b>`;
  };

    const c = Math.floor((x - lab) / (cw + gap)), w = Math.floor(y / (ch + gap));
