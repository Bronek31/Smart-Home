<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1419">
<title>Smart Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans+Condensed:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<style>
:root{--bg:#0f1419;--panel:#151c24;--edge:#212c36;--grid:#1d262f;--grid-day:#2f3d4a;--text:#e4ebf1;--dim:#7d8d9b;--faint:#4d5a66;--ok:#5fce9e;--warn:#e8a13c;--bad:#e2708f;--pen-1:#e8a13c;--pen-2:#5fb8e0;--pen-3:#5fce9e;--pen-4:#e2708f;--pen-5:#b79ae8;--pen-6:#d4c95f;--gap:clamp(1rem,3.2vw,2rem)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;min-height:100vh;background:radial-gradient(120% 70% at 50% -10%,#1a232c 0%,transparent 60%),repeating-linear-gradient(to bottom,transparent 0 31px,rgba(255,255,255,.014) 31px 32px),var(--bg);color:var(--text);font-family:"Familjen Grotesk",system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}.sheet{max-width:1080px;margin:0 auto;padding:var(--gap) var(--gap) 4rem}
.masthead{display:flex;flex-wrap:wrap;align-items:baseline;gap:.4rem 1.2rem;padding-bottom:.8rem;border-bottom:1px solid var(--edge)}.masthead h1{margin:0;font-size:clamp(1.25rem,4.5vw,1.9rem);font-weight:700;letter-spacing:-.02em}.masthead h1 .nib{color:var(--pen-1);text-shadow:0 0 14px rgba(232,161,60,.55)}.stamp{margin-left:auto;font-family:"IBM Plex Sans Condensed",sans-serif;font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.section-title{margin:2rem 0 .55rem;font-family:"IBM Plex Sans Condensed",sans-serif;font-size:.74rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.statusbar{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--edge);border:1px solid var(--edge);margin-top:var(--gap)}.statusbox{background:var(--panel);padding:.8rem .9rem}.statusbox .k{font-family:"IBM Plex Sans Condensed",sans-serif;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}.statusbox .v{margin-top:.2rem;font-family:"IBM Plex Mono",monospace;font-size:1rem}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.45rem;background:var(--ok);box-shadow:0 0 9px currentColor}.dot.warn{background:var(--warn);color:var(--warn)}.dot.bad{background:var(--bad);color:var(--bad)}
.pens{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:1px;background:var(--edge);border:1px solid var(--edge);margin-top:1px}.pen{background:var(--panel);padding:.75rem .9rem .85rem;position:relative;overflow:hidden}.pen::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--c);box-shadow:0 0 12px 1px var(--c);opacity:.9}.pen b{display:flex;align-items:center;font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600;font-size:.74rem;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin:0 0 .35rem .5rem}.pen .read{display:flex;align-items:baseline;gap:.5rem;margin-left:.5rem;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}.pen .t{font-size:1.6rem;font-weight:400;color:var(--c);line-height:1;text-shadow:0 0 18px color-mix(in srgb,var(--c) 45%,transparent)}.pen .h{font-size:.9rem;color:var(--dim)}.pen .foot{display:flex;flex-wrap:wrap;align-items:baseline;gap:.15rem .55rem;margin:.4rem 0 0 .5rem;font-family:"IBM Plex Sans Condensed",sans-serif;font-size:.71rem;letter-spacing:.04em;color:var(--faint)}.pen .trend{font-family:"IBM Plex Mono",monospace;font-weight:500;color:var(--dim)}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:.35rem;margin-top:1.4rem;padding-bottom:.6rem;border-bottom:1px solid var(--edge);font-family:"IBM Plex Sans Condensed",sans-serif}.controls .lbl{font-size:.7rem;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);margin-right:.45rem}.range{appearance:none;border:1px solid var(--edge);background:transparent;color:var(--dim);font:inherit;font-size:.83rem;letter-spacing:.03em;padding:.24rem .72rem;cursor:pointer;border-radius:0;transition:.15s}.range:hover{border-color:var(--grid-day);color:var(--text)}.range[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}.toggles{display:flex;flex-wrap:wrap;gap:.1rem;margin-left:auto}.toggle{appearance:none;border:0;background:transparent;font:inherit;font-size:.8rem;color:var(--dim);padding:.24rem .5rem;cursor:pointer;display:inline-flex;align-items:center;gap:.42rem}.toggle::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 9px var(--c)}.toggle[aria-pressed="false"]{opacity:.32}.toggle[aria-pressed="false"]::before{background:transparent;box-shadow:none;border:1.5px solid var(--c)}
.trace{margin-top:1.7rem}.trace h2{margin:0 0 .5rem;font-family:"IBM Plex Sans Condensed",sans-serif;font-size:.74rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);display:flex;align-items:baseline;gap:.55rem}.trace h2 small{font-weight:400;letter-spacing:.06em;color:var(--faint);text-transform:none}.plot{position:relative;height:238px;background:var(--panel);border:1px solid var(--edge)}@media(min-width:700px){.plot{height:300px}}
.split{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(260px,.8fr);gap:1.2rem;margin-top:2rem}.panel{background:var(--panel);border:1px solid var(--edge);padding:1rem}.panel h2{margin:0 0 .75rem;font-family:"IBM Plex Sans Condensed",sans-serif;font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.map{width:100%;height:auto;display:block;background:#111820;border:1px solid var(--edge)}.room{fill:#151c24;stroke:#3a4a57;stroke-width:2}.room.active{fill:#19242d}.room-label{fill:#c8d2da;font:600 16px "IBM Plex Sans Condensed",sans-serif;letter-spacing:.04em;text-anchor:middle}.room-value{fill:#e4ebf1;font:400 13px "IBM Plex Mono",monospace;text-anchor:middle}.room-dot{stroke:#0f1419;stroke-width:3}.map-legend{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:.65rem;font:400 .72rem "IBM Plex Sans Condensed",sans-serif;color:var(--dim)}.map-legend span{display:inline-flex;align-items:center;gap:.35rem}.legend-dot{width:8px;height:8px;border-radius:50%}.legend-dot.ok{background:var(--ok)}.legend-dot.warn{background:var(--warn)}.legend-dot.bad{background:var(--bad)}
.events{display:flex;flex-direction:column;gap:0}.event{display:grid;grid-template-columns:8px 1fr auto;gap:.55rem;align-items:start;padding:.55rem 0;border-bottom:1px solid var(--edge)}.event:last-child{border-bottom:0}.event .edot{width:7px;height:7px;border-radius:50%;margin-top:.4rem;background:var(--ok)}.event.warn .edot{background:var(--warn);box-shadow:0 0 7px var(--warn)}.event.bad .edot{background:var(--bad);box-shadow:0 0 7px var(--bad)}.event .et{font-size:.82rem}.event .es{font-family:"IBM Plex Mono",monospace;font-size:.7rem;color:var(--faint);white-space:nowrap}.empty{color:var(--faint);font-size:.84rem;padding:.5rem 0}
.summary{width:100%;border-collapse:collapse;margin-top:2.1rem;font-size:.85rem}.summary caption{text-align:left;font-family:"IBM Plex Sans Condensed",sans-serif;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);padding-bottom:.55rem}.summary th,.summary td{text-align:right;padding:.45rem .5rem;border-bottom:1px solid var(--edge);font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-weight:300;color:var(--text)}.summary th{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}.summary th:first-child,.summary td:first-child{text-align:left}.summary td:first-child{font-family:"Familjen Grotesk",sans-serif;font-weight:400;border-left:3px solid var(--c);padding-left:.7rem}.warn-text{color:var(--warn)!important}.bad-text{color:var(--bad)!important}
.notice{margin:2.5rem 0;padding:1.4rem 1.5rem;border:1px solid var(--edge);background:var(--panel);max-width:44rem}.notice h2{margin:0 0 .55rem;font-size:1.05rem}.notice p{margin:.45rem 0;color:var(--dim);font-size:.92rem}.notice code{font-family:"IBM Plex Mono",monospace;font-size:.85em;color:var(--pen-1);background:#0b1015;padding:.12em .42em;border:1px solid var(--edge)}[hidden]{display:none!important}@media(max-width:720px){.statusbar{grid-template-columns:1fr}.split{grid-template-columns:1fr}.summary{font-size:.75rem;display:block;overflow-x:auto;white-space:nowrap}.summary th,.summary td{padding:.4rem .35rem}}
</style>
</head>
<body><main class="sheet">
<header class="masthead"><h1><span class="nib">&#9134;</span> Smart Home</h1><span class="stamp" id="stamp">wczytywanie&hellip;</span></header>
<section id="app" hidden>
  <div class="statusbar" id="statusbar"></div>
  <div class="pens" id="pens"></div>
  <div class="controls"><span class="lbl">Zakres</span><button class="range" data-hours="24">24 h</button><button class="range" data-hours="168" aria-pressed="true">7 dni</button><button class="range" data-hours="720">30 dni</button><button class="range" data-hours="0">całość</button><div class="toggles" id="toggles"></div></div>

  <div class="split">
    <section class="panel"><h2>Plan mieszkania · aktualny stan</h2><svg class="map" viewBox="0 0 889 718" role="img" aria-label="Schemat mieszkania z temperaturą i wilgotnością w pokojach">
      <path class="room" d="M370 50 L615 45 L610 215 L490 210 L490 300 L510 305 L510 235 L600 240 L595 395 L485 395 L485 355 L470 355 L470 405 L600 405 L590 590 L400 585 L405 440 L375 440 L375 400 L410 400 L410 340 L370 340 L370 285 L180 290 L180 350 L150 350 L150 285 L160 280 L420 280 L420 215 L365 215 Z" opacity="0"/>
      <path class="room" d="M370 50 L615 45 L610 215 L490 210 L490 300 L510 305 L510 235 L600 240 L595 395 L485 395 L485 355 L470 355 L470 405 L600 405 L590 590 L400 585 L405 440 L375 440 L375 400 L410 400 L410 340 L370 340 L370 285 L180 290 L180 350 L150 350 L150 285 L160 280 L420 280 L420 215 L365 215 Z" fill="#151c24"/>
      <path class="room" d="M370 50 L615 45 L610 215 L490 210 L490 300 L510 305 L510 235 L600 240 L595 395 L485 395 L485 355 L470 355 L470 405 L600 405 L590 590 L400 585 L405 440 L375 440 L375 400 L410 400 L410 340 L370 340 L370 285 L180 290 L180 350 L150 350 L150 285 L160 280 L420 280 L420 215 L365 215 Z" fill="none"/>
      <path class="room" d="M365 50 L615 45 L610 215 L490 210 L490 300 L420 280 L420 215 L365 215 Z"/><path class="room" d="M510 235 L600 240 L595 395 L485 395 L485 355 L470 355 L470 305 L510 305 Z"/><path class="room" d="M400 405 L600 405 L590 590 L400 585 L405 440 L375 440 L375 400 Z"/><path class="room" d="M160 280 L420 280 L420 340 L370 340 L370 400 L375 400 L375 440 L340 440 L340 660 L115 655 L125 495 L180 495 L180 465 L175 465 L175 350 L150 350 L150 285 Z"/>
      <text class="room-label" x="490" y="135">Sypialnia</text><text class="room-label" x="545" y="315">Łazienka</text><text class="room-label" x="500" y="505">Salon</text><text class="room-label" x="230" y="585">Kuchnia</text>
      <g id="map-points"></g>
    </svg><div class="map-legend"><span><i class="legend-dot ok"></i> OK</span><span><i class="legend-dot warn"></i> uwaga</span><span><i class="legend-dot bad"></i> problem</span></div></section>
    <section class="panel"><h2>Ostatnie zdarzenia</h2><div class="events" id="events"></div></section>
  </div>

  <div class="trace"><h2>Temperatura <small>&deg;C</small></h2><div class="plot"><canvas id="temp"></canvas></div></div>
  <div class="trace"><h2>Wilgotność względna <small>%</small></h2><div class="plot"><canvas id="hum"></canvas></div></div>
  <div class="trace"><h2>Odstęp między raportami <small>minuty · im niżej i stabilniej, tym lepiej</small></h2><div class="plot"><canvas id="gap"></canvas></div></div>

  <table class="summary" id="summary"></table><table class="summary" id="health"></table>
</section><div class="notice" id="notice" hidden></div>
</main>
<script>
const PENS=['#e8a13c','#5fb8e0','#5fce9e','#e2708f','#b79ae8','#d4c95f'];const CSS=getComputedStyle(document.documentElement);const C=n=>CSS.getPropertyValue(n).trim();
const state={hours:168,devices:[],rows:[],off:new Set(),charts:{},health:[]};const monthCache=new Map();
const fmtNum=(v,d=1)=>v==null||!isFinite(v)?'–':v.toFixed(d).replace('.',',');const pad=n=>String(n).padStart(2,'0');const isMidnight=d=>d.getHours()===0&&d.getMinutes()===0;
function fmtWhen(d,span){if(isMidnight(d)||span>24*14)return `${pad(d.getDate())}.${pad(d.getMonth()+1)}`;if(span<=36)return `${pad(d.getHours())}:${pad(d.getMinutes())}`;return `${pad(d.getHours())}:00`}
const STEPS_H=[1,2,3,6,12,24,48,72,96,120,168,336,720];function timeTicks(min,max,width){const target=width<420?5:width<760?8:11,spanH=(max-min)/3600e3,step=STEPS_H.find(s=>spanH/s<=target)||STEPS_H.at(-1),first=new Date(min);first.setHours(0,0,0,0);const out=[];for(let t=first.getTime();t<=max;t+=step*3600e3)if(t>=min)out.push({value:t});return out}
function fmtDur(ms){if(ms==null||!isFinite(ms))return'–';const min=ms/60000;if(min<1)return`${Math.round(ms/1000)} s`;if(min<90)return`${Math.round(min)} min`;const h=min/60;if(h<36)return`${h.toFixed(1).replace('.',',')} godz.`;return`${Math.round(h/24)} dni`}
function fmtAgo(ms){const min=Math.round((Date.now()-ms)/60000);if(min<2)return'przed chwilą';if(min<60)return`${min} min temu`;const h=Math.round(min/60);if(h<48)return`${h} godz. temu`;return`${Math.round(h/24)} dni temu`}
function fail(title,...paras){document.getElementById('stamp').textContent='brak danych';const n=document.getElementById('notice');n.innerHTML=`<h2>${title}</h2>`+paras.map(p=>`<p>${p}</p>`).join('');n.hidden=false}
async function loadMonth(m){if(monthCache.has(m))return monthCache.get(m);const res=await fetch(`data/${m}.csv`,{cache:'no-cache'});if(!res.ok){monthCache.set(m,[]);return[]}const text=await res.text();const lines=text.trim().split('\n');const rows=[];for(let i=1;i<lines.length;i++){const [ts,id,code,value]=lines[i].replace(/\r$/,'').split(',');if(!ts)continue;rows.push({t:Date.parse(ts),id,code,v:parseFloat(value),raw:value})}monthCache.set(m,rows);return rows}
async function boot(){let manifest;try{const res=await fetch('data/index.json',{cache:'no-cache'});if(!res.ok)throw new Error(res.status);manifest=await res.json()}catch{return fail('Nie ma jeszcze żadnych odczytów','Plik <code>data/index.json</code> pojawi się po pierwszym udanym przebiegu kolektora.','Uruchom <b>Zbieranie odczytów</b> w Actions.')}const ids=Object.keys(manifest.devices||{});if(!ids.length)return fail('Kolektor nie znalazł czujników','Sprawdź urządzenia w Tuya.');if(!(manifest.months||[]).length)return fail('Czujniki są, odczytów jeszcze nie ma','Po pierwszym przebiegu kolektora dane pojawią się tutaj.');state.devices=ids.map((id,i)=>{const d=manifest.devices[id],codes=d.codes||{};return{id,name:d.name||id,color:PENS[i%PENS.length],temp:Object.keys(codes).find(c=>codes[c].kind==='temp'),hum:Object.keys(codes).find(c=>codes[c].kind==='hum'),batt:Object.keys(codes).find(c=>codes[c].kind==='battery')}});const months=manifest.months.slice().sort();state.rows=(await Promise.all(months.map(loadMonth))).flat().sort((a,b)=>a.t-b.t);if(!state.rows.length)return fail('Pliki z danymi są puste','Kolektor jeszcze nic nie zapisał.');const spanH=(state.rows.at(-1).t-state.rows[0].t)/3600e3;state.hours=spanH<=24?24:spanH<=168?168:spanH<=720?720:0;document.getElementById('app').hidden=false;buildToggles();wireRanges();render()}
function buildToggles(){const box=document.getElementById('toggles');box.innerHTML='';state.devices.forEach(d=>{const b=document.createElement('button');b.className='toggle';b.style.setProperty('--c',d.color);b.setAttribute('aria-pressed','true');b.textContent=d.name;b.onclick=()=>{const on=b.getAttribute('aria-pressed')==='true';b.setAttribute('aria-pressed',String(!on));on?state.off.add(d.id):state.off.delete(d.id);render()};box.appendChild(b)})}
function wireRanges(){document.querySelectorAll('.range').forEach(b=>b.onclick=()=>{document.querySelectorAll('.range').forEach(o=>o.removeAttribute('aria-pressed'));b.setAttribute('aria-pressed','true');state.hours=+b.dataset.hours;render()})}
function bucket(points,limit=900){if(points.length<=limit)return points;const size=Math.ceil(points.length/limit),out=[];for(let i=0;i<points.length;i+=size){const s=points.slice(i,i+size);out.push({x:s[Math.floor(s.length/2)].x,y:s.reduce((a,p)=>a+p.y,0)/s.length})}return out}
function series(kind){const from=state.hours?Date.now()-state.hours*3600e3:0;return state.devices.filter(d=>d[kind]&&!state.off.has(d.id)).map(d=>{const pts=state.rows.filter(r=>r.id===d.id&&r.code===d[kind]&&r.t>=from&&isFinite(r.v)).map(r=>({x:r.t,y:r.v}));return{device:d,points:bucket(pts)}}).filter(s=>s.points.length)}
function rawPoints(device,kind,from){if(!device[kind])return[];return state.rows.filter(r=>r.id===device.id&&r.code===device[kind]&&r.t>=from&&isFinite(r.v))}
function readings(device,kind){if(!device[kind])return{last:null,dayAgo:null};const cutoff=Date.now()-24*3600e3;let last=null,dayAgo=null;for(const r of state.rows){if(r.id!==device.id||r.code!==device[kind]||!isFinite(r.v))continue;last=r;if(r.t<=cutoff)dayAgo=r}return{last,dayAgo}}
const BATTERY_PL={low:'niski',middle:'średni',high:'wysoki'};function lastBattery(d){if(!d.batt)return null;for(let i=state.rows.length-1;i>=0;i--){const r=state.rows[i];if(r.id===d.id&&r.code===d.batt)return BATTERY_PL[r.raw]||(isFinite(r.v)?`${r.v}%`:r.raw)}return null}
function healthFor(d,from){const T=rawPoints(d,'temp',from),H=rawPoints(d,'hum',from),times=T.map(r=>r.t),gaps=times.slice(1).map((t,i)=>t-times[i]),sorted=gaps.slice().sort((a,b)=>a-b),median=sorted.length?sorted[Math.floor(sorted.length/2)]:null,worst=gaps.length?Math.max(...gaps):null,humTimes=new Set(H.map(r=>r.t)),paired=T.length?T.filter(r=>humTimes.has(r.t)).length/T.length:null,last=Math.max(T.at(-1)?.t||0,H.at(-1)?.t||0),suspicious=T.length>=6&&median!=null&&worst!=null&&worst>5*median;let status='ok';const redLimit=Math.max(180*60000,(median||60*60000)*6),warnLimit=Math.max(60*60000,(median||60*60000)*3);if(!last||Date.now()-last>redLimit)status='bad';else if(suspicious||(paired!=null&&paired<.8)||Date.now()-last>warnLimit)status='warn';return{d,nT:T.length,nH:H.length,median,worst,paired,last,batt:lastBattery(d),status,gaps,times}}
function computeHealth(){const from=Date.now()-24*3600e3;state.health=state.devices.map(d=>healthFor(d,from));return state.health}
function renderStatus(){const hs=state.health,ok=hs.filter(r=>r.status==='ok').length,warn=hs.filter(r=>r.status==='warn').length,bad=hs.filter(r=>r.status==='bad').length,last=Math.max(...hs.map(r=>r.last||0));document.getElementById('statusbar').innerHTML=`<div class="statusbox"><div class="k">Czujniki</div><div class="v"><span class="dot ${bad?'bad':warn?'warn':''}"></span>${ok}/${hs.length} OK${warn?` · ${warn} uwaga`:''}${bad?` · ${bad} problem`:''}</div></div><div class="statusbox"><div class="k">Ostatni kontakt</div><div class="v">${last?fmtAgo(last):'brak danych'}</div></div><div class="statusbox"><div class="k">Największa przerwa</div><div class="v">${fmtDur(Math.max(...hs.map(r=>r.worst||0)))}</div></div>`}
function renderPens(){const box=document.getElementById('pens');box.innerHTML='';state.devices.forEach(d=>{const t=readings(d,'temp'),h=readings(d,'hum'),when=Math.max(t.last?.t||0,h.last?.t||0),r=state.health.find(x=>x.d.id===d.id);let trend='';if(t.last&&t.dayAgo){const diff=t.last.v-t.dayAgo.v;const arrow=diff>.05?'▲':diff<-.05?'▼':'=';trend=`<span class="trend">${arrow} ${fmtNum(Math.abs(diff))}° 24h</span>`}const el=document.createElement('div');el.className='pen';el.style.setProperty('--c',d.color);el.innerHTML=`<b><span class="dot ${r?.status==='bad'?'bad':r?.status==='warn'?'warn':''}"></span>${d.name}</b><div class="read"><span class="t">${fmtNum(t.last?.v,1)}&deg;</span><span class="h">${fmtNum(h.last?.v,0)}%</span></div><div class="foot"><span>${when?fmtAgo(when):'brak odczytu'}</span>${trend}<span>bateria: ${r?.batt||'–'}</span></div>`;box.appendChild(el)})}
function draw(canvasId,sets,unit,decimals){const span=state.hours||24*400;const cfg={type:'line',data:{datasets:sets.map(s=>({label:s.device.name,data:s.points,borderColor:s.device.color,backgroundColor:s.device.color,borderWidth:1.5,pointRadius:0,pointHitRadius:12,tension:.18,spanGaps:3*3600e3}))},options:{responsive:true,maintainAspectRatio:false,animation:false,interaction:{mode:'index',intersect:false},layout:{padding:{right:16,top:6}},scales:{x:{type:'time',afterBuildTicks:s=>{s.ticks=timeTicks(s.min,s.max,s.chart.width)},border:{color:C('--edge')},grid:{tickLength:4,color:ctx=>ctx.tick&&isMidnight(new Date(ctx.tick.value))?C('--grid-day'):C('--grid')},ticks:{color:C('--dim'),font:{family:'IBM Plex Sans Condensed',size:11},maxRotation:0,autoSkip:false,callback:v=>fmtWhen(new Date(v),span)}},y:{border:{color:C('--edge')},grid:{color:C('--grid')},ticks:{color:C('--dim'),font:{family:'IBM Plex Mono',size:11},callback:v=>fmtNum(v,decimals)}}},plugins:{legend:{display:false},tooltip:{backgroundColor:'#080c10',titleColor:C('--dim'),bodyColor:C('--text'),borderColor:C('--grid-day'),borderWidth:1,cornerRadius:0,padding:10,titleFont:{family:'IBM Plex Sans Condensed',size:11,weight:'600'},bodyFont:{family:'IBM Plex Mono',size:12},callbacks:{title:items=>new Intl.DateTimeFormat('pl-PL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(items[0].parsed.x)),label:item=>` ${item.dataset.label}  ${fmtNum(item.parsed.y,decimals)} ${unit}`}}}}};state.charts[canvasId]?.destroy();state.charts[canvasId]=new Chart(document.getElementById(canvasId),cfg)}
function drawGap(){const from=state.hours?Date.now()-state.hours*3600e3:0;const sets=state.devices.filter(d=>!state.off.has(d.id)).map(d=>{const pts=rawPoints(d,'temp',from);const g=pts.slice(1).map((r,i)=>({x:r.t,y:(r.t-pts[i].t)/60000}));return{device:d,points:bucket(g)}}).filter(s=>s.points.length);draw('gap',sets,'min',0)}
function renderMap(){const pos={Salon:[500,505],Kuchnia:[230,585],Łazienka:[545,315],Sypialnia:[490,135]};const g=document.getElementById('map-points');g.innerHTML='';state.health.forEach(r=>{const p=pos[r.d.name];if(!p)return;const t=readings(r.d,'temp').last,h=readings(r.d,'hum').last;const col=r.status==='bad'?C('--bad'):r.status==='warn'?C('--warn'):C('--ok');g.innerHTML+=`<circle class="room-dot" cx="${p[0]}" cy="${p[1]-28}" r="8" fill="${col}"/><text class="room-value" x="${p[0]}" y="${p[1]-3}">${fmtNum(t?.v,1)}° · ${fmtNum(h?.v,0)}%</text>`})}
function renderEvents(){const ev=[];state.health.forEach(r=>{if(r.suspicious){const idx=r.gaps.indexOf(r.worst);ev.push({t:r.times[idx+1]||r.last,status:'warn',text:`${r.d.name} — przerwa ${fmtDur(r.worst)} przy typowym odstępie ${fmtDur(r.median)}`})}if(r.paired!=null&&r.paired<.8)ev.push({t:r.last,status:'warn',text:`${r.d.name} — tylko ${Math.round(r.paired*100)}% raportów temp. ma wilgotność`});if(r.last&&Date.now()-r.last>Math.max(60*60000,(r.median||60*60000)*3))ev.push({t:r.last,status:'bad',text:`${r.d.name} — ostatni raport ${fmtAgo(r.last)}`})});ev.sort((a,b)=>(b.t||0)-(a.t||0));const box=document.getElementById('events');box.innerHTML=ev.slice(0,7).map(e=>`<div class="event ${e.status}"><i class="edot"></i><div class="et">${e.text}</div><div class="es">${e.t?new Intl.DateTimeFormat('pl-PL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(e.t)):''}</div></div>`).join('')||'<div class="empty">Brak anomalii w ostatnich 24 godzinach.</div>'}
function renderSummary(tempSets,humSets){const stats=pts=>{const ys=pts.map(p=>p.y);return ys.length?{min:Math.min(...ys),max:Math.max(...ys),avg:ys.reduce((a,b)=>a+b,0)/ys.length}:null};const byId=sets=>Object.fromEntries(sets.map(s=>[s.device.id,stats(s.points)]));const T=byId(tempSets),H=byId(humSets),shown=state.devices.filter(d=>T[d.id]||H[d.id]);document.getElementById('summary').innerHTML=`<caption>Zakresy · ${rangeLabel()}</caption><thead><tr><th>Czujnik</th><th>min °C</th><th>śr °C</th><th>max °C</th><th>min %</th><th>śr %</th><th>max %</th></tr></thead><tbody>`+shown.map(d=>{const t=T[d.id],h=H[d.id];return`<tr style="--c:${d.color}"><td>${d.name}</td><td>${fmtNum(t?.min)}</td><td>${fmtNum(t?.avg)}</td><td>${fmtNum(t?.max)}</td><td>${fmtNum(h?.min,0)}</td><td>${fmtNum(h?.avg,0)}</td><td>${fmtNum(h?.max,0)}</td></tr>`}).join('')+'</tbody>'}
function renderHealth(){document.getElementById('health').innerHTML=`<caption>Łączność z bramką · ${rangeLabel()} · diagnostyka ostatnich 24 h</caption><thead><tr><th>Czujnik</th><th>temp.</th><th>wilg.</th><th>typowy odstęp</th><th>najdłuższa przerwa</th><th>razem</th><th>bateria</th><th>ostatni</th></tr></thead><tbody>`+state.health.map(r=>`<tr style="--c:${r.d.color}"><td>${r.d.name}</td><td>${r.nT}</td><td>${r.nH}</td><td>${fmtDur(r.median)}</td><td class="${r.suspicious?'warn-text':''}">${fmtDur(r.worst)}</td><td class="${r.paired!=null&&r.paired<.8?'warn-text':''}">${r.paired==null?'–':Math.round(r.paired*100)+'%'}</td><td class="${r.batt==='niski'?'warn-text':''}">${r.batt||'–'}</td><td>${r.last?fmtAgo(r.last):'–'}</td></tr>`).join('')+'</tbody>'}
function rangeLabel(){const base={24:'ostatnie 24 godziny',168:'ostatnie 7 dni',720:'ostatnie 30 dni',0:'cała historia'}[state.hours],oldest=state.rows[0]?.t,from=state.hours?Date.now()-state.hours*3600e3:0;if(oldest&&oldest>from+3600e3)return`${base} · dane od ${new Intl.DateTimeFormat('pl-PL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(oldest))}`;return base}
function render(){computeHealth();renderStatus();renderPens();renderMap();renderEvents();const T=series('temp'),H=series('hum');draw('temp',T,'°C',1);draw('hum',H,'%',0);drawGap();renderSummary(T,H);renderHealth();const newest=state.rows.at(-1)?.t;document.getElementById('stamp').textContent='ostatni zapis · '+(newest?new Intl.DateTimeFormat('pl-PL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(newest)):'–')}
boot();
</script></body></html>
