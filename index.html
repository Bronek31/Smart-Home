   miesiąca w środku okna. */
const DNI_SUROWYCH = 9;
const BLEDY = {
  brak: { tytul: 'Nie ma jeszcze żadnych odczytów', akapity: ['Plik data/index.json pojawi się po pierwszym udanym przebiegu kolektora.', 'Uruchom Zbieranie odczytów w Actions.'] },
  czujniki: { tytul: 'Kolektor nie znalazł czujników', akapity: ['Sprawdź urządzenia w Tuya.'] },
  odczyty: { tytul: 'Czujniki są, odczytów jeszcze nie ma', akapity: ['Po pierwszym przebiegu kolektora dane pojawią się tutaj.'] },
  puste: { tytul: 'Pliki z danymi są puste', akapity: ['Kolektor jeszcze nic nie zapisał.'] },
  siec: { tytul: 'Brak połączenia', akapity: ['Spróbuję ponownie, gdy telefon złapie sieć.'] },
};
const RADA_WIETRZENIA = 'Okno na oścież przez 5–10 minut. Uchylone na godziny wychładza ściany, a prawie nie osusza.';
const STRONY_SWIATA = { pld: 'południe', pln: 'północ' };

/* Filtr chwilowych skoków (czujnik w dłoni, przestawianie). Kopia w Pythonie: drop_spikes w fetch.py — obie muszą
   odrzucać to samo, bo dzienne.csv jest liczone po filtrze, a seria godzinowa na wykresie też; inaczej wykres
   rozjeżdża się z „7 dni” i „30 dni”. Baza to spokojny poziom sprzed wzrostu, wycinane jest tylko to, co wraca —
   farelka, która grzeje godzinami, zostaje. Tylko pokoje, nie dwór.
   rise: jak daleko wstecz szukamy poziomu sprzed wzrostu. Było 12 min i przez to filtr nie odrzucił ani jednego
   odczytu z 1152 — epizod z 19.08 minął się z oknem o 17 sekund (baza 13:46:23, szczyt 13:58:40). Przy 15 min filtr
   łapie ten epizod i — zmierzone na pełnej historii — nie rusza niczego innego; wynik jest ten sam aż do 30 min. */
const SPIKE={temp:{jump:1.5,back:1.0},hum:{jump:8,back:5},rise:15*60000,max:90*60000};
function despike(pts,kind){
  const p=SPIKE[kind];
  if(!p||pts.length<3)return{pts,cut:0};
  const bad=new Set();
  let i=1;
  while(i<pts.length){
    let k=i-1;
    while(k>0&&pts[i].x-pts[k-1].x<=SPIKE.rise)k--;   // poziom sprzed wzrostu
    const base=pts[k].y;
    let spokojnie=true;
    for(let m=k-1;m>=0&&pts[k].x-pts[m].x<=SPIKE.rise;m--)if(Math.abs(pts[m].y-base)>=p.back){spokojnie=false;break}
    if(spokojnie&&Math.abs(pts[i].y-base)>=p.jump){
      let j=i;
      while(j<pts.length&&pts[j].x-pts[k].x<=SPIKE.max&&Math.abs(pts[j].y-base)>=p.back)j++;
      if(j<pts.length&&pts[j].x-pts[k].x<=SPIKE.max){   // wróciło => wyskok, nie zmiana
        let m=k+1;
        while(m<j&&Math.abs(pts[m].y-base)<p.back)m++;
        for(let q=m;q<j;q++)bad.add(q);
        i=j+1;continue;
      }
    }
    i++;
  }
  return bad.size?{pts:pts.filter((_,k)=>!bad.has(k)),cut:bad.size}:{pts,cut:0};
}

/* Seria godzinowa (D8): punkt b = średnia odczytów z (b − 1 godz., b], pusta godzina = null — bez przeciągania
   poprzedniej wartości, bo to ukrywałoby ciszę czujnika (płaska linia zamiast dziury). Ta konwencja jest pod
   indeksami prototypu: komórka „14:00” w rytmie doby to odczyty 13:00–14:00. */
function seriaGodzinowa(pkt, start, koniec) {
  const n = Math.round((koniec - start) / GODZ) + 1, suma = new Array(n).fill(0), ile = new Array(n).fill(0);
  pkt.forEach((q) => {
    const i = Math.round((Math.ceil(q.x / GODZ) * GODZ - start) / GODZ);
    if (i >= 0 && i < n && isFinite(q.y)) { suma[i] += q.y; ile[i]++; }
  });
  return suma.map((s, i) => (ile[i] ? Math.round(s / ile[i] * 10) / 10 : null));
}
const absHum = (t, rh) => (jestLiczba(t) && jestLiczba(rh) ? 2.1674 * 6.112 * Math.exp(17.62 * t / (243.12 + t)) * rh / (273.15 + t) : null);
/* Jaką część godzin pokój spędził w polu komfortu i w którą stronę uciekał najczęściej. Punkt może być naraz za ciepły
   i za wilgotny — liczy się wtedy do obu kierunków. Krawędzie należą do pola. */
function ocenKomfort(pkt) {
  if (!pkt.length) return null;
  const poza = { zimno: 0, cieplo: 0, sucho: 0, wilgotno: 0 };
  let w = 0;
  pkt.forEach((p) => {
    const tt = p.x < POLE.t[0] ? 'zimno' : p.x > POLE.t[1] ? 'cieplo' : null;
    const hh = p.y < POLE.h[0] ? 'sucho' : p.y > POLE.h[1] ? 'wilgotno' : null;
    if (!tt && !hh) { w++; return; }
    if (tt) poza[tt]++;
    if (hh) poza[hh]++;
  });
  const g = Object.keys(poza).sort((a, b) => poza[b] - poza[a])[0];
  return { udzial: w / pkt.length, poza, glownie: poza[g] ? g : null, n: pkt.length };
}
/* północ w Warszawie dla doby, w której leży `ms` (25.10 i 28.03 doba ma 25 i 23 godziny) */
function polnocWarszawy(ms) {
  const l = lok(ms);
  for (let off = -3; off <= 3; off++) {
    const t = Date.UTC(l.r, l.m - 1, l.d) + off * GODZ, x = lok(t);
    if (x.klucz === l.klucz && x.h === 0 && x.min === 0) return t;
  }
  return ms - ((l.h * 60 + l.min) * 6e4);
}
function przesunDate(klucz, dni) {
  const a = klucz.split('-').map(Number), d = new Date(Date.UTC(a[0], a[1] - 1, a[2] + dni));
  return d.getUTCFullYear() + '-' + dwa(d.getUTCMonth() + 1) + '-' + dwa(d.getUTCDate());
}
function czytajCsv(tekst) {
  const out = [], linie = String(tekst || '').split('\n');
  for (let i = 1; i < linie.length; i++) {
    const c = linie[i].replace(/\r$/, '').split(',');
    if (c.length < 4 || !c[0]) continue;
    const t = Date.parse(c[0]);
    if (isFinite(t)) out.push({ t, id: c[1], code: c[2], v: parseFloat(c[3]), raw: c[3] });
  }
  return out;
}
/* dzienne.csv: doby lokalne Europe/Warsaw z kolektora, po filtrze skoków i bez artefaktów */
function czytajDzienne(tekst) {
  const out = [], linie = String(tekst || '').split('\n');
  for (let i = 1; i < linie.length; i++) {
    const c = linie[i].replace(/\r$/, '').split(',');
    if (c.length < 7 || !/^\d{4}-\d\d-\d\d$/.test(c[0])) continue;
    out.push({ date: c[0], id: c[1], code: c[2], min: parseFloat(c[3]), avg: parseFloat(c[4]), max: parseFloat(c[5]), n: parseFloat(c[6]) });
  }
  return out;
}
/* Znane artefakty (artefakty.json przez manifest): przedziały, w których czujnik mierzył coś innego niż pokój —
   farelka tuż pod nim, przenoszenie. Znikają z wykresów i zakresów, a bieżący odczyt i diagnostyka ich nie tracą. */
function wczytajArtefakty(lista) {
  return (Array.isArray(lista) ? lista : []).map((a) => ({ id: a && a.czujnik, od: czasIso(a && a.od), do: czasIso(a && a.do) }))
    .filter((a) => a.id && a.od != null && a.do != null && a.od < a.do);
}

/* Z surowych plików (`z`) i chwili `teraz` buduje D. Czysta funkcja — testy wołają ją przez window.SH. */
function zbudujDane(z, teraz) {
  z = z || {};
  const m = z.manifest && typeof z.manifest === 'object' ? z.manifest : null;
  const D2 = { chwila_ms: teraz, strefa: TZ, zbiorka_ms: m ? czasIso(m.updated) : null, pokoje: [], dobowe_30_dni: {}, zakresy_7_dni: {},
    seria_koniec_ms: null, pogoda: null, wietrzenie: { rada: RADA_WIETRZENIA, jak: '' }, komfort_dzis: [], przerwa_ms: null,
    dom: null, dom_ms: null, rosliny: [], rosliny_ms: null, rosliny_blad: null, rosliny_stare: false, blad: null, blad_roslin: null,
    powiadomienia: { lista: [], tryb_dom: null, tryb_rosliny: null } };
  const konf = z.pokoje && z.pokoje.pokoje && typeof z.pokoje.pokoje === 'object' ? z.pokoje.pokoje : {};
  const zajete = {};
  ZAKLADKI_ID.forEach((k) => { zajete[k] = true; });
  const wolny = (s) => { let x = s, i = 2; while (zajete[x]) x = s + '-' + i++; zajete[x] = true; return x; };
  const urz = m && m.devices && typeof m.devices === 'object' ? m.devices : {};

  // ---- pokoje i dwór ----
  const lista = Object.keys(urz).map((id) => {
    const d = urz[id] || {}, codes = d.codes || {}, kod = (k) => Object.keys(codes).find((c) => codes[c] && codes[c].kind === k);
    return { id, d, temp: kod('temp'), hum: kod('hum'), batt: kod('battery'), ext: !!d.external, app: !!d.appliance };
  }).filter((x) => !x.app);
  if (!m) D2.blad = BLEDY.brak;
  else if (!lista.some((x) => !x.ext)) D2.blad = BLEDY.czujniki;
  else if (!(Array.isArray(m.months) && m.months.length)) D2.blad = BLEDY.odczyty;
  else if (!(z.wiersze || []).length) D2.blad = BLEDY.puste;
  if (!D2.blad) {
    const art = wczytajArtefakty(m.artefakty);
    const wszystkie = {}, bezArt = {};
    z.wiersze.forEach((r) => {
      const k = r.id + '|' + r.code;
      (wszystkie[k] = wszystkie[k] || []).push(r);
      if (!art.some((a) => a.id === r.id && r.t >= a.od && r.t <= a.do)) (bezArt[k] = bezArt[k] || []).push(r);
    });
    const odczyty = (zb, id, kod) => (kod ? (zb[id + '|' + kod] || []).filter((r) => isFinite(r.v)) : []);
    const chwila = D2.zbiorka_ms != null ? Math.min(D2.zbiorka_ms, teraz) : teraz;
    const koniec = Math.floor(chwila / GODZ) * GODZ, start = koniec - 168 * GODZ;
    D2.seria_koniec_ms = koniec;
    let kolor = 0;
    lista.forEach((x) => {
      const k = konf[x.id] && typeof konf[x.id] === 'object' ? konf[x.id] : {};
      const nazwa = typeof k.nazwa === 'string' && k.nazwa ? k.nazwa : (x.d.name || x.id);
      const sl = typeof k.slug === 'string' && /^[a-z0-9-]+$/.test(k.slug) ? k.slug : x.ext ? 'zewnatrz' : (slug(nazwa) || 'pokoj');
      const odm = (p) => (typeof k[p] === 'string' && k[p] ? k[p] : mala(nazwa));
      const T = odczyty(wszystkie, x.id, x.temp), H = odczyty(wszystkie, x.id, x.hum);
      const tO = T.length ? T[T.length - 1] : null, hO = H.length ? H[H.length - 1] : null;
      // „24 h temu”: odczyt najbliższy chwili o dobę przed ostatnim, nie dalej niż półtorej godziny od niej
      let t24 = null;
      if (tO) {
        let best = null;
        T.forEach((r) => { const d = Math.abs(r.t - (tO.t - 24 * GODZ)); if (d <= 1.5 * GODZ && (!best || d < best.d)) best = { d, v: r.v }; });
        t24 = best ? best.v : null;
      }
      let bateria = null;
      if (!x.ext && x.batt) {
        const b = wszystkie[x.id + '|' + x.batt] || [];
        for (let i = b.length - 1; i >= 0; i--) { const v = String(b[i].raw).trim().toLowerCase(); if (BAT[v]) { bateria = v; break; } }
      }
      const pk = (kod, rodzaj) => {
        const p = odczyty(bezArt, x.id, kod).map((r) => ({ x: r.t, y: r.v }));
        return x.ext ? p : despike(p, rodzaj).pts;
      };
      D2.pokoje.push({
        id: x.id, nazwa, slug: wolny(sl), kolor: x.ext ? BARWA_DWORU : PENS[kolor++ % PENS.length], zewnatrz: x.ext,
        dop: odm('dop'), bier: odm('bier'), miejsc: odm('miejsc'), okno: STRONY_SWIATA[k.okno] ? k.okno : null, wywiew: k.wywiew === true,
        temp: tO ? tO.v : null, wilg: hO ? hO.v : null, odczyt_ms: tO || hO ? Math.max(tO ? tO.t : 0, hO ? hO.t : 0) : null,
        bateria, temp_24h_temu: t24,
        seria: { start_ms: start, krok_ms: GODZ, temp: seriaGodzinowa(pk(x.temp, 'temp'), start, koniec), wilg: seriaGodzinowa(pk(x.hum, 'hum'), start, koniec) },
        _T: T, _bezArt: [odczyty(bezArt, x.id, x.temp), odczyty(bezArt, x.id, x.hum)],
      });
    });
    const dw = D2.pokoje.find((p) => p.zewnatrz);
    D2.pokoje.forEach((p) => {
      if (p.zewnatrz) return;
      const g = granica(p.temp, dw ? dw.temp : null);
      p.prog_wilg = Math.round((g != null ? g : HUM_ALERT) * 10) / 10;
    });

    // ---- doby: 30 kolejnych dat warszawskich kończących się dziś (null, gdy doby brak — także dzisiejszej tuż po
    // północy, zanim kolektor ją zapisze); „7 dni” to ostatnie 7 z nich ----
    const dzis = lok(teraz).klucz, dni = [];
    for (let i = 29; i >= 0; i--) dni.push(przesunDate(dzis, -i));
    const dz = {};
    (z.dzienne || []).forEach((r) => { dz[r.date + '|' + r.id + '|' + r.code] = r; });
    const wiersz = (d, id, kod) => { const r = kod ? dz[d + '|' + id + '|' + kod] : null; return r && isFinite(r.min) && isFinite(r.avg) && isFinite(r.max) ? r : null; };
    lista.forEach((x) => {
      const dd = { dni, temp: [], wilg: [] };
      dni.forEach((d) => {
        [['temp', x.temp], ['wilg', x.hum]].forEach((q) => { const r = wiersz(d, x.id, q[1]); dd[q[0]].push(r ? [r.min, r.avg, r.max] : null); });
      });
      D2.dobowe_30_dni[x.id] = dd;
      const z7 = {};
      [['t', x.temp], ['h', x.hum]].forEach((q) => {
        const w = dni.slice(-7).map((d) => wiersz(d, x.id, q[1])).filter(Boolean);
        if (!w.length) return;
        const n = w.reduce((a, r) => a + (r.n > 0 ? r.n : 0), 0);
        z7[q[0]] = [Math.min.apply(null, w.map((r) => r.min)), Math.max.apply(null, w.map((r) => r.max))];
        // średnia ważona liczbą odczytów (jak dawna tabela zakresów), nie średnia ze średnich dób
        z7[q[0] + '_sr'] = n ? w.reduce((a, r) => a + r.avg * (r.n > 0 ? r.n : 0), 0) / n : sr(w.map((r) => r.avg));
      });
      D2.zakresy_7_dni[x.id] = z7;
    });

    // ---- komfort dziś: średnie godzinowe (godzina od pełnej) od północy warszawskiej, bez artefaktów ----
    const polnoc = polnocWarszawy(teraz);
    D2.pokoje.forEach((p) => {
      if (p.zewnatrz) return;
      const kub = {};
      p._bezArt.forEach((rz, i) => rz.forEach((r) => {
        if (r.t < polnoc || r.t > teraz) return;
        const b = Math.floor(r.t / GODZ), q = kub[b] || (kub[b] = [0, 0, 0, 0]);
        q[i * 2] += r.v; q[i * 2 + 1]++;
      }));
      const pkt = Object.keys(kub).filter((b) => kub[b][1] && kub[b][3]).map((b) => ({ x: kub[b][0] / kub[b][1], y: kub[b][2] / kub[b][3] }));
      const o = ocenKomfort(pkt);
      if (o) D2.komfort_dzis.push({ id: p.id, pokoj: p.nazwa, proc: Math.round(o.udzial * 100), glownie: o.udzial >= 1 ? null : o.glownie });
    });

    // ---- najdłuższa przerwa między odczytami temperatury w dobie przed zbiórką (dawny pasek stanu) ----
    D2.pokoje.forEach((p) => {
      if (p.zewnatrz) return;
      const t = p._T.filter((r) => r.t >= chwila - 24 * GODZ && r.t <= chwila).map((r) => r.t);
      for (let i = 1; i < t.length; i++) D2.przerwa_ms = Math.max(D2.przerwa_ms || 0, t[i] - t[i - 1]);
    });
    D2.pokoje.forEach((p) => { delete p._T; delete p._bezArt; });

    // ---- jak wietrzyć: najwilgotniejszy (bezwzględnie) pokój z oknem i partner z przeciwnej strony ----
    const zOknem = D2.pokoje.filter((p) => !p.zewnatrz && p.okno && absHum(p.temp, p.wilg) != null)
      .sort((a, b) => absHum(b.temp, b.wilg) - absHum(a.temp, a.wilg));
    const wywiew = D2.pokoje.filter((p) => p.wywiew).map((p) => p.miejsc);
    const drzwi = wywiew.length ? ` Drzwi zostaw otwarte — wywiew idzie kratkami w ${wywiew.join(' i ')}.` : '';
    if (zOknem.length) {
      const a = zOknem[0], b = zOknem.find((x) => x.okno !== a.okno);
      D2.wietrzenie.jak = (b ? `Na przestrzał: ${mala(a.nazwa)} (${STRONY_SWIATA[a.okno]}) i ${mala(b.nazwa)} (${STRONY_SWIATA[b.okno]}).` :
        `Zacznij od ${a.dop} (${STRONY_SWIATA[a.okno]}) — tam najwilgotniej.`) + drzwi;
    }

    // ---- reguły domu z data/dom/stan.json; plik starszy od zbiórki o ponad 3 godz. (dom.py padł, a kolektor szedł
    // dalej) mówiłby o stanie sprzed godzin, więc wtedy reguł nie ma ----
    const ds = z.dom, dms = ds ? czasIso(ds.updated) : null;
    if (ds && ds.pokoje && typeof ds.pokoje === 'object' && dms != null && (D2.zbiorka_ms == null || D2.zbiorka_ms - dms <= CISZA_EKRANU)) {
      D2.dom = ds.pokoje;
      D2.dom_ms = dms;
    }
  }

  // ---- pogoda (Open-Meteo); pliku może nie być, a powietrze bywa {} ----
  const W = z.pogoda;
  if (W && W.current && typeof W.current === 'object') {
    const d = W.daily, a = W.air && typeof W.air === 'object' ? W.air : {};
    const KL = ['weather_code', 'temperature_2m_max', 'temperature_2m_min', 'precipitation_probability_max', 'precipitation_sum'];
    let dni = null;
    if (d && Array.isArray(d.time) && d.time.length && KL.every((k) => Array.isArray(d[k]))) {
      dni = { time: d.time.slice(0, 3) };
      KL.forEach((k) => { dni[k] = d[k].slice(0, 3); });
    }
    const aqi = jestLiczba(a.european_aqi) ? Math.round(a.european_aqi) : null;
    D2.pogoda = { teraz: W.current, dni, aqi,
      aqi_opis: aqi == null ? null : aqi <= 20 ? 'dobra' : aqi <= 40 ? 'dostateczna' : aqi <= 60 ? 'umiarkowana' : aqi <= 80 ? 'słaba' : aqi <= 100 ? 'zła' : 'bardzo zła',
      pm25: jestLiczba(a.pm2_5) ? Math.round(a.pm2_5) : null, pm10: jestLiczba(a.pm10) ? Math.round(a.pm10) : null };
  }

  // ---- rośliny z data/rosliny/stan.json (werdykt, ocena światła i stałe gatunku liczy rosliny.py) ----
  const S = z.rosliny && typeof z.rosliny === 'object' ? z.rosliny : null;
  // `blad` i wiek stanu: przy błędzie toru werdykty zostają sprzed błędu, więc strona musi wiedzieć, że są stare
  D2.rosliny_blad = S && typeof S.blad === 'string' && S.blad.trim() ? S.blad.trim() : null;
  D2.rosliny_ms = S ? czasIso(S.updated) : null;
  D2.rosliny_stare = D2.rosliny_ms != null && D2.zbiorka_ms != null && D2.zbiorka_ms - D2.rosliny_ms > STARY_STAN_ROSLIN;
  if (!S || !Array.isArray(S.rosliny)) D2.blad_roslin = 'brak';
  else if (!S.rosliny.length) D2.blad_roslin = 'pusto';
  else {
    const nazwaPokoju = (id) => (konf[id] && konf[id].nazwa) || (urz[id] && urz[id].name) || '';
    S.rosliny.forEach((s) => {
      if (!s || typeof s.nazwa !== 'string') return;
      const o = s.ostatnie || {}, v = (k) => (o[k] && jestLiczba(o[k].v) ? o[k].v : null), ts = (k) => (o[k] ? czasIso(o[k].ts) : null);
      const od = czasIso(s.od), sz = s.szereg || {}, krok = (jestLiczba(sz.krok_min) && sz.krok_min > 0 ? sz.krok_min : 60) * 6e4, s0 = czasIso(sz.od);
      let seria;
      if (s0 != null && Array.isArray(sz.gleba)) {
        // punkty sprzed wbicia czujnika to sonda w powietrzu albo w innej doniczce — seria zaczyna się od wbicia
        let i0 = 0;
        if (od != null) while (i0 < sz.gleba.length && s0 + i0 * krok < od) i0++;
        const wytnij = (a) => (Array.isArray(a) ? a : []).slice(i0).map((x) => (jestLiczba(x) ? x : null));
        seria = { start_ms: s0 + i0 * krok, krok_ms: krok, gleba: wytnij(sz.gleba), temp: wytnij(sz.temp), wilg: wytnij(sz.wilg), swiatlo: wytnij(sz.swiatlo) };
      } else seria = { start_ms: teraz, krok_ms: GODZ, gleba: [], temp: [], wilg: [], swiatlo: [] };
      const odD = od != null ? lok(od).klucz : '';
      // doby światła od wbicia czujnika, z jakimkolwiek pomiarem; najwyżej ostatni tydzień (lista na ekranie)
      const swiatlo = (Array.isArray(s.swiatlo_dobowe) ? s.swiatlo_dobowe : [])
        .filter((d) => d && typeof d.data === 'string' && jestLiczba(d.lxh) && jestLiczba(d.pokrycie) && d.pokrycie > 0 && d.data >= odD).slice(-7);
      const zakres = (a) => (Array.isArray(a) && a.length === 2 && a.every(jestLiczba) ? a : null);
      const gl = ts('gleba'), wszTs = Object.keys(o).map(ts).filter((x) => x != null);
      D2.rosliny.push({
        nazwa: s.nazwa, gatunek: s.gatunek, slug: wolny(slug(s.nazwa) || 'roslina'),
        nazwa_pelna: typeof s.nazwa_pelna === 'string' ? s.nazwa_pelna : null, temp_zakres: zakres(s.temp_zakres), wilg_zakres: zakres(s.wilg_zakres),
        swiatlo_za_duzo_lx: jestLiczba(s.swiatlo_za_duzo_lx) ? s.swiatlo_za_duzo_lx : null,
        pokoj: nazwaPokoju(s.pokoj), od_ms: od != null ? od : seria.start_ms, werdykt: s.werdykt, uwagi: Array.isArray(s.uwagi) ? s.uwagi : [],
        gleba: v('gleba'), gleba_ms: gl != null ? gl : (wszTs.length ? Math.max.apply(null, wszTs) : null), temp: v('temp'), wilg: v('wilg'), swiatlo_lx: v('swiatlo'),
        bateria: o.bateria && typeof o.bateria.v === 'string' ? o.bateria.v.toLowerCase() : null,
        sucho: s.sucho, szczyt: jestLiczba(s.szczyt) ? s.szczyt : null, prog: s.prog, prog_gleba: jestLiczba(s.prog_gleba) ? s.prog_gleba : null, R: jestLiczba(s.R) ? s.R : null,
        swiatlo_dobowe: swiatlo, swiatlo_potrzeba_lxh: jestLiczba(s.swiatlo_potrzeba_lxh) ? s.swiatlo_potrzeba_lxh : null,
        swiatlo_pelne_doby: jestLiczba(s.swiatlo_pelne_doby) ? s.swiatlo_pelne_doby : 0,
        swiatlo_wczoraj_lxh: jestLiczba(s.swiatlo_wczoraj_lxh) ? s.swiatlo_wczoraj_lxh : null,
        swiatlo_szczyt_lx_wczoraj: jestLiczba(s.swiatlo_szczyt_lx_wczoraj) ? s.swiatlo_szczyt_lx_wczoraj : null,
        swiatlo_ocena: s.swiatlo_ocena && typeof s.swiatlo_ocena === 'object' ? s.swiatlo_ocena : null,
        podlania: (Array.isArray(s.podlania) ? s.podlania : []).map((p) => ({ ms: czasIso(p && p.ts), przed: p && p.przed, szczyt: p && p.szczyt, liczy: !!(p && p.liczy), pominiete: !!(p && p.pominiete) }))
          .filter((p) => p.ms != null),
        seria,
      });
    });
  }

  // ---- „Ostatnie” powiadomienia: z obu plików, tylko wysłane naprawdę i do co najmniej jednego telefonu ----
  const wpisy = [];
  [z.powDom, z.powRosliny].forEach((p) => {
    if (!p || !Array.isArray(p.historia)) return;
    p.historia.forEach((h) => {
      if (!h || h.na_sucho !== false || typeof h.tytul !== 'string') return;
      // brak pola `telefony` (wpisy sprzed ustawień per telefon) = oba telefony
      const tel = h.telefony == null ? ['android', 'iphone'] : Array.isArray(h.telefony) ? h.telefony.filter((t) => typeof t === 'string') : [];
      const ms = czasIso(h.ts);
      if (tel.length && ms != null) wpisy.push({ ms, tytul: h.tytul, telefony: tel });
    });
  });
  wpisy.sort((a, b) => b.ms - a.ms);
  D2.powiadomienia = { lista: wpisy.slice(0, 10), tryb_dom: z.powDom ? z.powDom.tryb : null, tryb_rosliny: z.powRosliny ? z.powRosliny.tryb : null };
  return D2;
}

/* ---------- wczytywanie ---------- */
const PAMIEC_MIESIECY = new Map();   // kolektor dopisuje tylko ostatnie dni, więc starsze miesiące bierzemy z pamięci
/* null: pliku nie ma (404) albo jest zepsuty; wyjątek: brak sieci. `scisle`: błąd HTTP i zły JSON to też wyjątek —
   przy odświeżaniu w tle 503 z Pages albo portal Wi-Fi oddający HTML ze statusem 200 to nie „pliku nie ma”. */
async function pobierz(sciezka, tekst, scisle) {
  const r = await fetch(sciezka, { cache: 'no-cache' });
  if (!r.ok) { if (scisle) throw new Error(sciezka + ': HTTP ' + r.status); return null; }
  if (tekst) return r.text();
  try { return await r.json(); } catch (e) { if (scisle) throw e; return null; }
}
/* klucz miesiąca wg UTC, jak nazwy plików kolektora */
const kluczMiesiaca = (ms) => { const d = new Date(ms); return d.getUTCFullYear() + '-' + dwa(d.getUTCMonth() + 1); };
function potrzebneMiesiace(m) {
  const lista = Array.isArray(m.months) ? m.months : [], up = czasIso(m.updated), koniec = Math.min(Date.now(), up != null ? up : Date.now()), k = {};
  for (let t = koniec - DNI_SUROWYCH * 864e5; t < koniec + 864e5; t += 864e5) k[kluczMiesiaca(Math.min(t, koniec))] = true;
  return Object.keys(k).sort().filter((x) => lista.indexOf(x) >= 0);
}
/* null: miesiąc nie przyszedł (błąd HTTP). Nieudanego nie zapamiętujemy: zapamiętane [] zostałoby na ekranie do
   następnej zbiórki, choć serwer odpowiada już poprawnie. Przy odświeżaniu (`scisle`) każdy błąd to wyjątek. */
async function wczytajMiesiac(k, scisle) {
  if (PAMIEC_MIESIECY.has(k)) return PAMIEC_MIESIECY.get(k);
  const t = await pobierz('data/' + k + '.csv', true, scisle);
  if (t == null) return null;
  const w = czytajCsv(t);
  PAMIEC_MIESIECY.set(k, w);
  return w;
}
const plikDanych = (nazwa) => (typeof nazwa === 'string' && /^[\w.-]+$/.test(nazwa) ? 'data/' + nazwa : null);
/* `swieze`: po nowej zbiórce zapominamy dwa najnowsze miesiące — tylko je kolektor zmienia.
   `poprzednie` (odświeżanie w tle): miesiąc z błędem przerywa całość (wyjątek, widok zostaje), a plik nieobowiązkowy
   z błędem bierze poprzednią wersję — kolektor tych plików nie kasuje, więc błąd po pliku, który był, jest chwilowy.
   Przy pierwszym wczytaniu błąd HTTP to brak pliku i komunikat na ekranie, jak dotąd. */
async function wczytajPliki(swieze, manifest, poprzednie) {
  const odsw = !!poprzednie;
  const m = manifest !== undefined ? manifest : await pobierz('data/index.json');
  const mies = m && m.devices ? potrzebneMiesiace(m) : [];
  if (swieze) mies.slice(-2).forEach((k) => PAMIEC_MIESIECY.delete(k));
  const dzienne = m && plikDanych(m.daily), pogodaP = m && plikDanych(m.weather);
  const opcja = (sciezka, klucz, tekst, czytaj) => pobierz(sciezka, tekst, odsw).then((x) => (czytaj ? czytaj(x) : x),
    () => (odsw && poprzednie[klucz] != null ? poprzednie[klucz] : czytaj ? czytaj(null) : null));
  const w = await Promise.all([
    Promise.all(mies.map((k) => wczytajMiesiac(k, odsw))),
    dzienne ? opcja(dzienne, 'dzienne', true, czytajDzienne) : [],
    pogodaP ? opcja(pogodaP, 'pogoda') : null,
    opcja('data/dom/stan.json', 'dom'),
    opcja('data/rosliny/stan.json', 'rosliny'),
    opcja('data/dom/powiadomienia.json', 'powDom'),
    opcja('data/rosliny/powiadomienia.json', 'powRosliny'),
    opcja('pokoje.json', 'pokoje'),
  ]);
  const wiersze = [].concat.apply([], w[0].filter((a) => a)).sort((x, y) => x.t - y.t);
  // niepełny komplet (miesiąc z błędem przy pierwszym wczytaniu): następne odświeżenie pobiera dane mimo tej samej zbiórki
  return { manifest: m, wiersze, dzienne: w[1], pogoda: w[2], dom: w[3], rosliny: w[4], powDom: w[5], powRosliny: w[6], pokoje: w[7],
    niepelne: w[0].some((a) => !a) };
}

/* ---------- licznik na ikonie (Badging API) ----------
   Liczba spraw wymagających uwagi: pokoje z oknem, „przewietrz” albo milczącym czujnikiem (te same reguły co karta)
   i rośliny z poziomem ≤ 3 (jak kropka na zakładce). Tylko przy zgodzie na powiadomienia — bez niej iOS licznika

}

    TERAZ = Date.now();

/* ---------- nowe dane i odświeżanie ----------
   Zainstalowana na telefonie aplikacja nie ma paska przeglądarki, a telefon trzyma ją w tle godzinami. Przy powrocie
   (po co najmniej 2 min), co 10 min przy widocznej karcie i po odzyskaniu sieci sprawdzamy manifest; przebudowa
   danych tylko wtedy, gdy kolektor coś dopisał, a bez tego samo przerysowanie z zegarem. Bieżący widok, zakresy
   i wybory zostają. */
let Z = null, uruchomiona = false;
function zastosuj(z) {

}
let odroczone = false;
function przerysujPoDanych() {
  // nie w trakcie przesuwania strony palcem: przerysowanie zerwałoby gest
  if (G.id != null || G.anim || G.kier) {
    if (!odroczone) { odroczone = true; setTimeout(() => { odroczone = false; przerysujPoDanych(); }, 1000); }
    return;
  }
  const w = stan.widok;
  if ((w === 'pokoj' && !pokojWg(stan.slug)) || (w === 'roslina' && !roslinaWg(stan.slug))) {
    const r = rodzic(w);
    try { history.replaceState(null, '', '#' + r); } catch (e) { /* plik lokalny */ }
    pokaz({ widok: r }, null);
    return;
  }
  // na Powiadomieniach tylko lista „Ostatnie”: przerysowanie zabrałoby wpisywany klucz
  if (w === 'powiadomienia') { TERAZ = Date.now(); const l = $('#pw-ostatnie'); if (l) l.innerHTML = htmlOstatnie(); rysujZakladki(); sprawdzDochodzenie(); return; }
  przerysuj();
}
const ODSWIEZ_CO = 10 * 60e3, ODSWIEZ_PO_POWROCIE = 2 * 60e3;
let ostatnieOdswiezenie = Date.now(), odswiezanie = null;
/* Odświeżanie w tle nigdy nie kasuje widoku: błąd HTTP albo zły JSON manifestu (503 albo 404 z Pages w trakcie
   wdrożenia, portal Wi-Fi z HTML-em) i błąd któregoś miesiąca CSV to „nic nowego”, a nie „danych nie ma”. Z i jego
   manifest zmieniają się dopiero po udanym komplecie, więc następne odświeżenie spróbuje znowu. */
function odswiezDane() {
  if (odswiezanie) return odswiezanie;
  odswiezanie = (async () => {
    try {
      const m = await pobierz('data/index.json', false, true);
      ostatnieOdswiezenie = Date.now();
      if (!m || typeof m !== 'object') return false;
      if (Z && Z.manifest && !Z.niepelne && m.updated === Z.manifest.updated) return false;   // kolektor nic nie dopisał
      zastosuj(await wczytajPliki(true, m, Z || {}));
      return true;
    } catch (e) { return false; /* brak sieci albo błąd serwera: zostaje to, co widać */ }
  })().then((x) => { odswiezanie = null; return x; });
  return odswiezanie;
}
/* powrót bez nowych danych: „temu” i „dziś” mają się zgadzać z zegarem; po północy doby przesuwają się o jedną */
function odswiezWidok() {
  if (!D || !Z) return;
  if (lok(Date.now()).klucz !== lok(D.chwila_ms).klucz) { zastosuj(Z); return; }
  if (stan.widok !== 'powiadomienia') przerysujPoDanych();
}
/* Przerysowanie bez nowych danych jest tanie (bez pobierania), a bez niego „N min temu”, „Ostatnia zbiórka N godz.
   temu”, „dziś/wczoraj” i doby stałyby w miejscu na karcie otwartej godzinami — kolektor potrafi milczeć pół dnia.
   Dlatego przy każdym powrocie od razu, a co 10 min po sprawdzeniu manifestu, gdy nic nowego nie przyszło. */
document.addEventListener('visibilitychange', () => {
  if (document.hidden || !uruchomiona) return;
  ustawLicznik();
  odswiezWidok();
  if (Date.now() - ostatnieOdswiezenie > ODSWIEZ_PO_POWROCIE) odswiezDane();
});
setInterval(() => { if (!document.hidden && uruchomiona) odswiezDane().then((nowe) => { if (!nowe) odswiezWidok(); }); }, ODSWIEZ_CO);

/* ---------- wejście z powiadomienia ----------
   Adresy: `#fikus`, `#lazienka`, `#rosliny`… (D7), a w starych powiadomieniach `rosliny.html#roslina=Fikus`.
   Przy zimnym starcie iPhone otwiera start_url zamiast adresu z powiadomienia (WebKit 263687), więc sw.js zostawia
   cel w Cache API („./cel”), a tu go odbieramy: tylko świeży (5 min), zawsze kasowany, żeby następne uruchomienie
   z ikony otworzyło Dom. Druga próba po chwili, bo kolejności startu strony i obsługi kliknięcia na iPhonie nie
   zmierzyliśmy. Przy otwartym oknie service worker przysyła cel wiadomością. */
const CEL_CACHE = 'cel-powiadomienia', CEL_WAZNY = 5 * 60e3;
function hashZCelu(c) {
  if (typeof c !== 'string') return null;
  if (/^https?:/i.test(c)) {
    let u = null;
    try { u = new URL(c); } catch (e) { return null; }
    if (u.origin !== location.origin) return null;
    c = u.pathname.split('/').pop() + u.search + u.hash;
  }
  let m = /^rosliny\.html(?:\?[^#]*)?(#.*)?$/.exec(c);
  if (m) return m[1] || '#rosliny';
  m = /^(?:\.\/|index\.html)?(#[a-z0-9-]+)$/.exec(c);
  return m ? m[1] : null;
}
function przejdzDoCelu(h) {
  const c = cel(h);
  if (!$('#arkusz').hidden) schowajArkusz();
  if (c.widok === 'pokoj' || c.widok === 'roslina') { zatrzymajGest(); otworzZLinku(c); } else idz(c.widok);
}
async function celZPowiadomienia() {
  try {
    if (!('caches' in window)) return;
    const r = await caches.match('./cel', { cacheName: CEL_CACHE });
    if (!r) return;
    await caches.delete(CEL_CACHE);
    const o = await r.json(), h = hashZCelu(o && o.cel);
    if (!h || !(Math.abs(Date.now() - o.ts) < CEL_WAZNY)) return;
    // adres startowy już ma szczegół (Android otwiera cel wprost): zostaje
    if (stan.widok === 'pokoj' || stan.widok === 'roslina') return;
    przejdzDoCelu(h);
  } catch (e) { /* bez Cache API albo zepsuty wpis — nic */ }
}

  const pref = /rosliny\.html$/.test(location.pathname) ? './' : '';

    try { history.replaceState(null, '', pref + '#' + rodzic(c.widok)); history.pushState({ strona: true }, '', '#' + c.slug); } catch (e) { /* plik lokalny */ }
  } else {
    try { history.replaceState(null, '', pref + '#' + c.widok); } catch (e) { /* plik lokalny */ }

}
(function () {
  $('#v-dom').innerHTML = '<h1 class="duzy">Dom</h1>' + htmlBledu(null);
  rysujZakladki();
  wczytajPliki(false).then((z) => z, () => null).then((z) => {

})();
if ('serviceWorker' in navigator) {
  // kliknięcie w powiadomienie przy otwartej aplikacji: service worker przysyła cel, przechodzimy w swoim routingu
  navigator.serviceWorker.addEventListener('message', (e) => {
    const d = e.data, h = d && d.typ === 'cel' ? hashZCelu(d.cel) : null;
    if (h && uruchomiona) przejdzDoCelu(h);
  });
  // wiadomości od service workera czekają w kolejce, dopóki strona jej nie otworzy (onmessage albo startMessages)
  if (navigator.serviceWorker.startMessages) navigator.serviceWorker.startMessages();
  // instalacja na ekranie i tryb offline; po load, żeby nie konkurowała o łącze z pierwszym wczytaniem danych
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

/* przestrzeń dla testów (tests/frontend/strona.spec.js): budowa danych i obliczenia bez sięgania do DOM */
window.SH = {

  zbudujDane, despike, granica, slug, cel, hashZCelu, seriaGodzinowa, ocenKomfort, czytajCsv, polnocWarszawy, liczba, tekstGranicy,
  odswiezDane, licznikSpraw, przejdzDoCelu, stanDomu: () => stanDomu().typ,
  milczy: (s) => milczy(pokojWg(s)), noc: (s) => nocPokoju(pokojWg(s)),
  ustawOstatnieOdswiezenie(t) { ostatnieOdswiezenie = t; },
  platforma, nieDotarlo, odebraneId, odswiezTelefon, get stanTelefonu() { return TEL.stan; },
  stale: { FRSI, WILG_POWIERZCHNI, HUM_ALERT, POKRYCIE_PELNEJ_DOBY, DOMYSLNE },
};
})();
