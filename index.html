.pens{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:1px;background:var(--edge);border:1px solid var(--edge);margin-top:1px}.pen{background:var(--panel);padding:.75rem .9rem .85rem;position:relative;overflow:hidden}.pen::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--c);box-shadow:0 0 12px 1px var(--c);opacity:.9}.pen b{display:flex;align-items:center;font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600;font-size:.74rem;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin:0 0 .35rem .5rem}.pen .read{display:flex;align-items:baseline;gap:.5rem;margin-left:.5rem;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}.pen .t{font-size:1.6rem;font-weight:400;color:var(--c);line-height:1;text-shadow:0 0 18px color-mix(in srgb,var(--c) 45%,transparent)}.pen .h{font-size:.95rem;color:var(--text);opacity:.82}.pen .foot{display:flex;flex-wrap:wrap;align-items:baseline;gap:.15rem .55rem;margin:.4rem 0 0 .5rem;font-family:"IBM Plex Sans Condensed",sans-serif;font-size:.71rem;letter-spacing:.04em;color:var(--faint)}.pen .trend{font-family:"IBM Plex Mono",monospace;font-weight:500;color:var(--dim)}

.floor svg{display:block;width:100%;max-width:392px;height:auto;margin:0 auto}.rm-name{font:600 12px "IBM Plex Sans Condensed",sans-serif;letter-spacing:.09em;text-transform:uppercase;fill:var(--dim)}.rm-temp{font:400 30px "IBM Plex Mono",monospace;letter-spacing:-.03em}.rm-hum{font:400 13px "IBM Plex Mono",monospace;fill:var(--dim)}.rm-quiet{fill:rgba(255,255,255,.018);stroke:var(--edge);stroke-width:1.5;stroke-dasharray:5 4}.rm-quiet-t{font:400 10px "IBM Plex Sans Condensed",sans-serif;letter-spacing:.14em;text-transform:uppercase;fill:var(--faint)}.rm-door{stroke:var(--pen-1);stroke-width:5;stroke-linecap:round;opacity:.8}.map-legend{display:flex;flex-wrap:wrap;align-items:center;gap:.45rem .9rem;margin-top:.9rem;font:400 .72rem "IBM Plex Sans Condensed",sans-serif;color:var(--dim)}.map-legend span{display:inline-flex;align-items:center;gap:.35rem}.map-legend .bar{display:inline-block;width:58px;height:7px}.map-legend em{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:.7rem;color:var(--faint)}.legend-dot{width:8px;height:8px;border-radius:50%}.legend-dot.ok{background:var(--ok)}.legend-dot.warn{background:var(--warn)}.legend-dot.bad{background:var(--bad)}

<body><main class="sheet">
<header class="masthead"><h1><span class="nib">&#9134;</span> Smart Home</h1><span class="stamp" id="stamp">wczytywanie&hellip;</span></header>
<section id="app" hidden>
  <div class="statusbar" id="statusbar"></div>
  <div class="pens" id="pens"></div>
  <div class="controls"><span class="lbl">Zakres</span><button class="range" data-hours="24">24 h</button><button class="range" data-hours="168" aria-pressed="true">7 dni</button><button class="range" data-hours="720">30 dni</button><button class="range" data-hours="0">całość</button><label class="chk" title="Ukrywa krótkie skoki, po których wartość wraca do poprzedniego poziomu — np. gdy czujnik trafi komuś do ręki. Trwałe zmiany, takie jak włączony grzejnik, zostają."><input type="checkbox" id="filtr" checked>Ukryj chwilowe skoki</label><div class="toggles" id="toggles"></div></div>

  <div class="trace"><h2>Temperatura <small>&deg;C</small><small id="cut-temp"></small></h2><div class="plot"><canvas id="temp"></canvas></div></div>
  <div class="trace"><h2>Wilgotność względna <small>%</small><small id="cut-hum"></small></h2><div class="plot"><canvas id="hum"></canvas></div></div>

  <table class="summary" id="summary"></table><table class="summary" id="health"></table>

  <div class="bottom-layout">
    <section class="panel"><h2>Plan mieszkania · aktualny stan</h2>
      <div class="floor" id="floor" role="img" aria-label="Rzut mieszkania: temperatura, wilgotność i status łączności w każdym pokoju"></div>
      <div class="map-legend" id="maplegend"></div>
    </section>
    <div class="rightcol">
      <section class="panel" id="wx-panel" hidden><h2>Pogoda i powietrze</h2><div class="wx" id="wx"></div></section>
      <section class="panel"><h2>Ostatnie zdarzenia</h2><div class="events" id="events"></div></section>
    </div>
  </div>
</section><div class="notice" id="notice" hidden></div>
</main>
<script>
const PENS=['#e8a13c','#5fb8e0','#5fce9e','#e2708f','#b79ae8','#d4c95f'];const CSS=getComputedStyle(document.documentElement);const C=n=>CSS.getPropertyValue(n).trim();
const state={hours:168,filtr:true,cut:{},devices:[],rows:[],daily:[],months:[],off:new Set(),charts:{},health:[],updated:null};const monthCache=new Map();
/* --- rytm systemu: te trzy liczby decydują, co jest awarią, a co normą --- */
const HEARTBEAT=60*60000;      // czujniki raportują same z siebie co ~1 godz., nawet gdy nic się nie zmienia
const COLLECT=60*60000;        // kolektor w GitHub Actions chodzi raz na godzinę
const PAIR_TOL=5000;           // temperatura i wilgotność z jednego raportu bywają rozjechane o sekundę
const STALE_WARN=HEARTBEAT+COLLECT+30*60000;   // 2,5 godz. — dopiero tyle znaczy "coś jest nie tak"
const STALE_BAD=6*3600e3;
const MISS_GAP=2.5*HEARTBEAT;  // przerwa uznana za zgubione raporty
const HUM_ALERT=65;            // próg wilgotności dla ostrzeżenia o pleśni
/* --- rzut mieszkania: jedyne miejsce do poprawiania proporcji pokoi --- */
const WMO_ICO={
 clear:'<circle cx="12" cy="12" r="4.2"/><path d="M12 2.2v2.3M12 19.5v2.3M2.2 12h2.3M19.5 12h2.3M5.1 5.1l1.6 1.6M17.3 17.3l1.6 1.6M18.9 5.1l-1.6 1.6M6.7 17.3l-1.6 1.6"/>',
 partly:'<circle cx="8.6" cy="8.6" r="3.1"/><path d="M8.6 2.6v1.7M2.6 8.6h1.7M4.4 4.4l1.2 1.2M12.8 4.4l-1.2 1.2"/><path d="M8 19.5h9.2a3.3 3.3 0 0 0 .3-6.6 4.8 4.8 0 0 0-9-.7A3.1 3.1 0 0 0 8 19.5z"/>',
 cloud:'<path d="M7 18.5h10a3.5 3.5 0 0 0 .3-7 5.2 5.2 0 0 0-9.8-.8A3.3 3.3 0 0 0 7 18.5z"/>',
 fog:'<path d="M7 13.5h10a3.5 3.5 0 0 0 .3-7 5.2 5.2 0 0 0-9.8-.8A3.3 3.3 0 0 0 7 13.5z"/><path d="M4 17h16M6.5 20.5h11"/>',
 rain:'<path d="M7 14.5h10a3.5 3.5 0 0 0 .3-7 5.2 5.2 0 0 0-9.8-.8A3.3 3.3 0 0 0 7 14.5z"/><path d="M9.5 17.5l-1 3.5M13 17.5l-1 3.5M16.5 17.5l-1 3.5"/>',
 snow:'<path d="M7 13.5h10a3.5 3.5 0 0 0 .3-7 5.2 5.2 0 0 0-9.8-.8A3.3 3.3 0 0 0 7 13.5z"/><path d="M9 17v3.6M7.5 18.8h3M15 17v3.6M13.5 18.8h3"/>',
 storm:'<path d="M7 13.5h10a3.5 3.5 0 0 0 .3-7 5.2 5.2 0 0 0-9.8-.8A3.3 3.3 0 0 0 7 13.5z"/><path d="M13.2 16l-3.2 4h2.7l-1.4 3.4"/>'};
const WMO={0:['clear','bezchmurnie'],1:['partly','przeważnie słonecznie'],2:['partly','częściowe zachmurzenie'],3:['cloud','pochmurno'],
 45:['fog','mgła'],48:['fog','mgła z szronem'],51:['rain','słaba mżawka'],53:['rain','mżawka'],55:['rain','gęsta mżawka'],
 56:['rain','marznąca mżawka'],57:['rain','marznąca mżawka'],61:['rain','słaby deszcz'],63:['rain','deszcz'],65:['rain','ulewa'],
 66:['rain','marznący deszcz'],67:['rain','marznący deszcz'],71:['snow','słaby śnieg'],73:['snow','śnieg'],75:['snow','intensywny śnieg'],
 77:['snow','śnieg ziarnisty'],80:['rain','przelotny deszcz'],81:['rain','przelotny deszcz'],82:['rain','gwałtowna ulewa'],
 85:['snow','przelotny śnieg'],86:['snow','intensywny śnieg'],95:['storm','burza'],96:['storm','burza z gradem'],99:['storm','burza z gradem']};
const ico=k=>`<svg viewBox="0 0 24 24" aria-hidden="true">${WMO_ICO[k]||WMO_ICO.cloud}</svg>`;
// wilgotność bezwzględna w g/m³ — jedyny sposób, żeby uczciwie porównać powietrze po obu stronach ściany
const absHum=(t,rh)=>![t,rh].every(v=>v!=null&&isFinite(v))?null:2.1674*6.112*Math.exp(17.62*t/(243.12+t))*rh/(273.15+t);
function aqiBand(v){if(v==null||!isFinite(v))return null;
  return v<=20?['dobra','--ok']:v<=40?['dostateczna','--ok']:v<=60?['umiarkowana','--warn']:v<=80?['słaba','--warn']:v<=100?['zła','--bad']:['bardzo zła','--bad']}
/* Pokój wiąże się z czujnikiem przez dev (identyfikator Tuya) — nazwa jest tylko
   zapasem. Inaczej zmiana nazwy czujnika w aplikacji Tuya po cichu wygasza pokój
   na rzucie. Identyfikatory podejrzysz przez `python fetch.py --discover`. */
const PLAN={w:400,h:500,door:[20,192,20,246],rooms:[
  // przedpokój pierwszy, żeby pokoje rysowały się na jego kresce
  {name:'Przedpokój',poly:'240,135 292,135 292,282 240,282 240,235 75,235 75,359 20,359 20,175 240,175',label:[132,212]},
  {name:'Sypialnia',dev:'bf7e2a70935af7de78mjqt',x:195,y:0,w:195,h:135},
  {name:'Łazienka',dev:'bfd6f4f87fea9d866dvpve',x:292,y:135,w:88,h:147},
  {name:'Salon',dev:'bf43cf664d6644420axva3',x:226,y:282,w:154,h:148},
  {name:'Kuchnia',dev:'bf5741c97c96fa85b1d7do',x:0,y:359,w:174,h:135}
]};
const HEAT_MIN=19,HEAT_MAX=28,HUE_COLD=205,HUE_HOT=22;   // skala cieplna rzutu — dopasuj do swojego zakresu
function heat(t){if(t==null||!isFinite(t))return null;const k=Math.max(0,Math.min(1,(t-HEAT_MIN)/(HEAT_MAX-HEAT_MIN)));return HUE_COLD+(HUE_HOT-HUE_COLD)*k}
function hsl2rgb(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1));return[f(0),f(8),f(4)].map(v=>Math.round(v*255))}
const rgba=(h,a)=>{const c=h==null?[125,141,155]:hsl2rgb(h,58,57);return `rgba(${c[0]},${c[1]},${c[2]},${a})`};
/* Wyskok = nagły skok, po którym wartość wraca tam, skąd wyszła.
   Trwała zmiana (grzejnik, otwarte okno) nie wraca, więc zostaje nietknięta. */
const SPIKE={temp:{jump:1.5,back:1.0},hum:{jump:8,back:5},rise:12*60000,max:90*60000};
function despike(pts,kind){
  const p=SPIKE[kind];
  if(!p||pts.length<3)return{pts,cut:0};
  const bad=new Set();
  let i=1;
  while(i<pts.length){
    let k=i-1;
    while(k>0&&pts[i].x-pts[k-1].x<=SPIKE.rise)k--;   // poziom sprzed wzrostu
    const base=pts[k].y;

  const home=inside.reduce((a,b)=>a+b,0)/inside.length,diff=out-home;
  const aqi=state.weather?.air?.european_aqi,band=aqiBand(aqi);
  if(band&&aqi>60)return{c:'--bad',title:'Lepiej nie otwierać okien',
    text:`Jakość powietrza na zewnątrz jest ${band[0]} — indeks ${Math.round(aqi)}. Wietrz krótko albo poczekaj.`};
  const liczby=`Na zewnątrz ${fmtNum(out)} g/m³ pary wodnej, w mieszkaniu ${fmtNum(home)}.`;
  if(diff<-0.7)return{c:'--ok',title:'Dobry moment na wietrzenie',text:`${liczby} Otwarte okno osuszy powietrze.`};
  if(diff>0.7)return{c:'--warn',title:'Wietrzenie dołoży wilgoci',text:`${liczby} Na wymianę powietrza — owszem, na osuszenie — nie teraz.`};
  return{c:'--dim',title:'Wietrzenie bez wpływu na wilgotność',text:`${liczby} Po obu stronach ściany podobnie.`};
}
function renderWeather(){
  const w=state.weather,panel=document.getElementById('wx-panel');
  if(!w?.current){panel.hidden=true;return}
  panel.hidden=false;
  const now=w.current,day=w.daily||{},air=w.air||{},[glif,opis]=WMO[now.weather_code]||['cloud','—'];
  const out=[`<div class="wx-now"><div><div class="wx-head">${ico(glif)}<span class="wx-t">${fmtNum(now.temperature_2m,1)}&deg;</span></div>`
    +`<div class="wx-desc">${opis}</div></div>`
    +`<div class="wx-meta"><u>odczuw.</u><span>${fmtNum(now.apparent_temperature,1)}&deg;</span>`
    +`<u>wilg.</u><span>${fmtNum(now.relative_humidity_2m,0)} %</span>`
    +`<u>wiatr</u><span>${fmtNum(now.wind_speed_10m,0)} km/h</span></div></div>`];
  const dni=day.time||[];
  if(dni.length)out.push('<div class="wx-days">'+dni.slice(0,3).map((d,i)=>{
    const[g]=WMO[day.weather_code?.[i]]||['cloud'];
    const nazwa=i===0?'dziś':new Intl.DateTimeFormat('pl-PL',{weekday:'short'}).format(new Date(d+'T12:00:00'));
    const pp=day.precipitation_probability_max?.[i],ps=day.precipitation_sum?.[i];
    const opad=(pp==null?'':`<div class="p">opad ${Math.round(pp)}%</div>`)+(ps>=1?`<div class="p">${Math.round(ps)} mm</div>`:'');
    return `<div class="wx-day"><b>${nazwa}</b>${ico(g)}<div class="r">${fmtNum(day.temperature_2m_max?.[i],0)}&deg; <i>${fmtNum(day.temperature_2m_min?.[i],0)}&deg;</i></div>${opad}</div>`;
  }).join('')+'</div>');
  const band=aqiBand(air.european_aqi);
  if(band)out.push(`<div class="wx-air"><span class="wx-aqi" style="color:var(${band[1]})">AQI ${Math.round(air.european_aqi)}</span><span>jakość ${band[0]}</span>`
    +`<span>PM2,5 <em>${fmtNum(air.pm2_5,0)}</em></span><span>PM10 <em>${fmtNum(air.pm10,0)}</em> µg/m³</span></div>`);
  const tip=airingTip(now);
  if(tip)out.push(`<div class="wx-tip" style="--c:var(${tip.c})"><b>${tip.title}</b><span>${tip.text}</span></div>`);
  document.getElementById('wx').innerHTML=out.join('');
}
function renderEvents(){
  const ev=[],lag=state.updated?Date.now()-state.updated:null;
  // gdy stoi kolektor, wszystkie czujniki wyglądają na martwe — mówimy to raz, zamiast czterech fałszywych alarmów
  if(lag!=null&&lag>STALE_WARN){
    ev.push({t:state.updated,status:lag>STALE_BAD?'bad':'warn',text:`Kolektor nie zapisał nic od ${fmtDur(lag)} — sprawdź zakładkę Actions, to nie wina czujników`});
  }else{
    state.health.forEach(r=>{
      if(r.suspicious){const idx=r.gaps.indexOf(r.worst);ev.push({t:r.times[idx+1]||r.last,status:'warn',text:`${esc(r.d.name)} — cisza przez ${fmtDur(r.worst)}, przepadło ok. ${plRap(r.missed)}`})}
      if(r.age>STALE_WARN&&isFinite(r.age))ev.push({t:r.last,status:r.age>STALE_BAD?'bad':'warn',text:`${esc(r.d.name)} — ostatni raport ${fmtAgo(r.last)}`});
      if(r.batt==='niski')ev.push({t:r.last,status:'warn',text:`${esc(r.d.name)} — bateria na wyczerpaniu, wymień ogniwo`});
      if(r.humHigh>=.25)ev.push({t:r.last,status:'warn',text:`${esc(r.d.name)} — wilgotność powyżej ${HUM_ALERT}% przez ${Math.round(r.humHigh*100)}% doby, przewietrz`});
    });
  }
  ev.sort((a,b)=>(b.t||0)-(a.t||0));
  const box=document.getElementById('events');
  box.innerHTML=ev.slice(0,7).map(e=>`<div class="event ${e.status}"><i class="edot"></i><div class="et">${e.text}</div><div class="es">${e.t?new Intl.DateTimeFormat('pl-PL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(e.t)):''}</div></div>`).join('')||'<div class="empty">Wszystko w normie w ostatnich 24 godzinach.</div>';
}

function renderSummary(tempSets,humSets){const stats=pts=>{const ys=pts.map(p=>p.y);return ys.length?{min:Math.min(...ys),max:Math.max(...ys),avg:ys.reduce((a,b)=>a+b,0)/ys.length}:null};const byId=sets=>Object.fromEntries(sets.map(s=>[s.device.id,s.stats||stats(s.points)]));const T=byId(tempSets),H=byId(humSets),shown=state.devices.filter(d=>T[d.id]||H[d.id]);document.getElementById('summary').innerHTML=`<caption>Zakresy · ${rangeLabel()}</caption><thead><tr><th>Czujnik</th><th>min °C</th><th>śr °C</th><th>max °C</th><th>min %</th><th>śr %</th><th>max %</th></tr></thead><tbody>`+shown.map(d=>{const t=T[d.id],h=H[d.id];return`<tr style="--c:${d.color}"><td>${esc(d.name)}</td><td>${fmtNum(t?.min)}</td><td>${fmtNum(t?.avg)}</td><td>${fmtNum(t?.max)}</td><td>${fmtNum(h?.min,0)}</td><td>${fmtNum(h?.avg,0)}</td><td>${fmtNum(h?.max,0)}</td></tr>`}).join('')+'</tbody>'}
function renderHealth(){document.getElementById('health').innerHTML=`<caption>Łączność z bramką · diagnostyka ostatnich 24 h · alarm dopiero powyżej ${fmtDur(MISS_GAP)} ciszy</caption><thead><tr><th>Czujnik</th><th>temp.</th><th>wilg.</th><th>mediana odstępu</th><th>najdłuższa przerwa</th><th>para t+w</th><th>bateria</th><th>ostatni</th></tr></thead><tbody>`+state.health.map(r=>`<tr style="--c:${r.d.color}"><td>${esc(r.d.name)}</td><td>${r.nT}</td><td>${r.nH}</td><td>${fmtDur(r.median)}</td><td class="${r.suspicious?'warn-text':''}">${fmtDur(r.worst)}</td><td class="${r.paired!=null&&r.paired<.9?'warn-text':''}">${r.paired==null?'–':Math.round(r.paired*100)+'%'}</td><td class="${r.batt==='niski'?'warn-text':''}">${r.batt||'–'}</td><td class="${r.age>STALE_BAD?'bad-text':r.age>STALE_WARN?'warn-text':''}">${r.last?fmtAgo(r.last):'–'}</td></tr>`).join('')+'</tbody>'}
function rangeLabel(){const base={24:'ostatnie 24 godziny',168:'ostatnie 7 dni',720:'ostatnie 30 dni',0:'cała historia'}[state.hours]+(useDaily()?' · dobowe min/śr/max':''),oldest=state.since??state.rows[0]?.t,from=state.hours?Date.now()-state.hours*3600e3:0;if(oldest&&oldest>from+3600e3)return`${base} · dane od ${new Intl.DateTimeFormat('pl-PL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(oldest))}`;return base}
async function render(){await ensureRows();computeHealth();renderStatus();renderPens();renderMap();renderWeather();renderEvents();const T=series('temp'),H=series('hum');draw('temp',T,'°C',1);draw('hum',H,'%',0);['temp','hum'].forEach(k=>document.getElementById('cut-'+k).textContent=useDaily()?'':state.cut[k]?` · ukryto ${plSkok(state.cut[k])}`:'');renderSummary(T,H);renderHealth();const newest=state.rows.at(-1)?.t;document.getElementById('stamp').textContent='ostatni zapis · '+(newest?new Intl.DateTimeFormat('pl-PL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(newest)):'–')}
boot();
</script></body></html>
