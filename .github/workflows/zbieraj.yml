name: Zbieranie odczytów

on:
  schedule:
    # Raz na godzinę, poza pełną godziną — GitHub może opóźniać scheduled runs.
    # Opóźnienie nie gubi danych, bo fetch.py dociąga od miejsca, w którym skończył
    # poprzedni udany przebieg (do 7 dni wstecz), ale od końca
    # sierpnia 2026 wynosi 3–5 godz. i strona jest przez to nieświeża. Właściwym zegarem
    # jest zewnętrzny cron wołający workflow_dispatch (README, „Kolektor co godzinę");
    # ten harmonogram zostaje jako zapas.
    - cron: '19 * * * *'
  push:
    branches: [main]
    # Zmiana kodu ma od razu dostać świeże dane, bez klikania w Actions. Strona
    # przebudowuje się osobno i sama, przy każdym pushu na main.
    #
    # data/** wyłączone, żeby zapis odczytów nie wywoływał kolejnego zbierania.
    # GitHub i tak nie odpala workflowów dla pushy zrobionych przez GITHUB_TOKEN,
    # ale gdyby ten krok kiedykolwiek dostał własny token albo deploy key, ten
    # filtr jest jedyną rzeczą stojącą między nami a pętlą bez końca.
    #
    # odkryj.yml też: jego zmiana na main to sposób, w jaki Claude odpala „Pokaż
    # urządzenia w Tuya" (nie może uruchamiać workflowów), i nie ma przy tym kosztować
    # przebiegu kolektora.
    paths-ignore:
      - 'data/**'
      - '.github/workflows/odkryj.yml'
      - '.github/workflows/powiadomienie-testowe.yml'
  workflow_dispatch:        # przycisk "Run workflow" do ręcznego odpalenia

permissions:
  contents: write
  # krok wysyłki powiadomień sam zakłada zgłoszenie, gdy subskrypcja telefonu wygaśnie —
  # watchdog tego nie zobaczy, bo wynik wysyłki powstaje już po commicie
  issues: write

concurrency:
  group: zbieranie
  cancel-in-progress: false

jobs:
  zbierz:
    runs-on: ubuntu-latest
    # Bez limitu zawieszony przebieg trzymałby grupę `zbieranie` przez sześć godzin —
    # a `cancel-in-progress: false` znaczy, że kolejne czekają w kolejce zamiast go
    # zastąpić. Sześć godzin ciszy kolektora to sześć godzin zbliżania się do granicy
    # 7 dni, po której logi Tuya przepadają. Zwykły przebieg to 2–3 minuty.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pobierz odczyty z chmury Tuya i zapisz
        env:
          TUYA_CLIENT_ID: ${{ secrets.TUYA_CLIENT_ID }}
          TUYA_CLIENT_SECRET: ${{ secrets.TUYA_CLIENT_SECRET }}
          TUYA_REGION: eu
          # cztery czujniki klimatu + klimatyzator FERSK VIND 2 (zbierany jest z niego
          # wyłącznie włącznik, żeby było wiadomo, kiedy chodził)
          TUYA_DEVICE_IDS: 'bf43cf664d6644420axva3,bf7e2a70935af7de78mjqt,bf5741c97c96fa85b1d7do,bfd6f4f87fea9d866dvpve,bfe38c4af789b0c8fbxte4'
          # Granica historii: 14.08.2026, północ czasu polskiego. Przesunięcie wpisane
          # jawnie, bo parse_since czyta datę bez strefy jako UTC, a to byłaby druga
          # w nocy naszego czasu. Starsze odczyty kasuje purge_before i nie wracają,
          # dopóki ta wartość tu stoi.
          TUYA_SINCE: '2026-08-14T00:00+02:00'
          TUYA_MIN_GAP: '1.2'
          # Pogoda z Open-Meteo — bez klucza API. Puste OUTDOOR_LAT wyłącza tę część.
          OUTDOOR_LAT: '50.2649'          # Katowice
          OUTDOOR_LON: '19.0238'
          OUTDOOR_NAME: 'Na zewnątrz'
          # Strefa, według której tną się doby w agregatach data/dzienne.csv
          TZ_LOCAL: 'Europe/Warsaw'
          # Powiadomienia o roślinach (ROSLINY.md, etap 4). „na-sucho": reguły liczą się
          # i lądują w data/rosliny/powiadomienia.json, ale nic nie idzie na telefon —
          # pierwszy tydzień po wdrożeniu. „wlaczone": krok niżej wysyła.
          POWIADOMIENIA: 'na-sucho'
          # Znacznik przebiegu w każdym wpisie powiadomień: wysyłka bierze tylko wpisy
          # z tym znacznikiem z opublikowanego commita, więc ponowienie, przegrany wyścig
          # ani „Re-run" w Actions nie wyślą niczego drugi raz.
          PRZEBIEG: ${{ github.run_id }}-${{ github.run_attempt }}
        # Pobranie i zapis w jednym kroku, bo przy przegranym wyścigu o gałąź trzeba
        # policzyć odczyty jeszcze raz — na drzewie tego, kto zapisał pierwszy. Okno
        # zaczyna się tam, gdzie skończył poprzedni udany przebieg (`pobrane_do`
        # w data/index.json), najdalej 7 dni wstecz, czyli tyle, ile daje Tuya: po
        # postoju kolektora nadrabia wszystko, co jeszcze jest do odzyskania, a na co
        # dzień kosztuje jedno zapytanie na czujnik. Logika siedzi w zapisz.sh, żeby
        # dała się przetestować — patrz tests/test_zapisz.py.
        run: sh zapisz.sh

      # Po udanym zapisie: wysyłka tylko tego, co ten przebieg opublikował na main.
      # Jedyny krok z sekretami powiadomień. Bez sekretów kończy się na zielono
      # z linią „brak subskrypcji" — dzięki temu zakładka działa, zanim telefony
      # zostaną podpięte.
      - name: Wyślij powiadomienia o roślinach
        env:
          VAPID_KLUCZ_PRYWATNY: ${{ secrets.VAPID_KLUCZ_PRYWATNY }}
          PUSH_ANDROID: ${{ secrets.PUSH_ANDROID }}
          PUSH_IPHONE: ${{ secrets.PUSH_IPHONE }}
          GH_TOKEN: ${{ github.token }}
          PRZEBIEG: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          git fetch -q origin main
          if ! git show origin/main:data/rosliny/powiadomienia.json > "$RUNNER_TEMP/powiadomienia.json" 2>/dev/null; then
            echo "Na main nie ma jeszcze data/rosliny/powiadomienia.json — nic do wysłania."
            exit 0
          fi
          ILE=$(jq --arg p "$PRZEBIEG" '[.historia[]? | select(.przebieg == $p and (.na_sucho | not))] | length' "$RUNNER_TEMP/powiadomienia.json")
          if [ "$ILE" = "0" ]; then
            echo "Ten przebieg nie ma powiadomień do wysłania."
            exit 0
          fi
          pip install -q -r requirements-powiadomienia.txt
          python wyslij.py --plik "$RUNNER_TEMP/powiadomienia.json" --przebieg "$PRZEBIEG"
