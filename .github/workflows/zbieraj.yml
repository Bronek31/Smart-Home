name: Zbieranie odczytów

on:
  schedule:
    # Raz na godzinę, poza pełną godziną — GitHub może opóźniać scheduled runs.
    # Opóźnienie nie jest problemem, bo fetch.py pobiera pełne okno 7 dni.
    - cron: '19 * * * *'
  push:
    branches: [main]
    # Zmiana kodu ma od razu dostać świeże dane, bez klikania w Actions. Strona
    # przebudowuje się osobno i sama, przy każdym pushu na main.
    #
    # data/** wyłączone, żeby zapis odczytów nie wywoływał kolejnego zbierania.
    # GitHub i tak nie odpala workflowów dla pushy zrobionych przez GITHUB_TOKEN,
    # ale gdyby ten krok kiedykolwiek dostał własny token albo deploy key, ten
    # filtr jest jedyną rzeczą stojącą między nami a pętlą bez końca.
    paths-ignore:
      - 'data/**'
  workflow_dispatch:        # przycisk "Run workflow" do ręcznego odpalenia

permissions:
  contents: write

concurrency:
  group: zbieranie
  cancel-in-progress: false

jobs:
  zbierz:
    runs-on: ubuntu-latest
    # Bez limitu zawieszony przebieg trzymałby grupę `zbieranie` przez sześć godzin —
    # a `cancel-in-progress: false` znaczy, że kolejne czekają w kolejce zamiast go
    # zastąpić. Sześć godzin ciszy kolektora to sześć godzin zbliżania się do granicy
    # 7 dni, po której logi Tuya przepadają. Zwykły przebieg to 2–3 minuty.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pobierz odczyty z chmury Tuya i zapisz
        env:
          TUYA_CLIENT_ID: ${{ secrets.TUYA_CLIENT_ID }}
          TUYA_CLIENT_SECRET: ${{ secrets.TUYA_CLIENT_SECRET }}
          TUYA_REGION: eu
          # cztery czujniki klimatu + klimatyzator FERSK VIND 2 (zbierany jest z niego
          # wyłącznie włącznik, żeby było wiadomo, kiedy chodził)
          TUYA_DEVICE_IDS: 'bf43cf664d6644420axva3,bf7e2a70935af7de78mjqt,bf5741c97c96fa85b1d7do,bfd6f4f87fea9d866dvpve,bfe38c4af789b0c8fbxte4'
          # Granica historii: 14.08.2026, północ czasu polskiego. Przesunięcie wpisane
          # jawnie, bo parse_since czyta datę bez strefy jako UTC, a to byłaby druga
          # w nocy naszego czasu. Starsze odczyty kasuje purge_before i nie wracają,
          # dopóki ta wartość tu stoi.
          TUYA_SINCE: '2026-08-14T00:00+02:00'
          TUYA_MIN_GAP: '1.2'
          # Pogoda z Open-Meteo — bez klucza API. Puste OUTDOOR_LAT wyłącza tę część.
          OUTDOOR_LAT: '50.2649'          # Katowice
          OUTDOOR_LON: '19.0238'
          OUTDOOR_NAME: 'Na zewnątrz'
          # Strefa, według której tną się doby w agregatach data/dzienne.csv
          TZ_LOCAL: 'Europe/Warsaw'
        # Pobranie i zapis w jednym kroku, bo przy przegranym wyścigu o gałąź trzeba
        # policzyć odczyty jeszcze raz — na drzewie tego, kto zapisał pierwszy. Pełne
        # okno 7 dni, jakie daje Tuya: przy postoju kolektora dopiero to pozwala nadrobić
        # wszystko, co jeszcze jest do odzyskania. Logika siedzi w zapisz.sh, żeby dała
        # się przetestować — patrz tests/test_zapisz.py.
        run: sh zapisz.sh
