name: Zbieranie odczytów

on:
  schedule:
    # Dwa razy na godzinę, poza pełną godziną (o :00 GitHub jest najbardziej
    # obciążony i wtedy najczęściej gubi przebiegi). Nie prosimy o przebieg
    # co 5 minut — GitHub i tak by go nie dał. Zamiast tego jeden przebieg
    # zbiera co 5 minut przez ~25 minut, więc wystarczy, że harmonogram
    # trafi raz na pół godziny.
    - cron: '9,39 * * * *'
  workflow_dispatch:
    inputs:
      minuty:
        description: 'Ile minut ma trwać zbieranie w tym przebiegu'
        required: false
        default: '28'

permissions:
  contents: write

concurrency:
  group: zbieranie
  cancel-in-progress: false

jobs:
  zbierz:
    runs-on: ubuntu-latest
    # Twardy limit: gdyby przebieg się zawiesił, blokowałby grupę concurrency
    # w nieskończoność i kolejne przebiegi nigdy by nie wystartowały.
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Zbieraj odczyty co 5 minut
        env:
          TUYA_CLIENT_ID: ${{ secrets.TUYA_CLIENT_ID }}
          TUYA_CLIENT_SECRET: ${{ secrets.TUYA_CLIENT_SECRET }}
          # eu = Central Europe (domyślne dla Polski), we = Western Europe,
          # us = Western America, ue = Eastern America, in = India, cn = China
          TUYA_REGION: eu
          TUYA_DEVICE_IDS: 'bf43cf664d6644420axva3,bf7e2a70935af7de78mjqt,bf5741c97c96fa85b1d7do,bfd6f4f87fea9d866dvpve'
          # Zbieraj wyłącznie odczyty od podanego momentu. Puste = bez granicy.
          TUYA_SINCE: ''
          # Zwiększ do 2 lub 3, jeśli w logu widzisz "limit zapytań Tuya".
          TUYA_MIN_GAP: '1.2'
          # Przez wejście workflow_dispatch, nie wprost w skrypcie — inaczej
          # treść wpisana w formularzu trafiłaby do powłoki jako kod.
          MINUTY: ${{ github.event.inputs.minuty || '28' }}
        run: |
          set -u
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          KONIEC=$(( $(date +%s) + MINUTY * 60 ))

          while : ; do
            START=$(date +%s)
            echo "--- pobieranie $(date -u '+%H:%M:%S') UTC ---"

            # Okno 1 dnia zamiast 3: Tuya i tak trzyma historię po swojej
            # stronie, więc nawet po godzinnej przerwie nic nie ginie —
            # następny przebieg dociąga zaległe odczyty.
            python fetch.py --days 1 || echo "::warning::fetch.py zakończył się błędem, próbuję dalej"

            git add data/
            if git diff --staged --quiet; then
              echo "Brak nowych odczytów — nic do zapisania."
            else
              git commit -q -m "odczyty: $(date -u '+%Y-%m-%d %H:%M') UTC"
              # Rebase przed pushem: bez tego push przepada, gdy w międzyczasie
              # sam commitniesz cokolwiek do main, a odczyty z tej iteracji giną.
              for PROBA in 1 2 3; do
                if git pull --rebase --autostash -q && git push -q; then
                  echo "Zapisano."
                  break
                fi
                echo "Push nieudany (próba $PROBA), ponawiam za 5 s…"
                sleep 5
              done
            fi

            if [ $(( START + 300 )) -ge $KONIEC ]; then
              echo "Budżet czasu wyczerpany — kończę przebieg."
              break
            fi
            # Odejmujemy czas trwania pobierania, żeby odstęp wynosił
            # równe 5 minut, a nie 5 minut plus czas pracy skryptu.
            RESZTA=$(( START + 300 - $(date +%s) ))
            [ $RESZTA -gt 0 ] && sleep $RESZTA
          done
