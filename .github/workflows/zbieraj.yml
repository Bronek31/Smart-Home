name: Zbieranie odczytów

on:
  schedule:
    # Raz na godzinę, poza pełną godziną — GitHub może opóźniać scheduled runs.
    # Opóźnienie nie jest problemem, bo fetch.py pobiera pełne okno 7 dni.
    - cron: '19 * * * *'
  push:
    branches: [main]
    # Zmiana kodu ma od razu dostać świeże dane, bez klikania w Actions. Strona
    # przebudowuje się osobno i sama, przy każdym pushu na main.
    #
    # data/** wyłączone, żeby zapis odczytów nie wywoływał kolejnego zbierania.
    # GitHub i tak nie odpala workflowów dla pushy zrobionych przez GITHUB_TOKEN,
    # ale gdyby ten krok kiedykolwiek dostał własny token albo deploy key, ten
    # filtr jest jedyną rzeczą stojącą między nami a pętlą bez końca.
    paths-ignore:
      - 'data/**'
  workflow_dispatch:        # przycisk "Run workflow" do ręcznego odpalenia

permissions:
  contents: write

concurrency:
  group: zbieranie
  cancel-in-progress: false

jobs:
  zbierz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pobierz odczyty z chmury Tuya
        env:
          TUYA_CLIENT_ID: ${{ secrets.TUYA_CLIENT_ID }}
          TUYA_CLIENT_SECRET: ${{ secrets.TUYA_CLIENT_SECRET }}
          TUYA_REGION: eu
          # cztery czujniki klimatu + klimatyzator FERSK VIND 2 (zbierany jest z niego
          # wyłącznie włącznik, żeby było wiadomo, kiedy chodził)
          TUYA_DEVICE_IDS: 'bf43cf664d6644420axva3,bf7e2a70935af7de78mjqt,bf5741c97c96fa85b1d7do,bfd6f4f87fea9d866dvpve,bfe38c4af789b0c8fbxte4'
          TUYA_SINCE: ''
          TUYA_MIN_GAP: '1.2'
          # Pogoda z Open-Meteo — bez klucza API. Puste OUTDOOR_LAT wyłącza tę część.
          OUTDOOR_LAT: '50.2649'          # Katowice
          OUTDOOR_LON: '19.0238'
          OUTDOOR_NAME: 'Na zewnątrz'
          # Strefa, według której tną się doby w agregatach data/dzienne.csv
          TZ_LOCAL: 'Europe/Warsaw'
        # Pełne okno, jakie daje Tuya. Przy postoju kolektora dopiero to pozwala
        # nadrobić wszystko, co jeszcze jest do odzyskania.
        run: python fetch.py --days 7

      - name: Zapisz zmiany
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Brak nowych odczytów — nic do zapisania."
            exit 0
          fi
          git commit -m "odczyty: $(date -u '+%Y-%m-%d %H:%M') UTC"
          # Ktoś mógł commitnąć na main w trakcie przebiegu — wtedy push leci odrzucony
          # i przebieg świeci na czerwono, choć nic złego się nie stało. Dociągamy więc
          # i próbujemy ponownie. Rebase jest bezpieczny, bo ruszamy wyłącznie data/.
          for proba in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push odrzucony (próba $proba) — dociągam main i powtarzam."
            git pull --rebase --autostash origin main || break
          done
          echo "Nie udało się zapisać odczytów po trzech próbach." >&2
          exit 1
